<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Der Weg des Ritters — ein Action-Rollenspiel im Ostpreußen des späten Mittelalters."
    />
    <title>Der Weg des Ritters</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0e12'/%3E%3Cpath d='M14 4h4v6h6v4h-6v14h-4V14H8v-4h6z' fill='%23e9e6dc'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="loader">
      <div class="loaderInner">
        <div class="crest" aria-hidden="true">
          <svg viewBox="0 0 100 120" width="70" height="84">
            <path
              d="M50 4 L92 18 V62 C92 92 72 108 50 116 C28 108 8 92 8 62 V18 Z"
              fill="#12131a"
              stroke="#8a7a52"
              stroke-width="2"
            />
            <g fill="#e9e6dc">
              <rect x="43" y="26" width="14" height="66" />
              <rect x="18" y="52" width="64" height="14" />
              <rect x="36" y="22" width="28" height="8" />
              <rect x="36" y="88" width="28" height="8" />
              <rect x="14" y="46" width="8" height="26" />
              <rect x="78" y="46" width="8" height="26" />
            </g>
          </svg>
        </div>
        <h1>Der Weg des Ritters</h1>
        <p class="sub">Ostpreußen · 1409</p>
        <div class="barOuter"><div id="loaderBar"></div></div>
        <p id="loaderText">Beschwöre den Winter …</p>
      </div>
    </div>

    <div id="rotate">
      <div class="rotateInner">
        <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
          <rect x="20" y="6" width="24" height="42" rx="4" fill="none" stroke="#d8cfae" stroke-width="3" />
          <path d="M12 52 a24 24 0 0 0 40 0" fill="none" stroke="#d8cfae" stroke-width="3" />
          <path d="M52 52 l-6 -6 M52 52 l-8 2" fill="none" stroke="#d8cfae" stroke-width="3" />
        </svg>
        <p>Bitte das Gerät quer halten</p>
      </div>
    </div>

    <noscript>
      <div class="noscript">Dieses Spiel benötigt JavaScript.</div>
    </noscript>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
