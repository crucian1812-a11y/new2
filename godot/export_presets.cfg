; Web export.
;
; Two settings here are load-bearing rather than taste:
;
;   variant/thread_support=false — a threaded Godot 4 web build needs
;   SharedArrayBuffer, which needs the COOP/COEP response headers, which
;   GitHub Pages does not send. Threaded builds simply refuse to start there.
;
;   exclude_filter — the un-reproportioned skeletons stay in the repository
;   because tools/grim_skeletons.py reads them, but shipping both sets to a
;   phone doubles the download for nothing. Same for the packs nothing
;   references yet.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/market/*, assets/ui/*, assets/BinbunVFX_Vol2/DarkMagicFX/dark_magic_fx_scene_*.tscn, assets/enemies/Skeleton_Minion.glb, assets/enemies/Skeleton_Rogue.glb, assets/enemies/Skeleton_Warrior.glb, assets/enemies/Skeleton_Mage.glb"
export_path="../build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
