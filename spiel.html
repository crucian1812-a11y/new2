  }

  dust(x, y, amount = 8) {
    for (let i = 0; i < amount; i++) {
      const a = rnd(0, TAU);
      const sp = rnd(30, 130);
      this.spawn({
        kind: 'smoke',
        x,
        y,
        z: rnd(0, 6),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.6,
        vz: rnd(6, 30),
        life: rnd(0.35, 0.8),
        maxLife: 0.8,
        size: rnd(6, 14),
        grow: rnd(10, 22),
        color: [96, 92, 84],
        grav: -4,
        drag: 3.2,
        alpha: 0.3,
      });
    }
  }

  shards(x, y, z, amount, color, speed = 260) {
    for (let i = 0; i < amount; i++) {
      const a = rnd(0, TAU);
      const sp = rnd(speed * 0.4, speed);
      this.spawn({
        kind: 'shard',
        x,
        y,
        z,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.6,
        vz: rnd(60, 240),
        life: rnd(0.4, 1.0),
        maxLife: 1,
        size: rnd(2.4, 6),
        rot: rnd(0, TAU),
        spin: rnd(-12, 12),
        color,
        grav: 560,
        drag: 1.2,
        glow: true,
      });
    }
  }

  ring(x, y, opts = {}) {
    this.rings.push({
      x,
      y,
      r: opts.r0 ?? 8,
      r1: opts.r1 ?? 120,
      life: opts.life ?? 0.45,
      age: 0,
      color: opts.color || PAL.torchCore,
      width: opts.width ?? 5,
      glow: opts.glow ?? true,
      fill: opts.fill ?? false,
    });
  }

  /**
   * A crescent of light swept through the air. This is what a sword blow
   * actually looks like on screen \u2014 the arc, not the number.
   */
  slash(x, y, z, angle, radius, opts = {}) {
    this.slashes.push({
      x,
      y,
      z,
      angle,
      radius,
      arc: opts.arc ?? 1.5,
      dir: opts.dir ?? 1,
      life: opts.life ?? 0.24,
      age: 0,
      color: opts.color || PAL.steelLight,
      thickness: opts.thickness ?? 0.38,
    });
    if (this.slashes.length > 24) this.slashes.shift();
  }

  beam(x0, y0, x1, y1, opts = {}) {
    this.beams.push({
      x0,
      y0,
      x1,
      y1,
      z0: opts.z0 ?? 0,
      z1: opts.z1 ?? 0,
      life: opts.life ?? 0.22,
      age: 0,
      color: opts.color || PAL.thunder,
      width: opts.width ?? 6,
      jagged: opts.jagged ?? false,
    });
  }

  /**
   * Damage on a target merges into the number already floating above it, so a
   * whirlwind reads as one rising total instead of a column of digits.
   */
  damage(owner, x, y, z, amount, opts = {}) {
    for (const t of this.texts) {
      if (t.owner === owner && t.age < 0.42) {
        t.value += amount;
        t.str = Math.round(t.value).toString();
        t.age = Math.min(t.age, 0.1);
        t.size = Math.min(t.baseSize * 1.5, t.size + 1.4);
        if (opts.crit) {
          t.crit = true;
          t.color = opts.color || t.color;
        }
        return;
      }
    }
    const size = opts.size ?? 15;
    this.texts.push({
      owner,
      value: amount,
      baseSize: size,
      x,
      y,
      z,
      str: Math.round(amount).toString(),
      life: opts.life ?? 0.95,
      age: 0,
      color: opts.color || [240, 236, 226],
      size,
      vx: rnd(-18, 18),
      vz: rnd(70, 110),
      crit: opts.crit || false,
      bold: false,
    });
    if (this.texts.length > 40) this.texts.shift();
  }

  text(x, y, z, str, opts = {}) {
    this.texts.push({
      x,
      y,
      z,
      str,
      life: opts.life ?? 0.95,
      age: 0,
      color: opts.color || [240, 236, 226],
      size: opts.size ?? 15,
      vx: opts.vx ?? rnd(-24, 24),
      vz: opts.vz ?? rnd(70, 110),
      crit: opts.crit || false,
      bold: opts.bold || false,
      levelUp: opts.levelUp || false,
    });
    if (this.texts.length > 60) this.texts.shift();
  }

  // -- weather --------------------------------------------------------------

  setWeather(kind, amount) {
    this.weatherKind = kind;
    this.weatherAmount = amount;
    this.weather.length = 0;
    const n = Math.round(amount * (kind === 'mist' ? 26 : 150));
    for (let i = 0; i < n; i++) {
      this.weather.push({
        x: Math.random(),
        y: Math.random(),
        z: Math.random(),
        s: Math.random(),
        p: Math.random() * TAU,
      });
    }
  }

  // -- update ---------------------------------------------------------------

  update(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.parts.splice(i, 1);
        continue;
      }
      const drag = Math.exp(-(p.drag || 0) * dt);
      p.vx *= drag;
      p.vy *= drag;
      p.vz -= (p.grav || 0) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      if (p.z < 0) {
        p.z = 0;
        p.vz *= -0.28;
        p.vx *= 0.5;
        p.vy *= 0.5;
        if (p.kind === 'blood' && p.life > 0.15) p.life = Math.min(p.life, 0.18);
      }
      if (p.grow) p.size += p.grow * dt;
      if (p.spin) p.rot += p.spin * dt;
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.age += dt;
      if (r.age > r.life) this.rings.splice(i, 1);
    }
    for (let i = this.slashes.length - 1; i >= 0; i--) {
      const sl = this.slashes[i];
      sl.age += dt;
      if (sl.age > sl.life) this.slashes.splice(i, 1);
    }
    for (let i = this.beams.length - 1; i >= 0; i--) {
      const b = this.beams[i];
      b.age += dt;
      if (b.age > b.life) this.beams.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.age += dt;
      if (t.age > t.life) {
        this.texts.splice(i, 1);
        continue;
      }
      t.x += t.vx * dt;
      t.z += t.vz * dt;
      t.vz -= 130 * dt;
    }
  }

  // -- draw -----------------------------------------------------------------

  draw(dt) {
    const R = this.r;
    const ctx = R.ctx;
    const zoom = R.cam.zoom * R.pxScale;

    // Ground rings first \u2014 they belong to the floor.
    for (const r of this.rings) {
      const k = clamp01(r.age / r.life);
      const rad = lerp(r.r, r.r1, 1 - Math.pow(1 - k, 2.4));
      const alpha = (1 - k) * (1 - k);
      const sx = R.sx(r.x);
      const sy = R.sy(r.y);
      ctx.save();
      if (r.glow) ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = css(r.color);
      ctx.lineWidth = r.width * zoom * (1 - k * 0.5);
      ctx.beginPath();
      ctx.ellipse(sx, sy, rad * zoom, rad * zoom * ISO_Y, 0, 0, TAU);
      ctx.stroke();
      if (r.fill) {
        ctx.globalAlpha = alpha * 0.22;
        ctx.fillStyle = css(r.color);
        ctx.fill();
      }
      ctx.restore();
      if (r.glow) R.emisCircle(r.x, r.y, rad * 0.6, r.color, alpha * 0.35);
    }

    // Particles
    let additive = false;
    ctx.save();
    for (const p of this.parts) {
      const sx = R.sx(p.x);
      const sy = R.sy(p.y, p.z);
      if (sx < -60 || sy < -60 || sx > R.w + 60 || sy > R.h + 60) continue;
      const t = clamp01(p.life / p.maxLife);
      const want = !!p.glow;
      if (want !== additive) {
        ctx.globalCompositeOperation = want ? 'lighter' : 'source-over';
        additive = want;
      }
      const size = p.size * zoom;
      if (p.kind === 'spark' || p.kind === 'ember') {
        const fl = p.flick ? 0.6 + 0.4 * Math.sin(p.life * 30) : 1;
        ctx.globalAlpha = t * fl;
        const c = mixc(p.color, [255, 250, 230], 1 - t);
        ctx.fillStyle = css(c);
        // Stretch along velocity so fast sparks streak.
        const vlen = Math.hypot(p.vx, p.vy * ISO_Y - p.vz) * 0.012 * zoom;
        ctx.beginPath();
        ctx.ellipse(
          sx,
          sy,
          Math.max(size * 0.5, vlen),
          size * 0.5,
          Math.atan2(p.vy * ISO_Y - p.vz, p.vx),
          0,
          TAU
        );
        ctx.fill();
      } else if (p.kind === 'blood') {
        ctx.globalAlpha = Math.min(1, t * 1.6);
        ctx.fillStyle = css(p.color);
        ctx.beginPath();
        ctx.ellipse(sx, sy, size, size * 0.72, 0, 0, TAU);
        ctx.fill();
      } else if (p.kind === 'smoke') {
        ctx.globalAlpha = (p.alpha ?? 0.4) * t * t;
        ctx.drawImage(R.softDot(p.color), sx - size, sy - size, size * 2, size * 2);
      } else if (p.kind === 'shard') {
        ctx.globalAlpha = t;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(p.rot);
        ctx.fillStyle = css(mixc(p.color, [255, 255, 255], (1 - t) * 0.4));
        ctx.beginPath();
        ctx.moveTo(-size, 0);
        ctx.lineTo(0, -size * 0.42);
        ctx.lineTo(size, 0);
        ctx.lineTo(0, size * 0.42);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      if (p.glow && size > 1.4) R.emisCircle(p.x, p.y, p.size * 1.7, p.color, t * 0.5, p.z);
    }
    ctx.restore();

    // Sword arcs, drawn as a crescent that sweeps and thins as it fades.
    for (const sl of this.slashes) {
      const k = clamp01(sl.age / sl.life);
      const alpha = Math.sin((1 - k) * Math.PI * 0.85);
      const sx = R.sx(sl.x);
      const sy = R.sy(sl.y, sl.z);
      const rOut = sl.radius * zoom * (0.86 + k * 0.3);
      const rIn = rOut * (1 - sl.thickness * (1 - k * 0.55));
      // The visible portion sweeps from the start of the arc to the end.
      const swept = sl.arc * Math.min(1, 0.35 + k * 1.2);
      const a0 = sl.angle - (sl.dir * sl.arc) / 2;
      const a1 = a0 + sl.dir * swept;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(sx, sy);
      ctx.scale(1, ISO_Y);
      ctx.beginPath();
      ctx.arc(0, 0, rOut, a0, a1, sl.dir < 0);
      ctx.arc(0, 0, rIn, a1, a0, sl.dir > 0);
      ctx.closePath();
      const g = ctx.createRadialGradient(0, 0, rIn * 0.9, 0, 0, rOut);
      g.addColorStop(0, css(sl.color, 0));
      g.addColorStop(0.55, css(sl.color, 0.55 * alpha));
      g.addColorStop(0.88, css([255, 255, 255], 0.8 * alpha));
      g.addColorStop(1, css(sl.color, 0));
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
      R.emisCircle(sl.x, sl.y, sl.radius * 0.55, sl.color, alpha * 0.3, sl.z);
    }

    // Beams (lightning, arrows in flight, chain links)
    for (const b of this.beams) {
      const k = clamp01(b.age / b.life);
      const alpha = 1 - k;
      const x0 = R.sx(b.x0);
      const y0 = R.sy(b.y0, b.z0);
      const x1 = R.sx(b.x1);
      const y1 = R.sy(b.y1, b.z1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      ctx.lineCap = 'round';
      ctx.strokeStyle = css(b.color);
      ctx.lineWidth = b.width * zoom * (1 - k * 0.4);
      ctx.beginPath();
      if (b.jagged) {
        const segs = 8;
        ctx.moveTo(x0, y0);
        for (let i = 1; i < segs; i++) {
          const t = i / segs;
          const nx = -(y1 - y0);
          const ny = x1 - x0;
          const l = Math.hypot(nx, ny) || 1;
          const off = (Math.random() - 0.5) * 26 * zoom * Math.sin(t * Math.PI);
          ctx.lineTo(lerp(x0, x1, t) + (nx / l) * off, lerp(y0, y1, t) + (ny / l) * off);
        }
        ctx.lineTo(x1, y1);
      } else {
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
      }
      ctx.stroke();
      ctx.lineWidth = Math.max(1, b.width * zoom * 0.35);
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
      ctx.stroke();
      ctx.restore();
      R.emisCircle((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, 40, b.color, alpha * 0.4, (b.z0 + b.z1) / 2);
    }
  }

  /** Numbers and shout text, drawn last so nothing hides them. */
  drawText() {
    const R = this.r;
    const ctx = R.ctx;
    const zoom = R.cam.zoom * R.pxScale;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of this.texts) {
      const k = clamp01(t.age / t.life);
      const alpha = k < 0.12 ? k / 0.12 : 1 - Math.pow((k - 0.12) / 0.88, 2.2);
      const sx = R.sx(t.x);
      const sy = R.sy(t.y, t.z);
      const pop = t.crit ? 1 + Math.max(0, 0.5 - k * 3) : 1;
      const size = t.size * zoom * pop;
      ctx.globalAlpha = alpha;
      ctx.font = `${t.crit || t.bold ? '900' : '700'} ${size.toFixed(1)}px "Trebuchet MS", system-ui, sans-serif`;
      ctx.lineWidth = Math.max(2, size * 0.22);
      ctx.strokeStyle = 'rgba(6,6,10,0.85)';
      ctx.strokeText(t.str, sx, sy);
      ctx.fillStyle = css(t.color);
      ctx.fillText(t.str, sx, sy);
    }
    ctx.restore();
  }

  /** Snow, drifting leaves, ash or rain, drawn in screen space with parallax. */
  drawWeather(dt) {
    if (!this.weatherKind || !this.weather.length) return;
    const R = this.r;
    const ctx = R.ctx;
    const t = R.time;
    const W = R.w;
    const H = R.h;
    const camX = R.cam.x;
    const camY = R.cam.y;
    ctx.save();
    const kind = this.weatherKind;

    if (kind === 'mist') {
      ctx.globalCompositeOperation = 'source-over';
      for (const p of this.weather) {
        const depth = 0.3 + p.z * 0.7;
        const x = ((p.x * W * 1.6 - camX * depth * 0.35 + t * 12 * depth) % (W * 1.6)) - W * 0.3;
        const y = ((p.y * H * 1.4 - camY * depth * 0.2) % (H * 1.4)) - H * 0.2;
        const r = (60 + p.s * 130) * depth;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(150,178,186,${(0.05 + p.s * 0.05) * this.weatherAmount})`);
        g.addColorStop(1, 'rgba(150,178,186,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      ctx.restore();
      return;
    }

    for (const p of this.weather) {
      const depth = 0.35 + p.z * 0.65;
      let x;
      let y;
      let size;
      let alpha;
      let col;
      if (kind === 'snow') {
        const drift = Math.sin(t * 1.4 + p.p) * 26 * depth;
        x = mod(p.x * W - camX * depth * 0.6 + drift + t * 24 * depth, W + 80) - 40;
        y = mod(p.y * H + t * (70 + p.s * 90) * depth - camY * depth * 0.4, H + 80) - 40;
        size = (1.1 + p.s * 2.4) * depth * R.pxScale;
        alpha = (0.35 + p.s * 0.55) * depth;
        col = '234,244,255';
      } else if (kind === 'ash') {
        const drift = Math.sin(t * 0.9 + p.p) * 34 * depth;
        x = mod(p.x * W - camX * depth * 0.6 + drift + t * 34 * depth, W + 80) - 40;
        y = mod(p.y * H + t * (34 + p.s * 54) * depth - camY * depth * 0.4, H + 80) - 40;
        size = (0.9 + p.s * 2) * depth * R.pxScale;
        alpha = (0.25 + p.s * 0.45) * depth;
        col = p.s > 0.86 ? '255,168,92' : '128,124,118';
      } else if (kind === 'leaves') {
        const drift = Math.sin(t * 1.1 + p.p) * 60 * depth;
        x = mod(p.x * W - camX * depth * 0.6 + drift + t * 46 * depth, W + 80) - 40;
        y = mod(p.y * H + t * (52 + p.s * 66) * depth - camY * depth * 0.4, H + 80) - 40;
        size = (1.6 + p.s * 3.2) * depth * R.pxScale;
        alpha = (0.3 + p.s * 0.4) * depth;
        col = p.s > 0.6 ? '150,124,54' : '86,96,48';
      } else {
        // storm \u2014 hard slanted rain
        x = mod(p.x * W - camX * depth * 0.6 + t * 200 * depth, W + 80) - 40;
        y = mod(p.y * H + t * (900 + p.s * 500) * depth - camY * depth * 0.4, H + 80) - 40;
        size = (1 + p.s * 1.4) * depth * R.pxScale;
        alpha = (0.18 + p.s * 0.3) * depth;
        col = '176,196,224';
      }
      ctx.globalAlpha = alpha * this.weatherAmount;
      ctx.fillStyle = `rgb(${col})`;
      if (kind === 'storm') {
        ctx.fillRect(x, y, size * 0.7, size * 16);
      } else if (kind === 'leaves') {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 2 + p.p);
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size * 0.5, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, size, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

function mod(a, b) {
  return ((a % b) + b) % b;
}

// ===== src/render/props.js ===========================================
// Every tree, rock, ruin and wreck in the game is drawn here with vector
// operations and cached as a bitmap. Nothing is downloaded.
//
// House rules that keep this out of "shiny plastic" territory:
//   * no pure blacks, no pure whites, no fully saturated fills;
//   * every silhouette is broken up with noise, never a clean primitive;
//   * three tonal layers minimum \u2014 core shadow, mid, and a cold rim light
//     on the upper-left, matching the world's key light;
//   * a grime/AO pass at the base so objects sit *in* the ground.





// ---------------------------------------------------------------------------
// Drawing helpers
// ---------------------------------------------------------------------------

/** Jagged organic closed path \u2014 the antidote to circles and rectangles. */
function organicPath(ctx, cx, cy, rx, ry, rng, spikes = 11, rough = 0.22, squash = 1) {
  ctx.beginPath();
  const pts = [];
  for (let i = 0; i < spikes; i++) {
    const a = (i / spikes) * TAU;
    const r = 1 + (rng.float() - 0.5) * 2 * rough;
    pts.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r * squash]);
  }
  ctx.moveTo((pts[0][0] + pts[spikes - 1][0]) / 2, (pts[0][1] + pts[spikes - 1][1]) / 2);
  for (let i = 0; i < spikes; i++) {
    const p = pts[i];
    const n = pts[(i + 1) % spikes];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + n[0]) / 2, (p[1] + n[1]) / 2);
  }
  ctx.closePath();
}

/** Tapered limb / trunk / branch, drawn as a closed curve. */
function limbPath(ctx, x0, y0, x1, y1, w0, w1, bow = 0) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len;
  const ny = dx / len;
  const mx = (x0 + x1) / 2 + nx * bow;
  const my = (y0 + y1) / 2 + ny * bow;
  const mw = (w0 + w1) * 0.5;
  ctx.beginPath();
  ctx.moveTo(x0 + nx * w0, y0 + ny * w0);
  ctx.quadraticCurveTo(mx + nx * mw, my + ny * mw, x1 + nx * w1, y1 + ny * w1);
  ctx.lineTo(x1 - nx * w1, y1 - ny * w1);
  ctx.quadraticCurveTo(mx - nx * mw, my - ny * mw, x0 - nx * w0, y0 - ny * w0);
  ctx.closePath();
}

function vgrad(ctx, y0, y1, stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (const [t, c, a] of stops) g.addColorStop(t, css(c, a ?? 1));
  return g;
}

/** Sprinkles subtle value noise inside the current clip so fills gain texture. */
function grainPass(ctx, rng, amount = 0.1, count = 220, box) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < count; i++) {
    const x = box.x + rng.float() * box.w;
    const y = box.y + rng.float() * box.h;
    const r = rng.range(0.6, 2.6);
    const v = rng.float() < 0.5 ? 0 : 255;
    ctx.fillStyle = `rgba(${v},${v},${v},${(rng.float() * amount).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * rng.range(0.5, 1.4), rng.float() * TAU, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/**
 * Edge light. Takes what has been drawn so far, keeps only the sliver that
 * sticks out on the upper-left, and paints it in the moon's colour. This one
 * pass is most of what separates "flat cut-out" from "lit object".
 */
function applyRim(ctx, w, h, color, alpha, dx = 2.5, dy = 3) {
  const tmp = makeCanvas(w, h);
  const t = ctxOf(tmp);
  t.drawImage(ctx.canvas, 0, 0);
  t.globalCompositeOperation = 'source-in';
  t.fillStyle = css(color);
  t.fillRect(0, 0, w, h);
  t.globalCompositeOperation = 'destination-out';
  t.drawImage(ctx.canvas, dx, dy);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(tmp, 0, 0);
  ctx.restore();
}

/** A drooping conifer branch: needle tufts threaded along a bowed curve. */
function drawFrond(ctx, x0, y0, ang, len, rng, colFn, opts = {}) {
  const steps = opts.steps ?? 13;
  const droop = opts.droop ?? 0.55;
  const baseR = opts.baseR ?? len * 0.17;
  const tipR = opts.tipR ?? len * 0.035;
  const pts = [];
  let x = x0;
  let y = y0;
  let a = ang;
  for (let i = 0; i < steps; i++) {
    a += droop / steps;
    x += Math.cos(a) * (len / steps);
    y += Math.sin(a) * (len / steps);
    pts.push([x + rng.range(-1.5, 1.5), y + rng.range(-1.5, 1.5)]);
  }
  // Tip first so the thick base overlaps it \u2014 reads as depth.
  for (let i = steps - 1; i >= 0; i--) {
    const t = i / (steps - 1);
    const [px, py] = pts[i];
    const r = lerp(baseR, tipR, t);
    organicPath(ctx, px, py, r * 1.25, r * 0.85, rng, 8, 0.34);
    ctx.fillStyle = colFn(t, i);
    ctx.fill();
  }
  // Needle fringe along the underside of the branch.
  ctx.save();
  ctx.lineWidth = 1.05;
  for (let i = 0; i < steps; i += 1) {
    const t = i / (steps - 1);
    const [px, py] = pts[i];
    const n = Math.round(lerp(7, 2, t));
    for (let k = 0; k < n; k++) {
      const na = a + rng.range(-1.5, 1.5);
      const nl = lerp(len * 0.1, len * 0.03, t) * rng.range(0.5, 1.2);
      ctx.strokeStyle = colFn(clamp01(t + 0.18), i);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(na) * nl, py + Math.sin(na) * nl + nl * 0.3);
      ctx.stroke();
    }
  }
  ctx.restore();
  return pts;
}

/** Contact darkening where an object meets the ground. */
function baseAO(ctx, cx, baseY, rx) {
  const g = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, rx);
  g.addColorStop(0, 'rgba(6,8,10,0.55)');
  g.addColorStop(0.5, 'rgba(6,8,10,0.28)');
  g.addColorStop(1, 'rgba(6,8,10,0)');
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(1, 0.34);
  ctx.translate(-cx, -baseY);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, baseY, rx, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Sprite record
// ---------------------------------------------------------------------------

/**
 * Finds the opaque bounding box. Baked sprites carry a lot of empty margin
 * (a pine is mostly sky), and blitting those transparent pixels every frame
 * is the single most expensive thing the renderer does \u2014 so we cut them off.
 */
function contentBounds(canvas) {
  const c = canvas.getContext('2d', { willReadFrequently: true });
  const w = canvas.width;
  const h = canvas.height;
  const data = new Uint32Array(c.getImageData(0, 0, w, h).data.buffer);
  let x0 = w;
  let y0 = h;
  let x1 = -1;
  let y1 = -1;
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      // Alpha is the top byte on little-endian, which every target is.
      if (data[row + x] >>> 24 > 3) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return null;
  return { x0, y0, x1, y1 };
}

function sprite(w, h, ox, oy, draw, opts = {}) {
  let canvas = makeCanvas(w, h);
  const ctx = ctxOf(canvas);
  let emissive = opts.emissive ? makeCanvas(w, h) : null;
  const ectx = emissive ? ctxOf(emissive) : null;
  const lights = [];
  draw(ctx, ectx, lights);

  const b = contentBounds(canvas);
  if (b && (b.x1 - b.x0 < w - 4 || b.y1 - b.y0 < h - 4)) {
    const nw = b.x1 - b.x0 + 1;
    const nh = b.y1 - b.y0 + 1;
    const trimmed = makeCanvas(nw, nh);
    ctxOf(trimmed).drawImage(canvas, -b.x0, -b.y0);
    canvas = trimmed;
    if (emissive) {
      const te = makeCanvas(nw, nh);
      ctxOf(te).drawImage(emissive, -b.x0, -b.y0);
      emissive = te;
    }
    for (const L of lights) {
      L.x -= b.x0;
      L.y -= b.y0;
    }
    ox -= b.x0;
    oy -= b.y0;
    w = nw;
    h = nh;
  }

  return {
    canvas,
    emissive,
    ox,
    oy,
    w,
    h,
    lights,
    radius: opts.radius ?? 0,
    solid: opts.solid ?? false,
    sway: opts.sway ?? 0,
  };
}
