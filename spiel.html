  p.blFoot = bl.foot;
  p.brHip = br.hip;
  p.brKnee = br.knee;
  p.brFoot = br.foot;
  return p;
}

function drawQuadruped(ctx, def, st, px, py, s, emis) {
  const facing = st.facing || 0;
  const cosF = Math.cos(facing);
  const sinF = Math.sin(facing);
  const p = poseQuadruped(st, def.build || {});
  const P = {};
  const D = {};
  for (const k in p) {
    const r = rot(p[k], cosF, sinF);
    P[k] = [px + r[0] * s, py + (r[1] * ISO_Y - r[2]) * s];
    D[k] = r[1] / 14;
  }
  const M = def.colors;
  const flash = st.flash || 0;
  const tint = (c) => (flash > 0 ? mixc(c, [255, 236, 220], flash) : c);
  const rimC = def.rim || PAL.moon;
  const rimA = (def.rimA ?? 0.45) * (1 - flash * 0.6);

  ctx.save();
  if ((st.alpha ?? 1) < 1) ctx.globalAlpha = st.alpha;

  const bone = (a, b, r0, r1, base, dark, light, depth) => {
    const A = P[a];
    const B = P[b];
    capsule(ctx, A[0] - 1.2, A[1] - 2, B[0] - 1.2, B[1] - 2, r0 * s, r1 * s);
    ctx.fillStyle = css(tint(rimC), rimA);
    ctx.fill();
    capsule(ctx, A[0], A[1], B[0], B[1], r0 * s, r1 * s);
    ctx.fillStyle = css(tint(shadeFor(depth, base, dark, light)));
    ctx.fill();
    capsule(ctx, A[0] - 1, A[1] - 1.5, B[0] - 1, B[1] - 1.5, r0 * s * 0.5, r1 * s * 0.5);
    ctx.fillStyle = css(tint(light), 0.16);
    ctx.fill();
  };

  const legPair = (pre, depth) => {
    bone(pre + 'Hip', pre + 'Knee', 5.2, 3.6, M.legs, M.legsDark, M.legsLight, depth);
    bone(pre + 'Knee', pre + 'Foot', 3.6, 2.6, M.legs, M.legsDark, M.legsLight, depth);
    const F = P[pre + 'Foot'];
    ctx.beginPath();
    ctx.ellipse(F[0], F[1], 4 * s, 2.4 * s, 0, 0, TAU);
    ctx.fillStyle = css(tint(M.legsDark));
    ctx.fill();
  };

  const far = [];
  const near = [];
  for (const pre of ['fl', 'fr', 'bl', 'br']) {
    (D[pre + 'Hip'] < 0 ? far : near).push(pre);
  }
  for (const pre of far) legPair(pre, -1);

  // Tail
  bone('hind', 'tail', 3, 2.4, M.torso, M.torsoDark, M.torsoLight, 0);
  bone('tail', 'tailTip', 2.4, 1.2, M.torso, M.torsoDark, M.torsoLight, 0);

  // Body \u2014 deep chest tapering to a narrow waist.
  bone('hind', 'chestC', 11.5, 13.5, M.torso, M.torsoDark, M.torsoLight, 0.2);
  bone('chestC', 'neck', 12, 8, M.torso, M.torsoDark, M.torsoLight, 0.3);
  // Shaggy back
  if (def.shaggy) {
    ctx.save();
    ctx.strokeStyle = css(tint(M.torsoDark), 0.8);
    ctx.lineWidth = 1.5;
    const A = P.hind;
    const B = P.neck;
    for (let i = 0; i < 18; i++) {
      const t = i / 17;
      const x = lerp(A[0], B[0], t);
      const y = lerp(A[1], B[1], t) - 10 * s;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + (i % 2 ? 4 : -4), y - 6 - (i % 3) * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Head
  bone('neck', 'head', 8, 7, M.torso, M.torsoDark, M.torsoLight, 0.4);
  bone('head', 'snout', 6, 3.2, M.torso, M.torsoDark, M.torsoLight, 0.5);
  const Hd = P.head;
  const Sn = P.snout;
  // Muzzle top and nose
  ctx.beginPath();
  ctx.arc(Sn[0], Sn[1], 2.6 * s, 0, TAU);
  ctx.fillStyle = css(tint(M.legsDark));
  ctx.fill();
  // Ears \u2014 tall triangles, the wolf's whole read at small size.
  for (const d of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(Hd[0] + d * 4.2 * s, Hd[1] - 4 * s);
    ctx.lineTo(Hd[0] + d * 7.4 * s, Hd[1] - 16 * s);
    ctx.lineTo(Hd[0] + d * 1.2 * s, Hd[1] - 7 * s);
    ctx.closePath();
    ctx.fillStyle = css(tint(shadeFor(d * 0.5, M.torso, M.torsoDark, M.torsoLight)));
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(Hd[0] + d * 4.4 * s, Hd[1] - 5.4 * s);
    ctx.lineTo(Hd[0] + d * 6.2 * s, Hd[1] - 13 * s);
    ctx.lineTo(Hd[0] + d * 2.8 * s, Hd[1] - 7.4 * s);
    ctx.closePath();
    ctx.fillStyle = css(tint(M.torsoDark), 0.75);
    ctx.fill();
  }
  // Eyes
  const front = clamp01(sinF * 1.3 + 0.3);
  if (front > 0.03 && def.glowEyes) {
    ctx.save();
    ctx.globalAlpha = front;
    ctx.fillStyle = css(def.glowEyes, 0.95);
    ctx.beginPath();
    ctx.ellipse(Hd[0] - 2.4 * s - cosF * s, Hd[1] - 1 * s, 1.5 * s, 1.1 * s, 0, 0, TAU);
    ctx.ellipse(Hd[0] + 2.4 * s - cosF * s, Hd[1] - 1 * s, 1.5 * s, 1.1 * s, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    if (emis) emis(Hd[0], Hd[1] - 1 * s, 8 * s, def.glowEyes, 0.7 * front);
  }
  // Teeth on the lunge
  if (st.anim === 'attack' && st.animT > 0.35 && st.animT < 0.7) {
    ctx.fillStyle = css(tint(PAL.bone), 0.9);
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(Sn[0] + i * 1.4 * s, Sn[1] - 1 * s);
      ctx.lineTo(Sn[0] + i * 1.4 * s + 0.7 * s, Sn[1] + 2.6 * s);
      ctx.lineTo(Sn[0] + i * 1.4 * s + 1.4 * s, Sn[1] - 1 * s);
      ctx.closePath();
      ctx.fill();
    }
  }

  for (const pre of near) legPair(pre, 1);
  ctx.restore();
}

/** Bog wraith: no legs, a hovering column of rag and mist. */
function drawWraith(ctx, def, st, px, py, s, emis) {
  const t = st.t;
  const facing = st.facing || 0;
  const cosF = Math.cos(facing);
  const sinF = Math.sin(facing);
  const M = def.colors;
  const flash = st.flash || 0;
  const tint = (c) => (flash > 0 ? mixc(c, [255, 240, 230], flash) : c);
  const hover = Math.sin(t * 1.5) * 4 * s;
  const H = (def.build?.height ?? 92) * s;
  const alpha = (st.alpha ?? 1) * (def.ghostly ? 0.86 : 1);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Shoulders hunched under the cowl, then rags streaming down into mist.
  const shoulderY = py - H * 0.82 - hover;
  const ribbons = 9;
  for (let i = 0; i < ribbons; i++) {
    const u = i / (ribbons - 1) - 0.5;
    const topX = px + u * 22 * s;
    const sway = Math.sin(t * 2.0 + i * 1.1) * 6 * s;
    const len = H * (0.74 + 0.22 * Math.cos(u * 2.6));
    const wdt = (2.6 + 2.4 * Math.cos(u * 2.2)) * s;
    ctx.beginPath();
    ctx.moveTo(topX - wdt, shoulderY);
    ctx.quadraticCurveTo(topX + sway * 0.4 - wdt, shoulderY + len * 0.55, topX + sway - wdt * 0.4, shoulderY + len);
    ctx.quadraticCurveTo(topX + sway * 1.3, shoulderY + len * 1.1, topX + sway + wdt * 0.4, shoulderY + len * 0.94);
    ctx.quadraticCurveTo(topX + sway * 0.4 + wdt, shoulderY + len * 0.5, topX + wdt, shoulderY);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, shoulderY, 0, shoulderY + len);
    g.addColorStop(0, css(tint(M.torsoLight), 0.92));
    g.addColorStop(0.45, css(tint(M.torso), 0.78));
    g.addColorStop(1, css(tint(M.torsoDark), 0.02));
    ctx.fillStyle = g;
    ctx.fill();
  }

  // Shoulder mantle
  ctx.beginPath();
  ctx.moveTo(px - 24 * s, shoulderY + 8 * s);
  ctx.quadraticCurveTo(px - 20 * s, shoulderY - 10 * s, px, shoulderY - 12 * s);
  ctx.quadraticCurveTo(px + 20 * s, shoulderY - 10 * s, px + 24 * s, shoulderY + 8 * s);
  ctx.quadraticCurveTo(px, shoulderY + 2 * s, px - 24 * s, shoulderY + 8 * s);
  ctx.closePath();
  const mg = ctx.createLinearGradient(px - 24 * s, shoulderY - 12 * s, px + 24 * s, shoulderY + 8 * s);
  mg.addColorStop(0, css(tint(M.torsoLight)));
  mg.addColorStop(1, css(tint(M.torsoDark)));
  ctx.fillStyle = mg;
  ctx.fill();

  // Cowl \u2014 narrow and peaked, not a dome.
  const hx = px - cosF * 2 * s;
  const hy = py - H - hover + 2 * s;
  ctx.beginPath();
  ctx.moveTo(hx - 11 * s, hy + 13 * s);
  ctx.quadraticCurveTo(hx - 13 * s, hy - 12 * s, hx - cosF * 3 * s, hy - 17 * s);
  ctx.quadraticCurveTo(hx + 13 * s, hy - 12 * s, hx + 11 * s, hy + 13 * s);
  ctx.quadraticCurveTo(hx, hy + 5 * s, hx - 11 * s, hy + 13 * s);
  ctx.closePath();
  const hg = ctx.createLinearGradient(hx - 11 * s, hy - 17 * s, hx + 11 * s, hy + 13 * s);
  hg.addColorStop(0, css(tint(M.torsoLight)));
  hg.addColorStop(1, css(tint(M.torsoDark)));
  ctx.fillStyle = hg;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(hx - cosF * 2.5 * s, hy + 1 * s, 6.5 * s, 8.5 * s, 0, 0, TAU);
  ctx.fillStyle = 'rgba(4,6,10,0.92)';
  ctx.fill();

  // Eyes
  const front = clamp01(sinF * 1.3 + 0.35);
  if (front > 0.03) {
    const glow = def.glowEyes || PAL.bogfire;
    ctx.save();
    ctx.globalAlpha = front * alpha;
    ctx.fillStyle = css(glow, 0.95);
    ctx.beginPath();
    ctx.ellipse(hx - 3 * s - cosF * s, hy, 2.1 * s, 1.6 * s, 0, 0, TAU);
    ctx.ellipse(hx + 3 * s - cosF * s, hy, 2.1 * s, 1.6 * s, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    if (emis) emis(hx, hy, 14 * s, glow, 0.85 * front);
  }

  // Grasping hands
  const reach = st.anim === 'attack' ? Math.sin(clamp01(st.animT * 2) * Math.PI) : 0;
  for (const d of [-1, 1]) {
    const ax = px + d * (20 + reach * 12) * s + cosF * reach * 16 * s;
    const ay = py - H * 0.66 - hover + Math.sin(t * 2 + d) * 3 * s + sinF * reach * 9 * s;
    ctx.strokeStyle = css(tint(M.legs || M.torsoLight), 0.9);
    ctx.lineWidth = 2.2 * s;
    ctx.lineCap = 'round';
    for (let f = -1; f <= 1; f++) {
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(ax + d * 5 * s, ay + 4 * s, ax + d * 7 * s + f * 2 * s, ay + 9 * s + Math.abs(f) * 2 * s);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/** Chooses the right body plan. */
/**
 * The figure's shadow on the ground.
 *
 * Until now every actor sat on a soft ellipse, which says "something is here"
 * but nothing about what. Diablo II laid down the unit's own silhouette,
 * flattened onto the floor and sheared away from the light, and that is what
 * made its characters look like they were standing in the scene rather than
 * pasted onto it \u2014 the shadow changes shape as the figure moves, so the eye
 * gets a second, free read of the pose.
 *
 * Drawn from the same joints as the body, but every part is one flat dark
 * fill: no gradients, no contours, no detail. A shadow has no interior, and
 * skipping all of that is what keeps a second pass over the rig cheap.
 */
function drawActorShadow(ctx, def, st, px, py, s, sunDir) {
  if (def.plan === 'wraith') return; // it doesn't touch the ground
  const facing = st.facing || 0;
  const cosF = Math.cos(facing);
  const sinF = Math.sin(facing);
  const build = def.build || {};
  const p = def.pose ? def.pose(st, build) : poseHumanoid(st, build);

  // Shear away from the key light, and squash onto the floor plane.
  const lx = sunDir ? sunDir[0] : -0.5;
  const ly = sunDir ? sunDir[1] : -0.75;
  const len = Math.hypot(lx, ly) || 1;
  const shear = (-lx / len) * 0.85;
  const squash = 0.42;

  const P = {};
  for (const k in p) {
    const v = p[k];
    if (!Array.isArray(v)) continue;
    const r = rot(v, cosF, sinF);
    // Height above the ground becomes length along the floor, which is what
    // makes a raised arm throw a longer shadow than a planted foot.
    const h = r[2];
    P[k] = [px + r[0] * s + h * shear * s, py + (r[1] * ISO_Y - h * squash) * s];
  }

  ctx.save();
  ctx.globalAlpha = (st.alpha ?? 1) * 0.42;
  ctx.fillStyle = '#000';
  const limb = (a, b, r0, r1) => {
    const A = P[a];
    const B = P[b];
    if (!A || !B) return;
    capsule(ctx, A[0], A[1], B[0], B[1], r0 * s, r1 * s);
    ctx.fill();
  };
  const lw = def.limbScale ?? 1;
  if (def.plan === 'quadruped') {
    for (const side of ['L', 'R']) {
      limb('hipF' + side, 'footF' + side, 4 * lw, 3 * lw);
      limb('hipB' + side, 'footB' + side, 4 * lw, 3 * lw);
    }
    limb('chest', 'hip', 9 * lw, 8 * lw);
    limb('neck', 'head', 6 * lw, 6 * lw);
  } else {
    for (const side of ['L', 'R']) {
      limb('hip' + side, 'knee' + side, 6.4 * lw, 5 * lw);
      limb('knee' + side, 'foot' + side, 5 * lw, 3.6 * lw);
      limb('shoulder' + side, 'elbow' + side, 5.6 * lw, 4.4 * lw);
      limb('elbow' + side, 'hand' + side, 4.4 * lw, 3.4 * lw);
    }
    // Torso as one slab between the shoulders and the hips.
    const shL = P.shoulderL;
    const shR = P.shoulderR;
    const hipL = P.hipL;
    const hipR = P.hipR;
    if (shL && shR && hipL && hipR) {
      ctx.beginPath();
      ctx.moveTo(shL[0], shL[1] - 2 * s);
      ctx.lineTo(shR[0], shR[1] - 2 * s);
      ctx.lineTo(hipR[0], hipR[1] + 2 * s);
      ctx.lineTo(hipL[0], hipL[1] + 2 * s);
      ctx.closePath();
      ctx.fill();
    }
    const H = P.head;
    if (H) {
      ctx.beginPath();
      ctx.ellipse(H[0], H[1], (def.headR ?? 7.6) * s, (def.headR ?? 7.6) * s * 0.9, 0, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

function renderActor(ctx, def, st, px, py, s, emis) {
  switch (def.plan) {
    case 'quadruped':
      return drawQuadruped(ctx, def, st, px, py, s, emis);
    case 'wraith':
      return drawWraith(ctx, def, st, px, py, s, emis);
    default:
      return drawActor(ctx, def, st, px, py, s, emis);
  }
}

// ===== src/core/save.js ==============================================
// localStorage persistence. Never throws \u2014 a browser with storage disabled
// just plays without saving.

const KEY = 'weg-des-ritters/save';
const SETTINGS = 'weg-des-ritters/settings';

function save(data) {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(KEY);
  } catch (e) {
    /* ignore */
  }
}

function saveSettings(s) {
  try {
    localStorage.setItem(SETTINGS, JSON.stringify(s));
  } catch (e) {
    /* ignore */
  }
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

// ===== src/render/icons.js ===========================================
// Item icons.
//
// Diablo II's inventory was a big part of why the game felt like it had loot
// in it. Every base item was a painted little object \u2014 a blade with a fuller
// down the middle, a grip with the leather wrap showing, rivets around a
// shield rim \u2014 sitting in a dark grid cell. You could tell an axe from a
// sword from across the screen without reading a word.
//
// So these are illustrations, not glyphs. Each is baked once into its own
// canvas and cached, which means the drawing can afford real detail: every
// icon gets a contour, a lit side and a shadow side under the same key light
// the world uses, and a specular streak whose shape is what separates
// polished steel from oiled wood from tarnished bronze.
//
// The rarity colour is not painted over the item as a wash \u2014 that turns every
// unique into a stained silhouette. It goes into the metal's own highlight
// and into the cell behind it, so a rare longsword still reads as a
// longsword, only richer.




// The same lamp as the world: up and to the left.
const LIT = -0.62;

const CONTOUR = 'rgba(9,8,10,0.92)';

const cache = new Map();

// ---------------------------------------------------------------------------
// Material helpers
// ---------------------------------------------------------------------------

/** Runs a contour around whatever the last path was, then fills it. */
function inked(ctx, fill, lw = 2) {
  ctx.strokeStyle = CONTOUR;
  ctx.lineWidth = lw;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.fillStyle = fill;
  ctx.fill();
}

/**
 * A steel gradient across the given axis. Steel is not a smooth ramp \u2014 it has
 * a dark body, one narrow near-white streak where the light grazes it, and a
 * sharp fall to black on the far side. That streak is the entire difference
 * between "metal" and "grey plastic".
 */
function steelFill(ctx, x0, y0, x1, y1, tint) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  // Pitched dark on purpose. Steel that runs bright-to-mid reads as chrome \u2014
  // a clean modern icon. Diablo II's armour was mostly in shadow with one
  // small hot spot, which is what made it look like iron that had been
  // outdoors.
  const base = tint ? mixc(mixc(PAL.steel, [0, 0, 0], 0.3), tint, 0.24) : mixc(PAL.steel, [0, 0, 0], 0.3);
  g.addColorStop(0, css(mixc(PAL.steelDark, [6, 6, 9], 0.62)));
  g.addColorStop(0.3, css(mixc(PAL.steelDark, [6, 6, 9], 0.3)));
  g.addColorStop(0.48, css(base));
  g.addColorStop(0.58, css(mixc(PAL.steel, tint || [255, 255, 255], 0.22)));
  g.addColorStop(0.64, css(tint ? mixc([242, 238, 226], tint, 0.4) : [238, 240, 244]));
  g.addColorStop(0.74, css(base));
  g.addColorStop(1, css(mixc(PAL.steelDark, [6, 6, 9], 0.7)));
  return g;
}

/**
 * A tile of pitting and fine scratches, laid over every finished icon and
 * clipped to what was actually drawn. Without it the gradients are perfectly
 * smooth and the whole set reads as vector art; a hand-painted icon has dirt
 * in it. Baked once and reused by all of them.
 */
let wearTile = null;
function getWearTile() {
  if (wearTile) return wearTile;
  wearTile = makeCanvas(64, 64);
  const w = ctxOf(wearTile);
  // Pitting: a spray of dark and light specks.
  let seed = 0x9e3779b9;
  const rnd = () => {
    seed ^= seed << 13;
    seed ^= seed >>> 17;
    seed ^= seed << 5;
    return ((seed >>> 0) % 10000) / 10000;
  };
  for (let i = 0; i < 900; i++) {
    const x = rnd() * 64;
    const y = rnd() * 64;
    const r = 0.3 + rnd() * 0.9;
    const dark = rnd() < 0.62;
    w.fillStyle = dark ? `rgba(0,0,0,${(0.1 + rnd() * 0.3).toFixed(3)})` : `rgba(255,250,238,${(0.05 + rnd() * 0.16).toFixed(3)})`;
    w.beginPath();
    w.arc(x, y, r, 0, TAU);
    w.fill();
  }
  // Scratches: short diagonal strokes, mostly along the light direction.
  for (let i = 0; i < 26; i++) {
    const x = rnd() * 64;
    const y = rnd() * 64;
    const len = 3 + rnd() * 12;
    const a = -0.9 + rnd() * 0.5;
    w.strokeStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.24)' : 'rgba(255,252,244,0.2)';
    w.lineWidth = 0.5 + rnd() * 0.6;
    w.beginPath();
    w.moveTo(x, y);
    w.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    w.stroke();
  }
  return wearTile;
}

function woodFill(ctx, x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, css(mixc(PAL.wood, [0, 0, 0], 0.45)));
  g.addColorStop(0.4, css(PAL.wood));
  g.addColorStop(0.6, css(PAL.woodLight));
  g.addColorStop(1, css(mixc(PAL.wood, [0, 0, 0], 0.3)));
  return g;
}

function leatherFill(ctx, x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, css(PAL.leatherDark));
  g.addColorStop(0.45, css(PAL.leather));
  g.addColorStop(0.62, css(mixc(PAL.leather, [220, 190, 150], 0.45)));
  g.addColorStop(1, css(mixc(PAL.leatherDark, [0, 0, 0], 0.4)));
  return g;
}

/** A domed rivet. Two of these on a strap sell more than any amount of shading. */
function rivet(ctx, x, y, r, tint) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = css(mixc(PAL.steelDark, [0, 0, 0], 0.3));
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + r * LIT * 0.4, y - r * 0.35, r * 0.55, 0, TAU);
  ctx.fillStyle = css(tint ? mixc(PAL.steelLight, tint, 0.4) : PAL.steelLight);
  ctx.fill();
}

/** A cut gem: dark body, a bright facet, and one white sparkle. */
function gem(ctx, x, y, r, color) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.lineTo(x + r * 0.8, y - r * 0.2);
  ctx.lineTo(x + r * 0.5, y + r * 0.9);
  ctx.lineTo(x - r * 0.5, y + r * 0.9);
  ctx.lineTo(x - r * 0.8, y - r * 0.2);
  ctx.closePath();
  inked(ctx, css(mixc(color, [0, 0, 0], 0.45)), 1.6);
  ctx.beginPath();
  ctx.moveTo(x, y - r * 0.8);
  ctx.lineTo(x + r * 0.5, y - r * 0.1);
  ctx.lineTo(x, y + r * 0.5);
  ctx.lineTo(x - r * 0.5, y - r * 0.1);
  ctx.closePath();
  ctx.fillStyle = css(color);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x - r * 0.28, y - r * 0.3, r * 0.2, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fill();
}

/** Leather grip binding: diagonal bands with a shadow line between each. */
function gripWrap(ctx, x, yTop, yBot, halfW) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - halfW, yTop, halfW * 2, yBot - yTop);
  ctx.clip();
  ctx.fillStyle = leatherFill(ctx, x - halfW, 0, x + halfW, 0);
  ctx.fillRect(x - halfW, yTop, halfW * 2, yBot - yTop);
  ctx.strokeStyle = 'rgba(12,9,7,0.55)';
  ctx.lineWidth = 1.1;
  for (let y = yTop - halfW * 2; y < yBot + halfW * 2; y += 3.4) {
    ctx.beginPath();
    ctx.moveTo(x - halfW - 2, y);
    ctx.lineTo(x + halfW + 2, y - halfW * 1.6);
    ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath();
  ctx.rect(x - halfW, yTop, halfW * 2, yBot - yTop);
  ctx.strokeStyle = CONTOUR;
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

// ---------------------------------------------------------------------------
// The items
// ---------------------------------------------------------------------------
//
// All drawn into a 64x64 box, upright, roughly filling it. Upright and
// centred is what makes a grid of them scan: D2's icons never tilted for
// style, they tilted only when the object itself was asymmetric.

const DRAW = {
  sword(ctx, tint) {
    // Blade: a long tapered kite with a fuller down the centre.
    ctx.beginPath();
    ctx.moveTo(32, 3);
    ctx.lineTo(38, 14);
    ctx.lineTo(37, 40);
    ctx.lineTo(27, 40);
    ctx.lineTo(26, 14);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 26, 0, 38, 0, tint), 2);
    // The fuller \u2014 a groove, so it is a dark line with a lit lip above it.
    ctx.strokeStyle = 'rgba(10,12,16,0.55)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(32, 9);
    ctx.lineTo(32, 38);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(236,242,250,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(30.4, 10);
    ctx.lineTo(30.4, 37);
    ctx.stroke();

    // Crossguard
    ctx.beginPath();
    ctx.moveTo(16, 41);
    ctx.lineTo(48, 41);
    ctx.lineTo(46, 46);
    ctx.lineTo(18, 46);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 0, 41, 0, 46, tint), 2);
    rivet(ctx, 21, 43.5, 1.7, tint);
    rivet(ctx, 43, 43.5, 1.7, tint);

    gripWrap(ctx, 32, 46, 57, 4);

    // Pommel
    ctx.beginPath();
    ctx.arc(32, 59, 4.6, 0, TAU);
    inked(ctx, steelFill(ctx, 28, 55, 36, 63, tint), 2);
  },

  mace(ctx, tint) {
    // A war hammer, not a ball on a stick: a flat striking face on one side
    // and a curved beak on the other. The asymmetry is the whole read \u2014 a
    // symmetric blob at icon size is indistinguishable from a torch or a pin.
    ctx.beginPath();
    ctx.rect(29, 24, 6, 34);
    inked(ctx, woodFill(ctx, 29, 0, 35, 0), 2);
    ctx.strokeStyle = 'rgba(20,14,9,0.5)';
    ctx.lineWidth = 0.9;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(30.5 + i * 1.6, 25);
      ctx.lineTo(30.5 + i * 1.6, 56);
      ctx.stroke();
    }

    // Langets: the steel straps that pin the head to the shaft.
    ctx.beginPath();
    ctx.rect(28, 24, 8, 9);
    inked(ctx, steelFill(ctx, 28, 0, 36, 0, tint), 1.5);
    rivet(ctx, 32, 29, 1.6, tint);

    // Striking head, left, with a bevelled face.
    ctx.beginPath();
    ctx.moveTo(12, 12);
    ctx.lineTo(30, 10);
    ctx.lineTo(30, 26);
    ctx.lineTo(12, 24);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 12, 10, 30, 26, tint), 2);
    ctx.beginPath();
    ctx.rect(12, 12, 4, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,11,14,0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(17, 11);
    ctx.lineTo(17, 24.5);
    ctx.stroke();

    // Beak, right, tapering to a point.
    ctx.beginPath();
    ctx.moveTo(34, 11);
    ctx.quadraticCurveTo(50, 12, 54, 22);
    ctx.quadraticCurveTo(46, 20, 34, 25);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 34, 11, 52, 25, tint), 2);

    // Top spike.
    ctx.beginPath();
    ctx.moveTo(28, 11);
    ctx.lineTo(32, 3);
    ctx.lineTo(36, 11);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 28, 3, 36, 11, tint), 1.6);

    gripWrap(ctx, 32, 36, 54, 4);
    ctx.beginPath();
    ctx.arc(32, 58, 3.6, 0, TAU);
    inked(ctx, steelFill(ctx, 28, 54, 36, 62, tint), 1.8);
  },

  bow(ctx, tint) {
    // Limbs: two arcs meeting at a thicker riser, so it recurves.
    ctx.strokeStyle = CONTOUR;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(24, 6);
    ctx.quadraticCurveTo(46, 20, 40, 32);
    ctx.quadraticCurveTo(46, 44, 24, 58);
    ctx.stroke();
    ctx.strokeStyle = woodFill(ctx, 22, 0, 44, 0);
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(24, 6);
    ctx.quadraticCurveTo(46, 20, 40, 32);
    ctx.quadraticCurveTo(46, 44, 24, 58);
    ctx.stroke();
    // Grain along the belly of the limb.
    ctx.strokeStyle = 'rgba(226,200,160,0.28)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(25, 8);
    ctx.quadraticCurveTo(44, 20, 38.5, 32);
    ctx.quadraticCurveTo(44, 44, 25, 56);
    ctx.stroke();
    // String
    ctx.strokeStyle = 'rgba(228,222,202,0.85)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(24, 6);
    ctx.lineTo(24, 58);
    ctx.stroke();
    // Grip wrap and arrow rest
    ctx.save();
    ctx.translate(40, 32);
    gripWrap(ctx, 0, -8, 8, 3.4);
    ctx.restore();
    if (tint) {
      ctx.beginPath();
      ctx.arc(24, 6, 2.2, 0, TAU);
      ctx.fillStyle = css(tint);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(24, 58, 2.2, 0, TAU);
      ctx.fill();
    }
  },

  staff(ctx, tint) {
    ctx.beginPath();
    ctx.rect(29, 18, 6, 44);
    inked(ctx, woodFill(ctx, 29, 0, 35, 0), 2);
    // Knots in the wood.
    ctx.fillStyle = 'rgba(24,16,10,0.5)';
    for (const y of [28, 41, 53]) {
      ctx.beginPath();
      ctx.ellipse(32, y, 2.2, 1.2, 0, 0, TAU);
      ctx.fill();
    }
    // Claw prongs holding the stone.
    ctx.strokeStyle = CONTOUR;
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(26, 22);
    ctx.quadraticCurveTo(24, 14, 28, 10);
    ctx.moveTo(38, 22);
    ctx.quadraticCurveTo(40, 14, 36, 10);
    ctx.stroke();
    ctx.strokeStyle = steelFill(ctx, 24, 0, 40, 0, tint);
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(26, 22);
    ctx.quadraticCurveTo(24, 14, 28, 10);
    ctx.moveTo(38, 22);
    ctx.quadraticCurveTo(40, 14, 36, 10);
    ctx.stroke();
    gem(ctx, 32, 12, 8, tint ? mixc(PAL.amber, tint, 0.5) : PAL.amber);
    gripWrap(ctx, 32, 34, 46, 4);
  },

  shield(ctx, tint) {
    // Heater shield: square shoulders falling to a point.
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(12, 8);
      ctx.lineTo(52, 8);
      ctx.quadraticCurveTo(52, 42, 32, 60);
      ctx.quadraticCurveTo(12, 42, 12, 8);
      ctx.closePath();
    };
    path();
    inked(ctx, steelFill(ctx, 12, 8, 52, 50, tint), 2.2);
    // The face is curved, so the left third is lit and the right falls off.
    ctx.save();
    path();
    ctx.clip();
    const cg = ctx.createLinearGradient(12, 0, 52, 0);
    cg.addColorStop(0, 'rgba(255,255,255,0.16)');
    cg.addColorStop(0.3, 'rgba(255,255,255,0.04)');
    cg.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = cg;
    ctx.fillRect(0, 0, 64, 64);
    // Order cross
    ctx.fillStyle = 'rgba(18,17,20,0.88)';
    ctx.fillRect(28, 14, 8, 32);
    ctx.fillRect(18, 22, 28, 8);
    ctx.restore();
    // Rim band with rivets
    ctx.save();
    path();
    ctx.clip();
    ctx.strokeStyle = css(mixc(PAL.steelDark, tint || [0, 0, 0], 0.3));
    ctx.lineWidth = 5;
    path();
    ctx.stroke();
    ctx.restore();
    for (const [rx, ry] of [[16, 12], [48, 12], [16, 30], [48, 30], [32, 55]]) {
      rivet(ctx, rx, ry, 2, tint);
    }
    // Boss
    ctx.beginPath();
    ctx.arc(32, 26, 5.4, 0, TAU);
    inked(ctx, steelFill(ctx, 27, 21, 37, 31, tint), 1.8);
  },

  book(ctx, tint) {
    // Cover
    ctx.beginPath();
    ctx.rect(14, 8, 34, 48);
    inked(ctx, leatherFill(ctx, 14, 0, 48, 0), 2);
    // Page block down the right edge, drawn as stacked lines.
    ctx.beginPath();
    ctx.rect(44, 11, 6, 42);
    inked(ctx, css(PAL.bone), 1.4);
    ctx.strokeStyle = 'rgba(90,82,64,0.6)';
    ctx.lineWidth = 0.8;
    for (let y = 13; y < 53; y += 2.6) {
      ctx.beginPath();
      ctx.moveTo(44.5, y);
      ctx.lineTo(49.5, y);
      ctx.stroke();
    }
    // Spine bands
    ctx.fillStyle = 'rgba(14,10,7,0.55)';
    for (const y of [18, 32, 46]) ctx.fillRect(14, y, 34, 3);
    // Clasp
    ctx.beginPath();
    ctx.rect(40, 26, 10, 8);
    inked(ctx, steelFill(ctx, 0, 26, 0, 34, tint), 1.6);
    rivet(ctx, 45, 30, 1.8, tint);
    gem(ctx, 28, 30, 7, tint ? mixc(PAL.amber, tint, 0.55) : PAL.amber);
  },

  helm(ctx, tint) {
    // Great helm: a drum with a domed crown and a flat-ish face.
    ctx.beginPath();
    ctx.moveTo(15, 24);
    ctx.quadraticCurveTo(15, 6, 32, 6);
    ctx.quadraticCurveTo(49, 6, 49, 24);
    ctx.lineTo(47, 52);
    ctx.quadraticCurveTo(32, 60, 17, 52);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 15, 6, 49, 40, tint), 2.2);
    // Eye slits \u2014 the single most recognisable thing about a great helm.
    ctx.fillStyle = 'rgba(6,6,9,0.95)';
    ctx.fillRect(19, 27, 12, 5);
    ctx.fillRect(33, 27, 12, 5);
    // Breath holes
    ctx.fillStyle = 'rgba(8,8,11,0.7)';
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 2; j++) {
        ctx.beginPath();
        ctx.arc(25 + i * 5, 40 + j * 5, 1.2, 0, TAU);
        ctx.fill();
      }
    }
    // Reinforcing cross
    ctx.fillStyle = 'rgba(20,22,28,0.5)';
    ctx.fillRect(30, 8, 4, 44);
    ctx.fillRect(17, 21, 30, 3.5);
    rivet(ctx, 32, 12, 2, tint);
    rivet(ctx, 20, 48, 1.8, tint);
    rivet(ctx, 44, 48, 1.8, tint);
    // Crown highlight
    ctx.beginPath();
    ctx.ellipse(26, 15, 6, 8, -0.4, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fill();
  },

  chest(ctx, tint) {
    // A breastplate reads as body armour only if it has a body's proportions:
    // a neck notch cut out of the top, arm holes bitten out of the sides, a
    // chest wider than the waist, and a skirt hanging below. The previous
    // version had a straight silhouette with two round caps and came out
    // looking like a lampshade.
    const body = () => {
      ctx.beginPath();
      ctx.moveTo(26, 11); // left of the neck
      ctx.quadraticCurveTo(20, 12, 16, 20); // over the shoulder
      ctx.quadraticCurveTo(13, 30, 19, 34); // down and under the arm hole
      ctx.lineTo(22, 44); // in to the waist
      ctx.lineTo(42, 44);
      ctx.lineTo(45, 34);
      ctx.quadraticCurveTo(51, 30, 48, 20);
      ctx.quadraticCurveTo(44, 12, 38, 11);
      ctx.quadraticCurveTo(32, 15, 26, 11); // the neck notch
      ctx.closePath();
    };
    body();
    inked(ctx, steelFill(ctx, 15, 12, 49, 44, tint), 2.2);

    // Pectoral swell: two soft highlights either side of the sternum, which
    // is what makes the plate look pressed over a chest rather than flat.
    ctx.save();
    body();
    ctx.clip();
    for (const [cx, a] of [[25, 0.3], [39, 0.12]]) {
      const rg = ctx.createRadialGradient(cx, 24, 1, cx, 26, 13);
      rg.addColorStop(0, `rgba(255,255,255,${a})`);
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(14, 10, 36, 36);
    }
    // Arm-hole shadows, bitten out of each side.
    ctx.fillStyle = 'rgba(6,6,9,0.5)';
    ctx.beginPath();
    ctx.ellipse(16, 24, 4, 9, 0.2, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(48, 24, 4, 9, -0.2, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Sternum ridge
    ctx.strokeStyle = 'rgba(10,11,14,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(32, 16);
    ctx.lineTo(32, 43);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(236,242,250,0.4)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(30.6, 17);
    ctx.lineTo(30.6, 42);
    ctx.stroke();

    // Neck rim: a rolled edge catching the light.
    ctx.strokeStyle = css(mixc(PAL.steelLight, tint || [255, 255, 255], 0.3));
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(26, 11.5);
    ctx.quadraticCurveTo(32, 15.5, 38, 11.5);
    ctx.stroke();

    // Fauld: two bands hanging off the waist, each narrower than the last.
    for (let i = 0; i < 2; i++) {
      const y = 44 + i * 7;
      ctx.beginPath();
      ctx.moveTo(22 + i * 2, y);
      ctx.lineTo(42 - i * 2, y);
      ctx.lineTo(40 - i * 2, y + 7);
      ctx.lineTo(24 + i * 2, y + 7);
      ctx.closePath();
      inked(ctx, steelFill(ctx, 0, y, 0, y + 7, tint), 1.6);
    }
    rivet(ctx, 21, 21, 1.8, tint);
    rivet(ctx, 43, 21, 1.8, tint);
  },

  glove(ctx, tint) {
    // The first attempt drew the finger lames as a grid of separate bricks
    // and came out as a waffle. Fingers have to be one continuous mass with
    // grooves cut into it \u2014 the silhouette of a hand is what the eye is
    // matching against, not the plating.
    const hand = () => {
      ctx.beginPath();
      ctx.moveTo(19, 44);
      ctx.lineTo(19, 20);
      ctx.quadraticCurveTo(19, 9, 25, 9); // fingertips, rounded over
      ctx.lineTo(41, 9);
      ctx.quadraticCurveTo(47, 9, 47, 20);
      ctx.lineTo(47, 44);
      ctx.closePath();
    };
    hand();
    inked(ctx, steelFill(ctx, 19, 10, 47, 44, tint), 2.2);

    // Three grooves splitting the mass into four fingers, plus a knuckle
    // line across them \u2014 deep shadow with a lit lip on the light side.
    ctx.save();
    hand();
    ctx.clip();
    for (let f = 1; f < 4; f++) {
      const x = 19 + f * 7;
      ctx.strokeStyle = 'rgba(8,8,11,0.72)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x, 10);
      ctx.lineTo(x, 30);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(230,238,248,0.32)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(x - 1.3, 11);
      ctx.lineTo(x - 1.3, 29);
      ctx.stroke();
    }
    for (const y of [17, 24]) {
      ctx.strokeStyle = 'rgba(8,8,11,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(19, y);
      ctx.lineTo(47, y);
      ctx.stroke();
    }
    // Knuckle domes across the top of the metacarpal plate.
    ctx.restore();
    for (let f = 0; f < 4; f++) rivet(ctx, 22.5 + f * 7, 32, 2, tint);

    // Thumb, angled off the left side \u2014 the detail that fixes handedness.
    ctx.beginPath();
    ctx.moveTo(19, 30);
    ctx.quadraticCurveTo(10, 32, 9, 40);
    ctx.quadraticCurveTo(9, 45, 15, 44);
    ctx.lineTo(19, 40);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 9, 30, 19, 44, tint), 1.8);

    // Flared cuff
    ctx.beginPath();
    ctx.moveTo(17, 44);
    ctx.lineTo(49, 44);
    ctx.lineTo(52, 58);
    ctx.lineTo(14, 58);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 14, 44, 52, 58, tint), 2);
    ctx.strokeStyle = 'rgba(10,11,14,0.45)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(15.5, 51);
    ctx.lineTo(50.5, 51);
    ctx.stroke();
    rivet(ctx, 22, 54, 1.8, tint);
    rivet(ctx, 42, 54, 1.8, tint);
  },

  boot(ctx, tint) {
    // Sabaton in profile, toe to the right. The previous version had a shin
    // and a foot of nearly the same width, which read as a trapezoid. A boot
    // needs the L: a narrow leg, a definite ankle, and a foot that juts well
    // past it \u2014 plus a dark sole running the whole length underneath.
    ctx.beginPath();
    ctx.moveTo(20, 10);
    ctx.lineTo(36, 10);
    ctx.lineTo(35, 32); // taper in towards the ankle
    ctx.lineTo(22, 32);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 20, 10, 36, 32, tint), 2);

    // Foot: heel behind the leg, instep rising, long pointed toe.
    ctx.beginPath();
    ctx.moveTo(17, 34);
    ctx.lineTo(36, 34);
    ctx.quadraticCurveTo(48, 38, 55, 48); // the instep out to the toe
    ctx.lineTo(55, 53);
    ctx.lineTo(15, 53);
    ctx.quadraticCurveTo(13, 42, 17, 34); // back of the heel
    ctx.closePath();
    inked(ctx, steelFill(ctx, 15, 34, 55, 53, tint), 2.2);

    // Instep lames, fanning towards the toe the way the real plates do.
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(17, 34);
    ctx.lineTo(36, 34);
    ctx.quadraticCurveTo(48, 38, 55, 48);
    ctx.lineTo(55, 53);
    ctx.lineTo(15, 53);
    ctx.closePath();
    ctx.clip();
    for (let i = 0; i < 4; i++) {
      const x = 33 + i * 6;
      ctx.strokeStyle = 'rgba(8,8,11,0.6)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x, 34 + i * 3.4);
      ctx.lineTo(x - 3, 53);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(228,236,246,0.28)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(x - 1.5, 35 + i * 3.4);
      ctx.lineTo(x - 4.5, 53);
      ctx.stroke();
    }
    ctx.restore();

    // Sole
    ctx.beginPath();
    ctx.moveTo(14, 53);
    ctx.lineTo(56, 53);
    ctx.lineTo(55, 58);
    ctx.lineTo(15, 58);
    ctx.closePath();
    inked(ctx, leatherFill(ctx, 0, 53, 0, 58), 1.8);

    // Cuff roll at the top of the greave
    ctx.beginPath();
    ctx.rect(18, 7, 20, 6);
    inked(ctx, leatherFill(ctx, 18, 0, 38, 0), 1.6);
    rivet(ctx, 24, 22, 1.8, tint);
    rivet(ctx, 32, 22, 1.8, tint);
    rivet(ctx, 20, 46, 1.8, tint);
  },

  ring(ctx, tint) {
    // Drawn as an ellipse seen at an angle, with the band's inner wall visible
    // \u2014 a flat circle reads as a washer.
    ctx.beginPath();
    ctx.ellipse(32, 36, 15, 18, 0, 0, TAU);
    ctx.strokeStyle = CONTOUR;
    ctx.lineWidth = 9;
    ctx.stroke();
    ctx.strokeStyle = steelFill(ctx, 17, 20, 47, 52, tint || PAL.gold);
    ctx.lineWidth = 6;
    ctx.stroke();
    // Inner shadow so the hole has depth.
    ctx.beginPath();
    ctx.ellipse(32, 36, 11, 14, 0, 0, TAU);
    ctx.strokeStyle = 'rgba(8,7,6,0.45)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Highlight on the upper-left of the band only.
    ctx.beginPath();
    ctx.ellipse(32, 36, 15, 18, 0, Math.PI * 0.95, Math.PI * 1.5);
    ctx.strokeStyle = 'rgba(255,248,224,0.6)';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    gem(ctx, 32, 16, 8, tint || PAL.amber);
  },

  amulet(ctx, tint) {
    // Chain
    ctx.strokeStyle = CONTOUR;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(16, 8);
    ctx.quadraticCurveTo(32, 30, 48, 8);
    ctx.stroke();
    ctx.strokeStyle = css(mixc(PAL.gold, tint || PAL.gold, 0.5));
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(16, 8);
    ctx.quadraticCurveTo(32, 30, 48, 8);
    ctx.stroke();
    // Individual links, so it is a chain and not a wire.
    ctx.fillStyle = css(mixc(PAL.gold, [255, 240, 200], 0.4));
    for (let t = 0.08; t < 0.95; t += 0.11) {
      const x = (1 - t) * (1 - t) * 16 + 2 * (1 - t) * t * 32 + t * t * 48;
      const y = (1 - t) * (1 - t) * 8 + 2 * (1 - t) * t * 30 + t * t * 8;
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, TAU);
      ctx.fill();
    }
    // Setting
    ctx.beginPath();
    ctx.moveTo(24, 26);
    ctx.lineTo(40, 26);
    ctx.lineTo(44, 44);
    ctx.lineTo(32, 58);
    ctx.lineTo(20, 44);
    ctx.closePath();
    inked(ctx, steelFill(ctx, 20, 26, 44, 58, tint || PAL.gold), 2);
    gem(ctx, 32, 40, 10, tint ? mixc(PAL.amber, tint, 0.55) : PAL.amber);
  },
};

// ---------------------------------------------------------------------------
// Baking
// ---------------------------------------------------------------------------

/**
 * The rarity tint that goes into the metal. Common items get none at all \u2014
 * plain steel is the baseline the others are read against, and tinting
 * everything would leave nothing to compare.
 */
function tintFor(rarity) {
  switch (rarity) {
    case 'magic':
      return hex('#7f9dff');
    case 'rare':
      return hex('#f2d24a');
    case 'unique':
      return hex('#c8863a');
    case 'set':
      return hex('#4ad46a');
    default:
      return null;
  }
}

/**
 * Returns a cached 64x64 canvas for an icon/rarity pair. There are eleven
 * icons and five rarities, so the cache tops out at fifty-five little
 * canvases \u2014 cheap enough to hold forever, and it means a bag full of loot
 * costs eleven blits rather than eleven hundred path operations.
 */
function getItemIcon(icon, rarity = 'common') {
  const key = icon + ':' + rarity;
  let c = cache.get(key);
  if (c) return c;
  c = makeCanvas(64, 64);
  const ctx = ctxOf(c);
  const fn = DRAW[icon] || DRAW.sword;
  ctx.save();
  fn(ctx, tintFor(rarity));
  ctx.restore();

  // Wear and a floor shadow, both clipped to the item itself so nothing
  // leaks into the empty corners of the cell.
  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  ctx.globalAlpha = 0.55;
  ctx.drawImage(getWearTile(), 0, 0);
  // A last gradient down the whole icon: everything is a little darker at the
  // bottom, which sits the object in the cell instead of floating it.
  ctx.globalAlpha = 1;
  const sh = ctx.createLinearGradient(0, 20, 0, 64);
  sh.addColorStop(0, 'rgba(0,0,0,0)');
  sh.addColorStop(1, 'rgba(4,4,7,0.42)');
  ctx.fillStyle = sh;
  ctx.fillRect(0, 0, 64, 64);
  ctx.restore();

  cache.set(key, c);
  return c;
}

/** Draws a baked icon centred on (x, y) at the given box size. */
function drawItemIcon(ctx, item, x, y, size) {
  const c = getItemIcon(item.icon, item.rarity);
  ctx.drawImage(c, x - size / 2, y - size / 2, size, size);
}

// ===== src/game/game.js ==============================================
// The game itself: entities, combat, the five acts, and the loop that runs
// them. Rendering lives in ../render, data lives in ./content.














const BAG_SIZE = 40;
const POTION_HEAL = 0.36;
const POTION_CD = 11;

class Game {
  constructor(renderer, input, fx) {
    this.r = renderer;
    this.input = input;
    this.fx = fx;
    this.state = 'menu'; // menu | playing | dead | victory | paused
    this.time = 0;
    this.hitStop = 0;
    this.rng = new RNG(1);
    this.bloodDecals = [0, 1, 2, 3].map((i) => bakeBloodDecal(1000 + i));
    this.scorch = bakeScorchDecal([40, 30, 20], 7);
    this.monsters = [];
    this.projectiles = [];
    this.ground = [];
    this.drops = [];
    this.corpses = [];
    this.messages = [];
    this.tension = 0;
    this.paused = false;
    this.difficulty = 1;
    this.endless = false;
    this.log = [];
  }

  // =========================================================================
  // Run lifecycle
  // =========================================================================

  newRun(classId, seed = Date.now()) {
    const cls = CLASSES[classId];
    this.seed = seed >>> 0;
    this.rng = new RNG(this.seed);
    this.classId = classId;
    this.cls = cls;
    this.player = {
      x: 0,
      y: 0,
      z: 0,
      vx: 0,
      vy: 0,
      facing: -Math.PI / 2,
      anim: 'idle',
      animT: 0,
      animDur: 0,
      phase: 0,
      speed01: 0,
      level: 1,
      xp: 0,
      gold: 0,
      potions: 5,
      maxPotions: 5,
      potionCd: 0,
      hp: 1,
      resource: 0,
      cds: {},
      buffs: {},
      equipment: emptyEquipment(),
      inventory: [],
      radius: 22,
      size: 88,
      invuln: 0,
      dashT: 0,
      dashVX: 0,
      dashVY: 0,
      flash: 0,
      attackChain: 0,
      channel: null,
      alive: true,
      look: LOOKS[cls.look],
      statPoints: 0,
      bonus: {},
      kills: 0,
      totalKills: 0,
    };
    // A starting weapon so the first act isn't bare-handed.
    const startWeapon = makeItem({
      rng: this.rng,
      ilvl: 1,
      slot: 'weapon',
      rarity: 'magic',
    });
    this.equip(startWeapon, true);
    this.recompute();
    this.player.hp = this.stats.maxLife;
    this.player.resource = cls.resource.id === 'zorn' ? 0 : this.stats.maxResource;

    this.actIndex = 0;
    this.endless = false;
    this.difficulty = 1;
    this.loadAct(0);
    this.state = 'playing';
    this.pushMessage(ACTS[0].name, ACTS[0].subtitle, 4.5);
    this.logLine(ACTS[0].intro);
  }

  loadAct(index) {
    clearTimers();
    const act = ACTS[index];
    this.actIndex = index;
    this.act = act;
    this.zone = new Zone(act, index, (this.seed + index * 7919) >>> 0);
    this.r.setAmbience(act.ambience);
    this.r.setTerrain(act.terrain);
    this.r.clearDecals();
    this.fx.clear();
    this.fx.setWeather(
      { snow: 'snow', leaves: 'leaves', mist: 'mist', ash: 'ash', storm: 'storm' }[
        ({ coast: 'snow', forest: 'leaves', bog: 'mist', castle: 'ash', grove: 'storm' })[act.ambience]
      ],
      { coast: 0.55, forest: 0.4, bog: 0.85, castle: 0.5, grove: 0.75 }[act.ambience]
    );
    audio.setKey(act.key);

    this.monsters.length = 0;
    this.projectiles.length = 0;
    this.ground.length = 0;
    this.drops.length = 0;
    this.corpses.length = 0;

    this.player.x = this.zone.start.x;
    this.player.y = this.zone.start.y;
    this.player.facing = -Math.PI / 2;
    this.r.cam.x = this.player.x;
    this.r.cam.y = this.player.y;

    this.killQuota = Math.round(act.quota * (this.endless ? 1.3 : 1));
    this.kills = 0;
    this.bossSpawned = false;
    this.bossDead = false;
    this.boss = null;
    this.portal = null;
    this.spawnTimer = 1.5;
    this.actProgress = 0;
  }

  logLine(text) {
    this.log.push({ text, t: this.time });
    if (this.log.length > 40) this.log.shift();
  }

  pushMessage(title, sub, dur = 3) {
    this.messages.push({ title, sub, life: dur, age: 0 });
  }

  // =========================================================================
  // Character
  // =========================================================================

  recompute() {
    this.stats = computeStats(this.cls, this.player.level, this.player.equipment, this.player.bonus);
    this.player.hp = Math.min(this.player.hp, this.stats.maxLife);
    this.player.resource = Math.min(this.player.resource, this.stats.maxResource);
    // Keep the drawn weapon matching what's equipped.
    const w = this.player.equipment.weapon;
    const look = { ...LOOKS[this.cls.look] };
    if (w) {
      const map = { sword: 'sword', falchion: 'sword', warhammer: 'mace', bow: 'bow', staff: 'staff' };
      look.weapon = map[w.base] || look.weapon;
      if (look.weapon === 'bow') look.weaponHand = 'L';
      else look.weaponHand = 'R';
    }
    const off = this.player.equipment.offhand;
    if (off) look.offhand = off.base === 'tome' ? 'orb' : 'shield';

    // Armour you can see. The rig already knows how to draw a great helm, a
    // kettle hat, a hood, plate, mail and a robe \u2014 the item bases are named
    // after exactly those, so equipping a piece swaps the drawing rather than
    // only moving a number in the stat panel. Finding a helmet should change
    // what your character looks like; that is half of why loot is worth
    // picking up.
    const eq = this.player.equipment;
    if (eq.head) look.helm = eq.head.base;
    if (eq.chest) look.torso = eq.chest.base === 'robe' ? 'robe' : eq.chest.base;

    // The best piece you are wearing tints the metal, so a rare set of plate
    // reads warmer than a common one at a glance, on the character and not
    // just in the bag.
    const RANK = { common: 0, magic: 1, rare: 2, set: 3, unique: 4 };
    const TINTS = {
      magic: hex('#8fa4e8'),
      rare: hex('#e8d089'),
      set: hex('#7fd08f'),
      unique: hex('#d2a068'),
    };
    let best = null;
    for (const slot of ['chest', 'head', 'hands', 'feet']) {
      const it = eq[slot];
      if (it && (!best || RANK[it.rarity] > RANK[best.rarity])) best = it;
    }
    const tint = best && TINTS[best.rarity];
    if (tint) {
      const c = { ...look.colors };
      for (const k of ['metal', 'metalLight', 'metalDark', 'arms', 'armsLight', 'armsDark']) {
        if (c[k]) c[k] = mixc(c[k], tint, k.endsWith('Dark') ? 0.18 : 0.32);
      }
      look.colors = c;
    }

    this.player.look = look;
  }

  equip(item, silent = false) {
    if (!item) return;
    const p = this.player;
    const prev = p.equipment[item.slot];
    p.equipment[item.slot] = item;
    const idx = p.inventory.indexOf(item);
    if (idx >= 0) p.inventory.splice(idx, 1);
    if (prev) p.inventory.push(prev);
    this.recompute();
    if (!silent) {
      audio.play('ui');
      this.logLine(`Angelegt: ${item.name}`);
    }
  }

  unequip(slot) {
    const p = this.player;
    const it = p.equipment[slot];
    if (!it) return;
    p.equipment[slot] = null;
    p.inventory.push(it);
    this.recompute();
    audio.play('ui');
  }

  /** Sells every common item in the bag; the bag fills fast otherwise. */
  sellJunk() {
    const p = this.player;
    let gold = 0;
    let n = 0;
    for (let i = p.inventory.length - 1; i >= 0; i--) {
      const it = p.inventory[i];
      if (it.rarity !== 'common' && it.rarity !== 'magic') continue;
      if (this.isUpgrade(it)) continue;
      gold += it.value;
      n++;
      p.inventory.splice(i, 1);
    }
    if (n) {
      p.gold += gold;
      audio.play('coin');
      this.pushMessage(`\u041f\u0440\u043e\u0434\u0430\u043d\u043e \u0432\u0435\u0449\u0435\u0439: ${n}`, `+${gold} \u0437\u043e\u043b\u043e\u0442\u0430`, 1.8);
    }
    return n;
  }

  sellItem(item) {
    const p = this.player;
    const i = p.inventory.indexOf(item);
    if (i < 0) return;
    p.inventory.splice(i, 1);
    p.gold += item.value;
    audio.play('coin');
  }

  isUpgrade(item) {
    const cur = this.player.equipment[item.slot];
    return itemScore(item, this.cls) > itemScore(cur, this.cls);
  }

  gainXp(amount) {
    const p = this.player;
    if (p.level >= MAX_LEVEL) {
      p.gold += Math.round(amount * 0.5);
      return;
    }
    p.xp += amount;
    while (p.level < MAX_LEVEL && p.xp >= xpForLevel(p.level)) {
      p.xp -= xpForLevel(p.level);
      p.level++;
      p.statPoints += 1;
      this.recompute();
      p.hp = this.stats.maxLife;
      p.potions = Math.min(p.maxPotions, p.potions + 1);
      audio.play('levelUp');
      this.fx.ring(p.x, p.y, { r0: 10, r1: 220, life: 0.9, color: PAL.holy, width: 9 });
      this.fx.embers(p.x, p.y, 20, 40, PAL.holy, 40);
      // Replace any level text still on screen so a double level-up doesn't
      // print two overlapping banners.
      for (let i = this.fx.texts.length - 1; i >= 0; i--) {
        if (this.fx.texts[i].levelUp) this.fx.texts.splice(i, 1);
      }
      this.fx.text(p.x, p.y, 96, '\u0423\u0420\u041e\u0412\u0415\u041d\u042c ' + p.level, {
        color: PAL.holy,
        size: 22,
        bold: true,
        life: 1.6,
        vz: 40,
        levelUp: true,
      });
      this.pushMessage('\u0423\u0440\u043e\u0432\u0435\u043d\u044c ' + p.level, this.unlockedSkillName(p.level) || '\u0422\u0432\u043e\u044f \u0441\u0438\u043b\u0430 \u0440\u0430\u0441\u0442\u0451\u0442', 2.6);
      this.r.addShake(8);
    }
  }

  unlockedSkillName(level) {
    for (const id of this.cls.skills) {
      if (SKILLS[id].unlock === level) return '\u041d\u043e\u0432\u043e\u0435 \u0443\u043c\u0435\u043d\u0438\u0435: ' + SKILLS[id].name;
    }
    return null;
  }

  skillUnlocked(id) {
    return this.player.level >= SKILLS[id].unlock;
  }

  // =========================================================================
  // Monsters
  // =========================================================================

  monsterLevel() {
    const a = this.act.levelRange;
    const t = clamp01(this.kills / Math.max(1, this.killQuota));
    const byAct = lerp(a[0], a[1], t);
    // The act sets the floor, the player's own level the ceiling. Without the
    // cap an under-levelled player meets monsters eight tiers above them.
    // The player's own level is the ceiling and it wins even over the act's
    // floor \u2014 falling behind must never mean facing enemies nine tiers up.
    return Math.max(1, Math.round(Math.min(byAct, this.player.level + 3)));
  }

  spawnMonster(defId, x, y, opts = {}) {
    const def = MONSTERS[defId] || BOSSES[defId];
    if (!def) return null;
    const lvl = opts.level ?? this.monsterLevel();
    // Polynomial, not exponential. An exponent here looks fine at level 5 and
    // one-shots the player at level 20.
    const t = lvl - 1;
    const hpScale = (1 + 0.34 * t + 0.013 * t * t) * this.difficulty;
    const dmgScale = (1 + 0.16 * t + 0.0042 * t * t) * this.difficulty;
    const elite = opts.elite && !def.boss;
    const m = {
      def,
      id: defId,
      name: def.name,
      x,
      y,
      z: 0,
      vx: 0,
      vy: 0,
      facing: rnd(0, TAU),
      anim: 'idle',
      animT: 0,
      animDur: 0,
      phase: rnd(0, TAU),
      speed01: 0,
      level: lvl,
      maxHp: Math.round(def.life * hpScale * (elite ? 3.4 : 1) * (def.boss ? 0.42 : 1)),
      hp: 0,
      dmg: def.dmg * dmgScale * (elite ? 1.35 : 1),
      armor: def.armor * (1 + 0.14 * t),
      speed: def.speed * (elite ? 1.1 : 1) * (opts.speedMul ?? 1),
      radius: def.radius * (elite ? 1.22 : 1),
      size: def.size * (elite ? 1.24 : 1),
      xp: Math.round(def.xp * (1 + 0.9 * t) * (elite ? 3.2 : 1)),
      attackCd: 0,
      windup: 0,
      windupMax: 0,
      state: 'idle',
      target: null,
      flash: 0,
      stun: 0,
      slow: 0,
      slowTime: 0,
      root: 0,
      bleed: 0,
      knockX: 0,
      knockY: 0,
      elite,
      boss: !!def.boss,
      look: MOB_LOOKS[def.look],
      alive: true,
      wander: rnd(0, TAU),
      wanderT: 0,
      abilityCd: 2.5,
      abilityIndex: 0,
      lungeT: 0,
      lungeVX: 0,
      lungeVY: 0,
      phaseNum: 1,
      aggro: false,
    };
    m.hp = m.maxHp;
    if (elite) {
      m.name = eliteName(this.rng, def.name);
      m.look = { ...m.look, rim: PAL.amber };
    }
    this.monsters.push(m);
    return m;
  }

  spawnCamp(camp) {
    camp.triggered = true;
    const pool = this.act.monsters;
    for (let i = 0; i < camp.count; i++) {
      const a = (i / camp.count) * TAU + rnd(-0.3, 0.3);
      const d = rnd(30, camp.r * 0.8);
      const x = camp.x + Math.cos(a) * d;
      const y = camp.y + Math.sin(a) * d;
      if (this.zone.blocked(x, y, 24)) continue;
      this.spawnMonster(this.rng.pick(pool), x, y, { elite: camp.elite && i === 0 });
    }
  }

  spawnBoss() {
    const b = BOSSES[this.act.boss];
    const arena = this.zone.bossArena;
    this.bossSpawned = true;
    const range = this.act.levelRange;
    const m = this.spawnMonster(this.act.boss, arena.x, arena.y - 120, {
      level: Math.round(clamp(this.player.level + 1, range[0], range[1])),
    });
    // A full flask belt: the fight should be decided by play, not by supply.
    this.player.potions = this.player.maxPotions;
    m.aggro = true;
    this.boss = m;
    audio.play('bossRoar');
    this.r.addShake(26);
    this.fx.ring(m.x, m.y, { r0: 20, r1: 460, life: 1.4, color: b.light?.color || PAL.blood, width: 14 });
    this.fx.shards(m.x, m.y, 40, 40, b.light?.color || PAL.blood, 420);
    this.pushMessage(b.name, b.title, 4.5);
    this.logLine(`${b.name} erhebt sich.`);
  }

  // =========================================================================
  // Combat
  // =========================================================================

  playerAttackRoll(coef) {
    const s = this.stats;
    const base = rnd(s.weaponMin, s.weaponMax) * s.damageMult * coef;
    const crit = Math.random() < s.critChanceTotal;
    return { dmg: base * (crit ? s.critDmgTotal : 1), crit };
  }

  damageMonster(m, amount, opts = {}) {
    if (!m.alive) return 0;
    const mit = mitigation(m.armor, this.player.level);
    let dmg = amount * (1 - mit);
    if (m.stun > 0) dmg *= 1.15;
    dmg = Math.max(1, dmg);
    m.hp -= dmg;
    m.flash = 1;
    m.aggro = true;

    const s = this.stats;
    if (s.lifeOnHit > 0 && !opts.noLeech) {
      this.player.hp = Math.min(this.stats.maxLife, this.player.hp + s.lifeOnHit);
    }
    if (this.cls.resource.onHit && !opts.noResource) {
      this.player.resource = Math.min(
        this.stats.maxResource,
        this.player.resource + this.cls.resource.onHit
      );
    }

    const col = opts.crit ? [255, 214, 120] : [246, 240, 228];
    this.fx.damage(m, m.x + rnd(-6, 6), m.y, m.size * 0.7 + rnd(0, 14), dmg, {
      color: col,
      size: opts.crit ? 21 : 15,
      crit: opts.crit,
      life: opts.crit ? 1.15 : 0.85,
    });

    if (opts.knock) {
      const a = opts.angle ?? Math.atan2(m.y - this.player.y, m.x - this.player.x);
      const kb = opts.knock * (m.boss ? 0.12 : m.elite ? 0.5 : 1);
      m.knockX += Math.cos(a) * kb;
      m.knockY += Math.sin(a) * kb;
    }
    if (opts.stun && !m.boss) m.stun = Math.max(m.stun, opts.stun);
    if (opts.slow) {
      m.slow = Math.max(m.slow, opts.slow);
      m.slowTime = Math.max(m.slowTime, opts.slowTime || 2);
    }
    if (opts.root && !m.boss) m.root = Math.max(m.root, opts.root);

    const ang = opts.angle ?? Math.atan2(m.y - this.player.y, m.x - this.player.x);
    this.fx.blood(m.x, m.y, m.size * 0.5, Math.cos(ang), Math.sin(ang), opts.crit ? 18 : 9, opts.bloodColor || PAL.blood);
    if (opts.sparkColor) this.fx.sparks(m.x, m.y, m.size * 0.5, Math.cos(ang), Math.sin(ang), 8, opts.sparkColor);
    // A hot flash exactly where the blow landed.
    this.fx.spawn({
      kind: 'ember',
      x: m.x - Math.cos(ang) * m.radius * 0.6,
      y: m.y - Math.sin(ang) * m.radius * 0.6,
      z: m.size * 0.5,
      vx: 0,
      vy: 0,
      vz: 0,
      life: opts.crit ? 0.2 : 0.12,
      maxLife: opts.crit ? 0.2 : 0.12,
      size: opts.crit ? 13 : 8,
      color: opts.crit ? [255, 226, 170] : [255, 244, 226],
      grav: 0,
      drag: 0,
      glow: true,
    });

    audio.play(opts.crit ? 'crit' : m.def.hitSound || 'hitFlesh');
    this.hitStop = Math.max(this.hitStop, opts.crit ? 0.075 : 0.038);
    this.r.addShake(opts.crit ? 6 : 2.4);

    // Unique item powers.
    if (this.stats.powers.includes('chainLightning') && !opts.chained && Math.random() < 0.28) {
      this.chainLightning(m, dmg * 0.42);
    }
    if (opts.crit && this.stats.powers.includes('bleed')) {
      m.bleed = Math.max(m.bleed, 3);
      m.bleedDmg = dmg * 0.16;
    }

    if (m.hp <= 0) this.killMonster(m, ang);
    return dmg;
  }

  chainLightning(from, dmg) {
    let hops = 0;
    let src = from;
    for (const m of this.monsters) {
      if (hops >= 2) break;
      if (m === from || !m.alive) continue;
      if (dist2(src.x, src.y, m.x, m.y) > 260 * 260) continue;
      this.fx.beam(src.x, src.y, m.x, m.y, {
        z0: src.size * 0.5,
        z1: m.size * 0.5,
        color: PAL.thunder,
        width: 4,
        jagged: true,
        life: 0.2,
      });
      this.damageMonster(m, dmg, { chained: true, noLeech: true, sparkColor: PAL.thunder });
      src = m;
      hops++;
    }
  }

  killMonster(m, ang = 0) {
    if (!m.alive) return;
    m.alive = false;
    m.anim = 'die';
    m.animT = 0;
    m.deathT = 0;
    this.corpses.push(m);
    const i = this.monsters.indexOf(m);
    if (i >= 0) this.monsters.splice(i, 1);

    this.kills++;
    this.player.kills++;
    this.player.totalKills++;
    this.gainXp(m.xp);
    audio.play('monsterDie');
    this.fx.blood(m.x, m.y, m.size * 0.4, Math.cos(ang), Math.sin(ang), 22);
    this.r.addDecal(
      this.bloodDecals[rndInt(0, 3)],
      m.x + rnd(-8, 8),
      m.y + rnd(-6, 6),
      (m.size / 70) * rnd(0.8, 1.3),
      0.85,
      rnd(0, TAU),
      Infinity
    );

    if (this.stats.powers.includes('amberBurst')) {
      this.fx.shards(m.x, m.y, m.size * 0.4, 10, PAL.amber, 300);
      for (const o of this.monsters) {
        if (dist2(o.x, o.y, m.x, m.y) < 150 * 150) {
          this.damageMonster(o, this.stats.weaponMax * this.stats.damageMult * 0.4, { noLeech: true });
        }
      }
    }

    // Loot
    const ilvl = m.level;
    const gold = Math.round(rnd(4, 12) * ilvl * (m.boss ? 22 : m.elite ? 5 : 1) * (1 + this.stats.goldFind));
    this.dropGold(m.x, m.y, gold);
    const items = rollDrop(this.rng, {
      ilvl,
      luck: 1,
      boss: m.boss,
      elite: m.elite,
      chance: 0.15,
    });
    for (const it of items) this.dropItem(m.x + rnd(-30, 30), m.y + rnd(-24, 24), it);

    if (m.boss) {
      this.bossDead = true;
      this.boss = null;
      this.r.addShake(30);
      this.fx.ring(m.x, m.y, { r0: 20, r1: 520, life: 1.6, color: PAL.holy, width: 16 });
      audio.play('legendary');
      this.onBossDefeated(m);
    }
  }

  onBossDefeated(m) {
    const last = this.actIndex >= ACTS.length - 1;
    this.pushMessage(
      last && !this.endless ? '\u041f\u0435\u0440\u043a\u0443\u043d\u0430\u0441 \u043f\u0430\u043b' : m.name + ' \u043f\u043e\u0432\u0435\u0440\u0436\u0435\u043d',
      last && !this.endless ? '\u0420\u043e\u0449\u0430 \u043c\u043e\u043b\u0447\u0438\u0442.' : '\u041e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043f\u0443\u0442\u044c.',
      4
    );
    this.portal = {
      x: m.x,
      y: m.y + 90,
      t: 0,
      last: last && !this.endless,
    };
    audio.play('portal');
    this.logLine(`${m.name} besiegt.`);
    this.save();
  }

  dropGold(x, y, amount) {
    if (amount <= 0) return;
    this.drops.push({
      kind: 'gold',
      amount,
      x: x + rnd(-16, 16),
      y: y + rnd(-12, 12),
      z: 30,
      vz: rnd(90, 170),
      vx: rnd(-70, 70),
      vy: rnd(-50, 50),
      age: 0,
      picked: false,
    });
  }

  dropItem(x, y, item) {
    this.drops.push({
      kind: 'item',
      item,
      x,
      y,
      z: 40,
      vz: rnd(110, 190),
      vx: rnd(-90, 90),
      vy: rnd(-60, 60),
      age: 0,
      picked: false,
    });
    if (item.rarity === 'unique') audio.play('legendary');
    else if (item.rarity === 'rare') audio.play('loot');
  }

  damagePlayer(amount, source) {
    const p = this.player;
    if (!p.alive || p.invuln > 0) return;
    const s = this.stats;
    let dmg = amount * (1 - mitigation(s.armorTotal, source ? source.level : p.level));

    if (p.buffs.ward && p.buffs.ward.t > 0) {
      const absorbed = dmg * (p.buffs.ward.absorb || 0.5);
      dmg -= absorbed;
      if (source) {
        this.damageMonster(source, absorbed * (p.buffs.ward.reflect || 0.5), {
          noLeech: true,
          sparkColor: PAL.amber,
        });
      }
    }
    if (s.powers.includes('bulwark') && p.hp / s.maxLife < 0.35) dmg *= 0.5;

    dmg = Math.max(1, dmg);
    p.hp -= dmg;
    p.flash = 1;
    p.invuln = 0.24;
    this.r.addShake(Math.min(16, 3 + dmg * 0.12));
    this.hitStop = Math.max(this.hitStop, 0.05);
    audio.play('hurt');
    this.fx.text(p.x, p.y, 90, '-' + Math.round(dmg), { color: [255, 110, 96], size: 15 });
    this.fx.blood(p.x, p.y, 40, rnd(-1, 1), rnd(-1, 1), 8);

    if (s.thorns > 0 && source) {
      this.damageMonster(source, s.thorns, { noLeech: true, noResource: true });
    }
    if (s.powers.includes('frostNova') && Math.random() < 0.3) {
      this.fx.ring(p.x, p.y, { r0: 10, r1: 180, life: 0.5, color: PAL.frost, width: 7 });
      for (const m of this.monsters) {
        if (dist2(m.x, m.y, p.x, p.y) < 180 * 180) {
          this.damageMonster(m, s.weaponMax * s.damageMult * 0.5, { slow: 0.6, slowTime: 3, noLeech: true });
        }
      }
    }
    if (this.cls.resource.onTakeHit) {
      p.resource = Math.min(s.maxResource, p.resource + this.cls.resource.onTakeHit);
    }

    if (p.hp <= 0) {
      p.hp = 0;
      p.alive = false;
      p.anim = 'die';
      p.animT = 0;
      this.state = 'dead';
      audio.play('death');
      this.r.addShake(20);
      this.logLine('\u0422\u044b \u043f\u0430\u043b.');
    }
  }

  // =========================================================================
  // Skills
  // =========================================================================

  aimAngle() {
    // Aim at the nearest monster in front, otherwise the movement direction.
    const p = this.player;
    let best = null;
    let bestScore = Infinity;
    for (const m of this.monsters) {
      if (!m.alive) continue;
      const d = dist(p.x, p.y, m.x, m.y);
      if (d > 560) continue;
      const a = Math.atan2(m.y - p.y, m.x - p.x);
      const off = Math.abs(angleDelta(p.facing, a));
      const score = d * (1 + off * 0.85);
      if (score < bestScore) {
        bestScore = score;
        best = m;
      }
    }
    if (best) return Math.atan2(best.y - p.y, best.x - p.x);
    return p.facing;
  }

  aimPoint(range) {
    const p = this.player;
    let best = null;
    let bestD = Infinity;
    for (const m of this.monsters) {
      if (!m.alive) continue;
      const d = dist(p.x, p.y, m.x, m.y);
      if (d < bestD && d < range * 1.15) {
        bestD = d;
        best = m;
      }
    }
    if (best) return { x: best.x, y: best.y };
    const a = p.facing;
    return { x: p.x + Math.cos(a) * range * 0.7, y: p.y + Math.sin(a) * range * 0.7 };
  }

  canUse(id) {
    const sk = SKILLS[id];
    const p = this.player;
    if (!this.skillUnlocked(id)) return false;
    if ((p.cds[id] || 0) > 0) return false;
    if (sk.cost > p.resource) return false;
    if (p.anim === 'dash' || p.anim === 'die') return false;
    if (p.animDur > 0 && p.anim !== 'idle' && sk.kind !== 'channel') return false;
    return true;
  }

  useSkill(id) {
    const sk = SKILLS[id];
    const p = this.player;
    if (!this.canUse(id)) return false;
    p.resource -= sk.cost;
    p.cds[id] = sk.cd;
    const ang = this.aimAngle();
    p.facing = ang;

    const speedMul = this.stats.attackSpeedMult;

    switch (sk.kind) {
      case 'melee': {
        p.attackChain = 1 - p.attackChain;
        this.setAnim(p, p.attackChain ? 'attack' : 'attack2', 0.52 / speedMul);
        p.pendingHit = { skill: id, at: sk.windup / speedMul, angle: ang };
        audio.play('swing');
        break;
      }
      case 'projectile': {
        this.setAnim(p, sk.anim, 0.42 / speedMul);
        p.pendingHit = { skill: id, at: sk.windup / speedMul, angle: ang };
        audio.play(sk.glow ? 'cast' : 'swing');
        break;
      }
      case 'dashAttack': {
        this.setAnim(p, 'dash', sk.dashTime);
        p.dashT = sk.dashTime;
        p.dashSkill = id;
        p.dashVX = Math.cos(ang) * (sk.dashDist / sk.dashTime);
        p.dashVY = Math.sin(ang) * (sk.dashDist / sk.dashTime);
        p.dashHits = new Set();
        p.invuln = Math.max(p.invuln, sk.dashTime * 0.8);
        audio.play('dash');
        break;
      }
      case 'ground': {
        this.setAnim(p, 'cast', 0.5);
        const pt = { x: p.x, y: p.y };
        this.ground.push({
          kind: 'consecrate',
          x: pt.x,
          y: pt.y,
          r: sk.radius,
          life: sk.duration,
          age: 0,
          tick: 0,
          tickRate: sk.tick,
          coef: sk.coef,
          heal: sk.heal,
          color: sk.color,
          owner: 'player',
        });
        audio.play('holy');
        this.fx.ring(pt.x, pt.y, { r0: 10, r1: sk.radius, life: 0.6, color: sk.color, width: 8 });
        break;
      }
      case 'channel': {
        p.channel = { id, t: 0 };
        this.setAnim(p, 'attack', 0.4 / speedMul);
        break;
      }
      case 'cone': {
        this.setAnim(p, 'cast', 0.5);
        audio.play('frost');
        const hit = [];
        for (const m of this.monsters) {
          if (inCone(p.x, p.y, ang, sk.arc, sk.range, m.x, m.y, m.radius)) hit.push(m);
        }
        for (const m of hit) {
          const roll = this.playerAttackRoll(sk.coef);
          this.damageMonster(m, roll.dmg, {
            crit: roll.crit,
            slow: sk.slow,
            slowTime: sk.slowTime,
            sparkColor: sk.color,
            bloodColor: PAL.frost,
            angle: ang,
          });
        }
        for (let i = 0; i < 34; i++) {
          const a = ang + rnd(-sk.arc, sk.arc);
          const d = rnd(20, sk.range);
          this.fx.spawn({
            kind: 'spark',
            x: p.x + Math.cos(a) * d,
            y: p.y + Math.sin(a) * d,
            z: rnd(10, 60),
            vx: Math.cos(a) * rnd(120, 320),
            vy: Math.sin(a) * rnd(120, 320) * 0.6,
            vz: rnd(-10, 40),
            life: rnd(0.25, 0.6),
            maxLife: 0.6,
            size: rnd(2, 5),
            color: PAL.frost,
            grav: 60,
            drag: 2,
            glow: true,
          });
        }
        break;
      }
      case 'strike': {
        this.setAnim(p, 'cast', 0.45);
        const pt = this.aimPoint(420);
        audio.play('cast');
        this.ground.push({
          kind: 'telegraph',
          x: pt.x,
          y: pt.y,
          r: sk.radius,
          life: sk.delay,
          age: 0,
          color: sk.color,
          onEnd: () => {
            audio.play('thunder');
            this.r.addShake(14);
            this.fx.beam(pt.x, pt.y - 10, pt.x, pt.y, {
              z0: 900,
              z1: 0,
              color: sk.color,
              width: 14,
              jagged: true,
              life: 0.28,
            });
            this.fx.ring(pt.x, pt.y, { r0: 12, r1: sk.radius * 1.3, life: 0.5, color: sk.color, width: 9 });
            this.fx.sparks(pt.x, pt.y, 6, 0, -1, 26, sk.color, 460);
            for (const m of this.monsters) {
              if (dist2(m.x, m.y, pt.x, pt.y) < sk.radius * sk.radius) {
                const roll = this.playerAttackRoll(sk.coef);
                this.damageMonster(m, roll.dmg, {
                  crit: roll.crit,
                  sparkColor: sk.color,
                  knock: 120,
                  angle: Math.atan2(m.y - pt.y, m.x - pt.x),
                });
              }
            }
          },
        });
        break;
      }
      case 'trap': {
        this.setAnim(p, 'cast', 0.4);
        const a = p.facing;
        this.ground.push({
          kind: 'trap',
          x: p.x + Math.cos(a) * 90,
          y: p.y + Math.sin(a) * 90,
          r: sk.radius,
          life: sk.duration,
          age: 0,
          armed: true,
          coef: sk.coef,
          root: sk.root,
          color: sk.color,
        });
        audio.play('ui');
        break;
      }
      case 'rain': {
        this.setAnim(p, 'cast', 0.5);
        const pt = this.aimPoint(460);
        this.ground.push({
          kind: 'rain',
          x: pt.x,
          y: pt.y,
          r: sk.radius,
          life: sk.duration,
          age: 0,
          tick: 0,
          tickRate: sk.tick,
          coef: sk.coef,
          color: sk.color,
        });
        audio.play('cast');
        break;
      }
      case 'blink': {
        const a = ang;
        const tx = p.x + Math.cos(a) * sk.dist;
        const ty = p.y + Math.sin(a) * sk.dist;
        this.fx.ring(p.x, p.y, { r0: 6, r1: 90, life: 0.35, color: sk.color, width: 5 });
        this.fx.smoke(p.x, p.y, 20, 10, [60, 120, 100], 18);
        const [nx, ny] = this.zone.resolve(tx, ty, p.radius);
        p.x = nx;
        p.y = ny;
        p.invuln = Math.max(p.invuln, 0.35);
        this.fx.ring(p.x, p.y, { r0: 6, r1: 110, life: 0.4, color: sk.color, width: 6 });
        audio.play('dash');
        // Volley outward
        for (let i = 0; i < sk.volley; i++) {
          const va = a + (i - (sk.volley - 1) / 2) * 0.22;
          this.fireProjectile({
            x: p.x,
            y: p.y,
            z: 42,
            angle: va,
            speed: 820,
            range: 520,
            coef: sk.coef,
            color: sk.color,
            radius: 11,
            pierce: 1,
            kind: 'arrow',
          });
        }
        break;
      }
      case 'ward': {
        this.setAnim(p, 'cast', 0.5);
        p.buffs.ward = { t: sk.duration, absorb: sk.absorb, reflect: sk.reflect };
        this.fx.ring(p.x, p.y, { r0: 10, r1: 90, life: 0.6, color: sk.color, width: 8 });
        audio.play('holy');
        break;
      }
    }
    return true;
  }

  /** Fires the actual damage of a wind-up skill when its windup elapses. */
  resolvePendingHit() {
    const p = this.player;
    const ph = p.pendingHit;
    if (!ph) return;
    p.pendingHit = null;
    const sk = SKILLS[ph.skill];
    const ang = ph.angle;

    if (sk.kind === 'melee') {
      let any = false;
      for (const m of this.monsters) {
        if (!m.alive) continue;
        if (inCone(p.x, p.y, ang, sk.arc / 2, sk.range + m.radius, m.x, m.y, m.radius)) {
          const roll = this.playerAttackRoll(sk.coef);
          this.damageMonster(m, roll.dmg, {
            crit: roll.crit,
            knock: sk.knock,
            angle: Math.atan2(m.y - p.y, m.x - p.x),
          });
          any = true;
        }
      }
      // The crescent the blade cut through the air.
      this.fx.slash(p.x, p.y, 44, ang, sk.range * 0.92, {
        arc: sk.arc,
        dir: p.attackChain ? 1 : -1,
        color: sk.color,
        life: 0.26,
        thickness: 0.34,
      });
      if (!any) audio.play('swing', { vol: 0.6 });
    } else if (sk.kind === 'projectile') {
      const n = sk.count || 1;
      for (let i = 0; i < n; i++) {
        const a = ang + (n > 1 ? (i - (n - 1) / 2) * (sk.spread || 0.2) : 0);
        this.fireProjectile({
          x: p.x,
          y: p.y,
          z: 46,
          angle: a,
          speed: sk.speed,
          range: sk.range,
          coef: sk.coef,
          color: sk.color,
          radius: sk.radius,
          pierce: sk.pierce || 0,
          glow: sk.glow,
          kind: sk.glow ? 'shard' : 'arrow',
        });
      }
    }
  }

  fireProjectile(o) {
    this.projectiles.push({
      x: o.x,
      y: o.y,
      z: o.z ?? 40,
      vx: Math.cos(o.angle) * o.speed,
      vy: Math.sin(o.angle) * o.speed,
      angle: o.angle,
      travelled: 0,
      range: o.range,
      coef: o.coef,
      color: o.color,
      radius: o.radius ?? 10,
      pierce: o.pierce ?? 0,
      hit: new Set(),
      glow: o.glow,
      kind: o.kind || 'arrow',
      hostile: !!o.hostile,
      dmg: o.dmg,
      owner: o.owner,
      life: o.life ?? 4,
    });
  }

  setAnim(e, anim, dur) {
    e.anim = anim;
    e.animT = 0;
    e.animDur = dur;
  }

  // =========================================================================
  // Update
  // =========================================================================

  update(dt) {
    if (this.state !== 'playing') {
      // Still animate the death pose and the world behind the overlay.
      this.time += dt;
      this.updateVisualOnly(dt);
      return;
    }
    if (this.hitStop > 0) {
      this.hitStop -= dt;
      dt *= 0.12;
    }
    this.time += dt;

    this.updatePlayer(dt);
    this.updateMonsters(dt);
    this.updateProjectiles(dt);
    this.updateGround(dt);
    this.updateDrops(dt);
    this.updateCorpses(dt);
    this.updateActFlow(dt);
    this.fx.update(dt);

    for (let i = this.messages.length - 1; i >= 0; i--) {
      const m = this.messages[i];
      m.age += dt;
      if (m.age > m.life) this.messages.splice(i, 1);
    }

    // Tension drives the music.
    let near = 0;
    for (const m of this.monsters) {
      if (!m.aggro) continue;
      const d = dist2(m.x, m.y, this.player.x, this.player.y);
      if (d < 700 * 700) near += m.boss ? 6 : m.elite ? 2 : 1;
    }
    this.tension = clamp01(near / 7) * (this.boss ? 1 : 0.85);
    if (this.boss) this.tension = 1;
  }

  updateVisualOnly(dt) {
    this.fx.update(dt);
    const p = this.player;
    if (!p) return;
    this.updateCorpses(dt);
    if (p.anim === 'die') {
      p.animT = Math.min(1, p.animT + dt * 1.6);
    }
    for (const m of this.messages) m.age += dt;
  }

  updatePlayer(dt) {
    const p = this.player;
    const inp = this.input;
    if (!p.alive) return;

    p.invuln = Math.max(0, p.invuln - dt);
    p.flash = Math.max(0, p.flash - dt * 6);
    p.potionCd = Math.max(0, p.potionCd - dt);
    for (const k in p.cds) p.cds[k] = Math.max(0, p.cds[k] - dt);
    for (const k in p.buffs) {
      const b = p.buffs[k];
      b.t -= dt;
      if (b.t <= 0) delete p.buffs[k];
    }

    // Resource
    const res = this.cls.resource;
    const regen = res.regen + this.stats.resourceRegen;
    p.resource = clamp(p.resource + regen * dt, 0, this.stats.maxResource);

    // Animation clock
    if (p.animDur > 0) {
      p.animT += dt / p.animDur;
      if (p.pendingHit && p.animT >= p.pendingHit.at / p.animDur) this.resolvePendingHit();
      if (p.animT >= 1) {
        p.animT = 0;
        p.animDur = 0;
        p.anim = 'idle';
        if (p.pendingHit) this.resolvePendingHit();
      }
    }

    // Dash movement
    if (p.dashT > 0) {
      p.dashT -= dt;
      const [nx, ny] = this.zone.resolve(p.x + p.dashVX * dt, p.y + p.dashVY * dt, p.radius);
      p.x = nx;
      p.y = ny;
      this.fx.smoke(p.x, p.y, 8, 2, [120, 120, 130], 10);
      if (p.dashSkill) {
        const sk = SKILLS[p.dashSkill];
        for (const m of this.monsters) {
          if (!m.alive || p.dashHits.has(m)) continue;
          if (dist2(m.x, m.y, p.x, p.y) < (sk.radius + m.radius) * (sk.radius + m.radius)) {
            p.dashHits.add(m);
            const roll = this.playerAttackRoll(sk.coef);
            this.damageMonster(m, roll.dmg, {
              crit: roll.crit,
              knock: sk.knock,
              stun: sk.stun,
              angle: Math.atan2(m.y - p.y, m.x - p.x),
              sparkColor: PAL.steelLight,
            });
          }
        }
      }
      if (p.dashT <= 0) {
        p.dashSkill = null;
        p.anim = 'idle';
        p.animDur = 0;
      }
      p.speed01 = 1;
      p.phase += dt * 12;
      return;
    }

    // Movement
    inp.update();
    const mv = inp.move;
    const busy = p.animDur > 0 && (p.anim === 'attack' || p.anim === 'attack2' || p.anim === 'thrust');
    const slowFactor = busy ? 0.4 : 1;
    const spd = this.stats.moveSpeedTotal * slowFactor;
    if (mv.mag > 0.05) {
      // Screen-space input mapped into the squashed world.
      const wx = mv.x;
      const wy = mv.y / ISO_Y;
      const l = Math.hypot(wx, wy) || 1;
      const dx = (wx / l) * spd * mv.mag;
      const dy = (wy / l) * spd * mv.mag;
      p.vx = damp(p.vx, dx, 16, dt);
      p.vy = damp(p.vy, dy, 16, dt);
      if (!busy) p.facing = angleTowards(p.facing, Math.atan2(dy, dx), dt * 16);
    } else {
      p.vx = damp(p.vx, 0, 18, dt);
      p.vy = damp(p.vy, 0, 18, dt);
    }
    const [nx, ny] = this.zone.resolve(p.x + p.vx * dt, p.y + p.vy * dt, p.radius);
    p.x = nx;
    p.y = ny;

    const sp = Math.hypot(p.vx, p.vy) / this.stats.moveSpeedTotal;
    p.speed01 = clamp01(sp);
    p.phase += dt * (5 + p.speed01 * 8);
    if (p.speed01 > 0.35) audio.play('step', { vol: 0.5 });

    // Channelled skill (whirlwind)
    if (p.channel) {
      const sk = SKILLS[p.channel.id];
      if (!inp.isDown('skill' + (this.cls.skills.indexOf(p.channel.id) + 1)) || p.resource <= 0) {
        p.channel = null;
        p.anim = 'idle';
        p.animDur = 0;
      } else {
        p.channel.t += dt;
        p.resource = Math.max(0, p.resource - sk.costPerSec * dt);
        p.facing += dt * 14;
        p.animT = (p.animT + dt * 3) % 1;
        p.anim = 'attack';
        p.animDur = 1;
        if (!p.channel.tick) p.channel.tick = 0;
        p.channel.tick -= dt;
        if (p.channel.tick <= 0) {
          p.channel.tick = sk.tick;
          audio.play('swing', { vol: 0.5 });
          this.fx.ring(p.x, p.y, { r0: sk.radius * 0.6, r1: sk.radius, life: 0.2, color: sk.color, width: 4 });
          for (const m of this.monsters) {
            if (!m.alive) continue;
            if (dist2(m.x, m.y, p.x, p.y) < (sk.radius + m.radius) ** 2) {
              const roll = this.playerAttackRoll(sk.coef);
              this.damageMonster(m, roll.dmg, {
                crit: roll.crit,
                knock: sk.knock,
                angle: Math.atan2(m.y - p.y, m.x - p.x),
              });
            }
          }
        }
      }
    }

    // Skill buttons
    const skills = this.cls.skills;
    for (let i = 0; i < skills.length; i++) {
      const id = skills[i];
      const btn = 'skill' + (i + 1);
      const sk = SKILLS[id];
      const held = inp.isDown(btn);
      const pressed = inp.wasPressed(btn);
      if (sk.kind === 'channel') {
        if (pressed && this.canUse(id)) this.useSkill(id);
      } else if (i === 0 ? held : pressed) {
        this.useSkill(id);
      }
    }
    if (inp.isDown('attack')) this.useSkill(skills[0]);

    // Potion
    if (inp.wasPressed('potion')) this.drinkPotion();

    // Pick up loot by walking over it, and by tapping it.
    if (inp.tap) {
      const w = this.r.toWorld(inp.tap.x, inp.tap.y);
      for (const d of this.drops) {
        if (d.picked) continue;
