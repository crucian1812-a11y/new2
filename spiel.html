<style>
/* The page is only a frame for the canvas &#8212; everything else is drawn. */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05060a;
  color: #ddd6c4;
  font-family: 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;

  -webkit-user-select: none;
  user-select: none;

}

#game {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;

/* ---------------------------------------------------------------- loader */

#loader {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 38%, #1b1720 0%, #0b0b10 45%, #05050a 100%);
  transition: opacity 0.55s ease;
}

#loader.hidden {
  opacity: 0;
  pointer-events: none;
}

.loaderInner {
  text-align: center;
  padding: 24px;
  max-width: 420px;
}

.crest {
  margin-bottom: 12px;
  filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.7));
  animation: breathe 4.5s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-4px) scale(1.015); }
}

#loader h1 {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(20px, 5vw, 30px);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #e6d3a0;

#loader .sub {
  margin-top: 4px;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #7d7768;
}

.barOuter {
  margin: 20px auto 10px;
  width: min(280px, 70vw);
  height: 5px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(160, 140, 96, 0.35);
  border-radius: 3px;
  overflow: hidden;
}

#loaderBar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #6b5a2c, #d8b96a, #f0dca8);
  box-shadow: 0 0 12px rgba(216, 185, 106, 0.5);
  transition: width 0.25s ease;
}

#loaderText {
  font-size: 11px;
  color: #8b8474;
  letter-spacing: 0.05em;
}

/* --------------------------------------------------------------- rotate */

#rotate {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  place-items: center;
  background: rgba(5, 6, 10, 0.94);
  text-align: center;
}

#rotate.show {
  display: grid;
}

.rotateInner p {
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 0.08em;
  color: #cfc6a8;
}

.rotateInner svg {
  animation: tilt 2.4s ease-in-out infinite;

@keyframes tilt {
  0%, 100% { transform: rotate(0deg); }
  55%, 85% { transform: rotate(-88deg); }
}

.noscript {
  position: fixed;

  display: grid;
  place-items: center;
  background: #05060a;
  color: #ddd6c4;
  font-size: 15px;
  z-index: 40;
}

<script type="module">
// ===== src/core/math.js ==============================================
// Kleine Mathematik-Bibliothek \u2014 small math helpers used across the engine.

const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mix = lerp;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
const smoothstep = (e0, e1, x) => {
  const t = clamp01((x - e0) / (e1 - e0 || 1e-6));
  return t * t * (3 - 2 * t);
};
const smootherstep = (e0, e1, x) => {
  const t = clamp01((x - e0) / (e1 - e0 || 1e-6));
  return t * t * t * (t * (t * 6 - 15) + 10);
};

/** Frame-rate independent exponential approach. */
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

const dist2 = (ax, ay, bx, by) => {
  const dx = bx - ax;
  const dy = by - ay;
  return dx * dx + dy * dy;
};
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

/** Shortest signed angular difference from a to b, in (-PI, PI]. */
function angleDelta(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

function angleTowards(a, b, maxStep) {
  const d = angleDelta(a, b);
  if (Math.abs(d) <= maxStep) return b;
  return a + Math.sign(d) * maxStep;
}

function angleLerp(a, b, t) {
  return a + angleDelta(a, b) * t;
}

/** Normalises a vector in place-ish, returning {x,y,len}. */
function norm(x, y) {
  const l = Math.hypot(x, y);
  if (l < 1e-6) return { x: 0, y: 0, len: 0 };
  return { x: x / l, y: y / l, len: l };
}

const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);
const easeInOutQuad = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOutBack = (t) => {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeOutElastic = (t) => {
  const c4 = (2 * Math.PI) / 3;
  return t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
};

/** Circle vs circle overlap test. */
const circlesOverlap = (ax, ay, ar, bx, by, br) =>
  dist2(ax, ay, bx, by) < (ar + br) * (ar + br);

/**
 * Is point p inside the cone with apex at (ox,oy), facing `facing`,
 * half-angle `halfArc`, of length `range`?
 */
function inCone(ox, oy, facing, halfArc, range, px, py, pr = 0) {
  const dx = px - ox;
  const dy = py - oy;
  const d = Math.hypot(dx, dy);
  if (d > range + pr) return false;
  if (d < 1e-4) return true;
  const a = Math.atan2(dy, dx);
  const delta = Math.abs(angleDelta(facing, a));
  // Widen the arc for close targets so touching enemies are always hit.
  const widen = Math.atan2(pr, Math.max(d, 1));
  return delta <= halfArc + widen;
}

/** Distance from point p to segment ab. */
function pointSegmentDist(px, py, ax, ay, bx, by) {
  const abx = bx - ax;
  const aby = by - ay;
  const l2 = abx * abx + aby * aby;
  const t = l2 < 1e-6 ? 0 : clamp01(((px - ax) * abx + (py - ay) * aby) / l2);
  return Math.hypot(px - (ax + abx * t), py - (ay + aby * t));
}

/** Formats large numbers compactly: 12345 -> "12.3k". */
function fmtNum(n) {
  n = Math.round(n);
  if (n < 1000) return String(n);
  if (n < 100000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  if (n < 1e6) return Math.round(n / 1000) + 'k';
  return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
}

// ===== src/core/rng.js ===============================================
// Deterministic pseudo random numbers. Every visual and every dungeon is
// generated from a seed so a run can be reproduced exactly.

/** 32-bit string/number hash (FNV-ish + avalanche). */
function hashSeed(input) {
  let h = 2166136261 >>> 0;
  const s = String(input);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  h ^= h >>> 16;
  h = Math.imul(h, 2246822507) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 3266489909) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

/** Mulberry32 \u2014 small, fast, good enough for games. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class RNG {
  constructor(seed = Date.now()) {
    this.seed = typeof seed === 'number' ? seed >>> 0 : hashSeed(seed);
    this.next = mulberry32(this.seed);
  }
  /** [0,1) */
  float() {
    return this.next();
  }
  /** [a,b) */
  range(a, b) {
    return a + this.next() * (b - a);
  }
  /** integer in [a,b] inclusive */
  int(a, b) {
    return Math.floor(a + this.next() * (b - a + 1));
  }
  bool(p = 0.5) {
    return this.next() < p;
  }
  sign() {
    return this.next() < 0.5 ? -1 : 1;
  }
  pick(arr) {
    return arr[Math.floor(this.next() * arr.length)];
  }
  /** Fisher\u2013Yates, in place. */
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }
  /** Picks from [{w:number, ...}] by weight. */
  weighted(entries, weightKey = 'w') {
    let total = 0;
    for (const e of entries) total += e[weightKey] || 0;
    let r = this.next() * total;
    for (const e of entries) {
      r -= e[weightKey] || 0;
      if (r <= 0) return e;
    }
    return entries[entries.length - 1];
  }
  /** Approximate normal distribution (mean 0, sd 1) via 3 samples. */
  gauss() {
    return (this.next() + this.next() + this.next() - 1.5) * 1.1547;
  }
  /** Random point inside a unit disc. */
  disc() {
    const a = this.next() * Math.PI * 2;
    const r = Math.sqrt(this.next());
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  }
  fork(salt) {
    return new RNG(hashSeed(this.seed + ':' + salt));
  }
}

/** A global, non-deterministic RNG for cosmetic-only randomness (sparks etc). */
const rand = () => Math.random();
const rnd = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const chance = (p) => Math.random() < p;

// ===== src/render/palette.js =========================================
// Art direction for "Der Weg des Ritters" \u2014 a cold, painterly Baltic gothic
// palette. Everything in the game samples from here so the whole thing reads
// as one picture instead of a pile of coloured shapes.

const rgb = (r, g, b) => [r, g, b];

function css([r, g, b], a = 1) {
  return a >= 1
    ? `rgb(${r | 0},${g | 0},${b | 0})`
    : `rgba(${r | 0},${g | 0},${b | 0},${a})`;
}

function mixc(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function shade(c, f) {
  return [c[0] * f, c[1] * f, c[2] * f];
}

function addc(a, b) {
  return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
}

/** Multi-stop colour ramp. stops = [[t, [r,g,b]], ...] sorted by t. */
function ramp(stops, t) {
  if (t <= stops[0][0]) return stops[0][1].slice();
  const last = stops[stops.length - 1];
  if (t >= last[0]) return last[1].slice();
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const a = stops[i - 1];
      const b = stops[i];
      const k = (t - a[0]) / (b[0] - a[0] || 1e-6);
      return mixc(a[1], b[1], k);
    }
  }
  return last[1].slice();
}

/** Converts a hex string to [r,g,b]. */
function hex(h) {
  const n = parseInt(h.replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// ===== src/render/noise.js ===========================================
// Procedural noise used to bake every texture in the game.
// Simplex-flavoured gradient noise + fbm + ridged + worley + domain warp.


const GRAD2 = new Float32Array(512);
const PERM = new Uint8Array(512);

function buildTables(seed) {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  // Deterministic shuffle from the seed.
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  for (let i = 255; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const tmp = p[i];
    p[i] = p[j];
    p[j] = tmp;
  }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
  for (let i = 0; i < 256; i++) {
    const a = (i / 256) * Math.PI * 2 + rnd() * 0.02;
    GRAD2[i * 2] = Math.cos(a);
    GRAD2[i * 2 + 1] = Math.sin(a);
  }
}
buildTables(0x9e3779b9);

/** Re-seeds the shared noise tables. Call once per world seed. */
function seedNoise(seed) {
  buildTables(typeof seed === 'number' ? seed : hashSeed(seed));
}

const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);

/** Perlin-style gradient noise, output in about [-1, 1]. */
function noise2(x, y) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const X = xi & 255;
  const Y = yi & 255;

  const u = fade(xf);
  const v = fade(yf);

  const aa = PERM[X + PERM[Y]] & 255;
  const ba = PERM[X + 1 + PERM[Y]] & 255;
  const ab = PERM[X + PERM[Y + 1]] & 255;
  const bb = PERM[X + 1 + PERM[Y + 1]] & 255;

  const d1 = GRAD2[aa * 2] * xf + GRAD2[aa * 2 + 1] * yf;
  const d2 = GRAD2[ba * 2] * (xf - 1) + GRAD2[ba * 2 + 1] * yf;
  const d3 = GRAD2[ab * 2] * xf + GRAD2[ab * 2 + 1] * (yf - 1);
  const d4 = GRAD2[bb * 2] * (xf - 1) + GRAD2[bb * 2 + 1] * (yf - 1);

  const x1 = d1 + u * (d2 - d1);
  const x2 = d3 + u * (d4 - d3);
  return (x1 + v * (x2 - x1)) * 1.4;
}

/** Tileable gradient noise over a period of `period` cells. */
function noise2Tile(x, y, period) {
  // Blend four wrapped samples so the result seams perfectly.
  const px = ((x % period) + period) % period;
  const py = ((y % period) + period) % period;
  const fx = px / period;
  const fy = py / period;
  const a = noise2(px, py);
  const b = noise2(px - period, py);
  const c = noise2(px, py - period);
  const d = noise2(px - period, py - period);
  const ab = a * (1 - fx) + b * fx;
  const cd = c * (1 - fx) + d * fx;
  return ab * (1 - fy) + cd * fy;
}

function fbm(x, y, octaves = 5, lacunarity = 2.03, gain = 0.5) {
  let sum = 0;
  let amp = 1;
  let freq = 1;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += noise2(x * freq, y * freq) * amp;
    norm += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return sum / norm;
}

function fbmTile(x, y, period, octaves = 5, gain = 0.5) {
  let sum = 0;
  let amp = 1;
  let freq = 1;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += noise2Tile(x * freq, y * freq, period * freq) * amp;
    norm += amp;
    amp *= gain;
    freq *= 2;
  }
  return sum / norm;
}

function ridged(x, y, octaves = 5, gain = 0.5) {
  let sum = 0;
  let amp = 1;
  let freq = 1;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    const n = 1 - Math.abs(noise2(x * freq, y * freq));
    sum += n * n * amp;
    norm += amp;
    amp *= gain;
    freq *= 2.02;
  }
  return sum / norm;
}

function ridgedTile(x, y, period, octaves = 5, gain = 0.5) {
  let sum = 0;
  let amp = 1;
  let freq = 1;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    const n = 1 - Math.abs(noise2Tile(x * freq, y * freq, period * freq));
    sum += n * n * amp;
    norm += amp;
    amp *= gain;
    freq *= 2;
  }
  return sum / norm;
}

/** Cellular / Worley noise. Returns distance to nearest feature point (tileable). */
function worleyTile(x, y, period) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  let best = 8;
  let second = 8;
  for (let oy = -1; oy <= 1; oy++) {
    for (let ox = -1; ox <= 1; ox++) {
      const cx = (((xi + ox) % period) + period) % period;
      const cy = (((yi + oy) % period) + period) % period;
      const h = PERM[(cx + PERM[cy & 255]) & 255];
      const h2 = PERM[(cy + PERM[(cx + 37) & 255]) & 255];
      const px = ox + h / 255;
      const py = oy + h2 / 255;
      const d = Math.hypot(px - xf, py - yf);
      if (d < best) {
        second = best;
        best = d;
      } else if (d < second) second = d;
    }
  }
  return { f1: best, f2: second, edge: second - best };
}

/** Domain-warped fbm \u2014 gives organic, marbled, non-repetitive structure. */
function warpFbm(x, y, warp = 1.4, octaves = 5) {
  const qx = fbm(x, y, 3);
  const qy = fbm(x + 5.2, y + 1.3, 3);
  return fbm(x + warp * qx, y + warp * qy, octaves);
}

function warpFbmTile(x, y, period, warp = 1.2, octaves = 5) {
  const qx = fbmTile(x, y, period, 3);
  const qy = fbmTile(x + 5.2, y + 1.3, period, 3);
  return fbmTile(x + warp * qx, y + warp * qy, period, octaves);
}

// ===== src/render/textures.js ========================================
// Every surface in the game is baked here, from noise, at load time.
// The trick that keeps it from looking like flat plastic: each material is
// generated as a *height field* first, then lit with a real surface normal so
// grit, cracks, moss clumps and cobbles catch light the way relief does.





function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

function ctxOf(canvas, alpha = true) {
  return canvas.getContext('2d', { alpha, willReadFrequently: false });
}

// ---------------------------------------------------------------------------
// Relief-lit material baker
// ---------------------------------------------------------------------------

const SUN = (() => {
  const v = [-0.42, -0.68, 0.6];
  const l = Math.hypot(v[0], v[1], v[2]);
  return [v[0] / l, v[1] / l, v[2] / l];
})();

/**
 * cfg = {
 *   size, freq (integer noise cells across the tile \u2014 required for seamlessness),
 *   height(u,v,F) -> 0..1,
 *   color(h,u,v,F) -> [r,g,b],
 *   bump, ambient, diffuse, spec, specPow, aoStrength,
 *   ambientColor, sunColor
 * }
 */
function bakeMaterial(cfg) {
  const size = cfg.size || 256;
  const F = cfg.freq || 6;
  const bump = cfg.bump ?? 2.2;
  const ambient = cfg.ambient ?? 0.55;
  const diffuse = cfg.diffuse ?? 0.7;
  const spec = cfg.spec ?? 0;
  const specPow = cfg.specPow ?? 24;
  const aoStrength = cfg.aoStrength ?? 0.35;
  const ambientColor = cfg.ambientColor || [0.72, 0.8, 1.0];
  const sunColor = cfg.sunColor || [1.0, 0.93, 0.82];

  const H = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    const v = (y / size) * F;
    for (let x = 0; x < size; x++) {
      H[y * size + x] = cfg.height((x / size) * F, v, F);
    }
  }

  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas, false);
  const img = ctx.createImageData(size, size);
  const d = img.data;

  // Wrapped neighbour lookup keeps the lighting seamless too.
  const at = (x, y) => H[((y + size) % size) * size + ((x + size) % size)];

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y * size + x;
      const h = H[i];
      const dhx = (at(x + 1, y) - at(x - 1, y)) * 0.5;
      const dhy = (at(x, y + 1) - at(x, y - 1)) * 0.5;

      let nx = -dhx * bump * size * 0.02;
      let ny = -dhy * bump * size * 0.02;
      const nl = Math.hypot(nx, ny, 1);
      nx /= nl;
      ny /= nl;
      const nz = 1 / nl;

      const ndl = Math.max(0, nx * SUN[0] + ny * SUN[1] + nz * SUN[2]);

      // Cheap cavity AO: low spots and high curvature go dark.
      const curv = clamp01(0.5 + (at(x + 2, y) + at(x - 2, y) + at(x, y + 2) + at(x, y - 2)) * 0.25 - h);
      const ao = 1 - aoStrength * (1 - clamp01(h * 0.55 + 0.45)) - aoStrength * 0.5 * curv;

      const albedo = cfg.color(h, (x / size) * F, (y / size) * F, F);

      let r = albedo[0] * (ambient * ambientColor[0] + diffuse * ndl * sunColor[0]) * ao;
      let g = albedo[1] * (ambient * ambientColor[1] + diffuse * ndl * sunColor[1]) * ao;
      let b = albedo[2] * (ambient * ambientColor[2] + diffuse * ndl * sunColor[2]) * ao;

      if (spec > 0) {
        // Blinn-Phong against a straight-up viewer.
        const hx = SUN[0] * 0.5;
        const hy = SUN[1] * 0.5;
        const hz = (SUN[2] + 1) * 0.5;
        const hl = Math.hypot(hx, hy, hz);
        const nh = Math.max(0, (nx * hx + ny * hy + nz * hz) / hl);
        const s = Math.pow(nh, specPow) * spec * 255;
        r += s;
        g += s * 0.98;
        b += s * 0.92;
      }

      const o = i * 4;
      d[o] = r < 0 ? 0 : r > 255 ? 255 : r;
      d[o + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[o + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
      d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/** Small deterministic value hash used for fleck placement. */
function h21(x, y) {
  let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

      const dome = Math.pow(smoothstep(0.62, 0.04, w.f1), 0.7);
      const grit = fbmTile(u * 18, v * 18, F * 18, 2) * 0.5 + 0.5;
      const gap = smoothstep(0.16, 0.0, w.edge);
      return clamp01(dome * 0.86 + grit * 0.1 - gap * 0.35);
    },
    color: (h, u, v, F) => {
      const wu = u * 1.6 + fbmTile(u, v, F, 3) * 0.35;
      const wv = v * 1.6 + fbmTile(u + 7, v + 3, F, 3) * 0.35;
      const w = worleyTile(wu, wv, F * 1.6);
      const id = h21(Math.floor(wu * 3.1 + w.f1 * 11), Math.floor(wv * 2.7));
      // Baltic fieldstone: greys, warm browns, the odd reddish granite.
      let base = mixc(C.granite, C.stone, id);
      if (id > 0.78) base = mixc(base, hex('#6b5344'), 0.6);
      else if (id < 0.2) base = mixc(base, hex('#454b52'), 0.7);
      let c = mixc(base, C.stoneDark, smoothstep(0.24, 0.66, w.f1) * 0.9);
      c = mixc(c, C.stoneLight, clamp01(h - 0.62) * 1.5);
      // Mud and moss packed into the joints.
      c = mixc(c, hex('#22201a'), smoothstep(0.12, 0.0, w.edge) * 0.8);
      const mossy = fbmTile(u * 4 + 21, v * 4, F * 4, 3) * 0.5 + 0.5;
      if (mossy > 0.7) c = mixc(c, C.mossDark, (mossy - 0.7) * 1.5 * smoothstep(0.2, 0.02, w.edge));
      return c;
    },
  },

  // --- Act V: the sacred grove --------------------------------------------
  grove: {
    freq: 5,
    bump: 2.8,
    aoStrength: 0.5,
    ambient: 0.68,
    height: (u, v, F) => {
      const root = ridgedTile(u * 1.1, v * 1.1, F, 4);
      const soil = fbmTile(u * 3, v * 3, F * 3, 4) * 0.5 + 0.5;
      const leaf = worleyTile(u * 8, v * 8, F * 8);
      return clamp01(soil * 0.32 + smoothstep(0.72, 1, root) * 0.55 + smoothstep(0.36, 0.05, leaf.f1) * 0.3);
    },
    color: (h, u, v, F) => {
      const root = ridgedTile(u * 1.1, v * 1.1, F, 4);
      let c = mixc(hex('#332720'), hex('#54432e'), fbmTile(u * 2, v * 2, F * 2, 3) * 0.5 + 0.5);
      c = mixc(c, C.bark, smoothstep(0.74, 1, root) * 0.8);
      const leaf = worleyTile(u * 8, v * 8, F * 8);
      if (leaf.f1 < 0.3) c = mixc(c, C.leafRed, smoothstep(0.3, 0.05, leaf.f1) * 0.5);
      const glow = fbmTile(u * 3 + 40, v * 3, F * 3, 3) * 0.5 + 0.5;
      if (glow > 0.76) c = mixc(c, hex('#4a3a6a'), (glow - 0.76) * 1.6);
      return c;
    },
  },
};

const materialCache = new Map();

function getMaterial(name, size = 256) {
  const key = name + ':' + size;
  let c = materialCache.get(key);
  if (!c) {
    const cfg = MATERIALS[name];
    if (!cfg) throw new Error('Unknown material ' + name);
    c = bakeMaterial({ ...cfg, size });
    materialCache.set(key, c);
  }
  return c;
}

const patternCache = new Map();
function getPattern(ctx, name, size = 256) {
  const key = name + ':' + size;
  let p = patternCache.get(key);
  if (!p) {
    p = ctx.createPattern(getMaterial(name, size), 'repeat');
    patternCache.set(key, p);
  }
  return p;
}

// ---------------------------------------------------------------------------
// Masks & overlays
// ---------------------------------------------------------------------------

/** Soft organic blob mask, used to splat one material over another. */
function bakeBlobMask(size, seed) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const F = 4;
  const off = (seed % 97) * 3.7;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = (x / size) * F;
      const v = (y / size) * F;
      const n = fbmTile(u + off, v + off, F, 4) * 0.5 + 0.5;
      const cx = x / size - 0.5;
      const cy = y / size - 0.5;
      const r = Math.hypot(cx, cy) * 2;
      const a = clamp01((1 - smoothstep(0.35, 1.0, r)) * (0.35 + n * 1.1) - 0.12);
      const o = (y * size + x) * 4;
      d[o] = d[o + 1] = d[o + 2] = 255;
      d[o + 3] = a * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/** Animated-looking caustic sheet for water surfaces. */
function bakeCaustics(size = 256) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const F = 5;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = (x / size) * F;
      const v = (y / size) * F;
      const w = worleyTile(u, v, F);
      const line = Math.pow(clamp01(1 - w.edge * 6), 3);
      const n = clamp01(fbmTile(u * 2, v * 2, F * 2, 3) * 0.5 + 0.5);
      const a = clamp01(line * 0.85 * (0.4 + n));
      const o = (y * size + x) * 4;
      d[o] = 210;
      d[o + 1] = 235;
      d[o + 2] = 255;
      d[o + 3] = a * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/** Soft cloud sheet for drifting ground fog. */
function bakeFogSheet(size = 256, seed = 1) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const F = 3;
  const off = seed * 13.3;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = (x / size) * F;
      const v = (y / size) * F;
      let n = fbmTile(u + off, v + off, F, 5) * 0.5 + 0.5;
      n = clamp01((n - 0.42) * 2.1);
      const o = (y * size + x) * 4;
      d[o] = 255;
      d[o + 1] = 255;
      d[o + 2] = 255;
      d[o + 3] = n * n * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/** Fine film grain tile, composited over the finished frame. */
function bakeGrain(size = 128) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const rng = new RNG(0x9a71c3);
  for (let i = 0; i < size * size; i++) {
    const g = 128 + (rng.float() - 0.5) * 90;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = g;
    d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/** Radial light falloff sprite \u2014 one bake, reused for every light in the game. */
function bakeLightSprite(size = 256, softness = 1) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    // Inverse-square-ish falloff, softened so it reads painterly not clinical.
    const a = Math.pow(1 - t, 2.0 + softness) * (1 - t * 0.15);
    g.addColorStop(t, `rgba(255,255,255,${a.toFixed(4)})`);
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return canvas;
}

/** Soft elliptical contact shadow. */
function bakeShadowSprite(size = 128) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  // Tight and dark. A wide soft smudge reads as a figure hovering over a
  // stain; a small dense one nails the feet to the ground.
  g.addColorStop(0, 'rgba(0,0,0,0.9)');
  g.addColorStop(0.38, 'rgba(0,0,0,0.66)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return canvas;
}

/** Blood splat decal. */
function bakeBloodDecal(seed, size = 96) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const rng = new RNG(seed);
  const cx = size / 2;
  const cy = size / 2;
  const blobs = rng.int(5, 9);
  for (let i = 0; i < blobs; i++) {
    const a = rng.float() * Math.PI * 2;
    const r = rng.range(0, size * 0.28);
    const rr = rng.range(size * 0.06, size * 0.2);
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r * 0.8;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
    g.addColorStop(0, 'rgba(96,14,16,0.95)');
    g.addColorStop(0.6, 'rgba(62,10,12,0.7)');
    g.addColorStop(1, 'rgba(40,6,8,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, rr, rr * rng.range(0.6, 1), rng.float() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  // Flung droplets.
  for (let i = 0; i < rng.int(6, 14); i++) {
    const a = rng.float() * Math.PI * 2;
    const r = rng.range(size * 0.2, size * 0.46);
    const rr = rng.range(1, 3.4);
    ctx.fillStyle = `rgba(70,10,12,${rng.range(0.3, 0.8).toFixed(2)})`;
    ctx.beginPath();
    ctx.ellipse(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.8, rr, rr * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  return canvas;
}

/** Scorch / frost / arcane ground decal used by spells. */
function bakeScorchDecal(color, seed, size = 128) {
  const canvas = makeCanvas(size, size);
  const ctx = ctxOf(canvas);
  const rng = new RNG(seed);
  const cx = size / 2;
  const cy = size / 2;
  for (let i = 0; i < 10; i++) {
    const a = rng.float() * Math.PI * 2;
    const r = rng.range(0, size * 0.16);
    const rr = rng.range(size * 0.16, size * 0.34);
    const g = ctx.createRadialGradient(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 0, cx + Math.cos(a) * r, cy + Math.sin(a) * r, rr);
    g.addColorStop(0, css(color, 0.5));
    g.addColorStop(1, css(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
  }
  return canvas;
}

// ===== src/render/gl.js ==============================================
// The GPU finishing stage.
//
// Everything up to this point is painted by Canvas2D, which is a good
// draughtsman and a hopeless colourist: it can lay down a shape but it cannot
// ask a question about a pixel. This takes the finished frame and does the
// three things that need per-pixel work, all of which measured free on the
// GPU and were all impossible in JS at sixty frames a second:
//
//   relief      a normal recovered from the image itself, so surfaces catch
//               the light that is actually near them
//   palette     quantisation with an ordered dither, which is the 1999 look
//               the whole art direction is chasing
//   grade       the vignette and colour wash, moved off the CPU
//
// If anything here fails \u2014 no WebGL, a driver that will not compile, a
// context lost on a backgrounded phone \u2014 `ok` goes false and the renderer
// silently keeps using the Canvas2D path it already had. This stage is an
// improvement, never a requirement.

const VERT = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;

in vec2 v_uv;
out vec4 outColor;

uniform sampler2D u_frame;
uniform vec2 u_texel;       // 1/size, for sampling neighbours
uniform vec3 u_lights[12];  // xy = position in uv, z = radius in uv
uniform vec3 u_lightCol[12];
uniform int  u_lightCount;
uniform float u_relief;     // how much the recovered normal bends the light
uniform float u_levels;     // colour steps per channel
uniform float u_time;

float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

// A 4x4 Bayer matrix. Ordered dithering is what let a 256-colour palette
// look like more than 256 colours: instead of banding, neighbouring pixels
// alternate between the two nearest steps and the eye mixes them. Error
// diffusion would look cleaner and would also crawl horribly as the camera
// moves, because each pixel's error depends on its neighbours. A fixed
// threshold pattern is stable in screen space, which is why every sprite
// game of the era used one.
float bayer(vec2 p) {
  int x = int(mod(p.x, 4.0));
  int y = int(mod(p.y, 4.0));
  int i = y * 4 + x;
  float m[16] = float[16](
     0.0,  8.0,  2.0, 10.0,
    12.0,  4.0, 14.0,  6.0,
     3.0, 11.0,  1.0,  9.0,
    15.0,  7.0, 13.0,  5.0
  );
  return m[i] / 16.0 - 0.5;
}

void main() {
  vec3 base = texture(u_frame, v_uv).rgb;

  // Recover a surface normal from the picture's own shading. This is not a
  // real normal \u2014 nothing here knows the geometry \u2014 but the art is drawn with
  // a consistent light, so brightness gradients do follow form: the lit side
  // of an arm is brighter than its shadow side, a crack in the ground is
  // darker than the stone beside it. Sobel over luminance turns that into a
  // slope, and a slope is enough for light to catch on.
  float l  = luma(texture(u_frame, v_uv + vec2(-u_texel.x, 0.0)).rgb);
  float r  = luma(texture(u_frame, v_uv + vec2( u_texel.x, 0.0)).rgb);
  float d  = luma(texture(u_frame, v_uv + vec2(0.0, -u_texel.y)).rgb);
  float u  = luma(texture(u_frame, v_uv + vec2(0.0,  u_texel.y)).rgb);
  vec3 n = normalize(vec3((l - r) * u_relief, (d - u) * u_relief, 1.0));

  // Every light in range gets to rake across that slope.
  vec3 lit = vec3(0.0);
  for (int i = 0; i < 12; i++) {
    if (i >= u_lightCount) break;
    vec2 dv = u_lights[i].xy - v_uv;
    dv.y *= 0.62;                       // the world is squashed; so is falloff
    float dist = length(dv);
    float rad = u_lights[i].z;
    if (dist > rad) continue;
    float att = 1.0 - dist / rad;
    att *= att;
    vec3 ldir = normalize(vec3(dv, 0.55));
    float ndl = max(dot(n, ldir), 0.0);
    // A tight specular on top of the diffuse term. This is the highlight that
    // travels across armour as you walk past a fire.
    float spec = pow(ndl, 22.0) * 0.45;
    lit += u_lightCol[i] * (ndl * 0.5 + spec) * att;
  }

  // Restrained on purpose. Measuring the output showed a first version
  // tripling the lit area \u2014 the frame already carries a full Canvas2D
  // lightmap, and this pass is meant to add relief on top of it, not to
  // light the scene a second time.
  vec3 col = base * (1.0 + lit * 0.42);

  // Quantise, dithered. The threshold is offset per channel so the three do
  // not band on the same pixels, which is what turns dithering into visible
  // colour fringing.
  float steps = max(u_levels, 2.0);
  vec2 px = v_uv / u_texel;
  float dth = bayer(px) / steps;
  col += vec3(dth, dth * 0.92, dth * 1.08);
  col = floor(col * steps + 0.5) / steps;

  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

class GLStage {
  constructor(canvas) {
    this.ok = false;
    this.canvas = canvas;
    try {
      this.gl =
        canvas.getContext('webgl2', {
          alpha: false,
          antialias: false,
          depth: false,
          premultipliedAlpha: false,
          // Without this the drawing buffer's contents are undefined after
          // the browser composites, which makes the surface flicker or come
          // back empty on some drivers \u2014 and makes it impossible to screenshot.
          preserveDrawingBuffer: true,
        }) ||
        null;
      if (!this.gl) return;
      this._build();
      this.ok = true;
    } catch (e) {
      this.ok = false;
    }
    // A phone that backgrounds the tab can lose the context. Rather than
    // trying to rebuild mid-frame, drop back to Canvas2D and stay there.
    if (this.ok) {
      canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        this.ok = false;
      });
    }
  }

  _compile(type, src) {
    const gl = this.gl;
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh) || 'shader compile failed');
    }
    return sh;
  }

  _build() {
    const gl = this.gl;
    const prog = gl.createProgram();
    gl.attachShader(prog, this._compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, this._compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(prog) || 'link failed');
    }
    gl.useProgram(prog);
    this.prog = prog;

    // One oversized triangle covers the screen with no vertex waste and no
    // seam down the middle where two triangles would meet.
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    this.tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    // NEAREST everywhere: this is pixel art and the world buffer is already
    // the resolution we want to see.
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    // A canvas has its origin at the top left and GL has its at the bottom,
    // so without this the world arrives upside down.
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

    this.u = {
      frame: gl.getUniformLocation(prog, 'u_frame'),
      texel: gl.getUniformLocation(prog, 'u_texel'),
      lights: gl.getUniformLocation(prog, 'u_lights'),
      lightCol: gl.getUniformLocation(prog, 'u_lightCol'),
      lightCount: gl.getUniformLocation(prog, 'u_lightCount'),
      relief: gl.getUniformLocation(prog, 'u_relief'),
      levels: gl.getUniformLocation(prog, 'u_levels'),
      time: gl.getUniformLocation(prog, 'u_time'),
    };
    gl.uniform1i(this.u.frame, 0);
    this._lightBuf = new Float32Array(36);
    this._colBuf = new Float32Array(36);
  }

  /**
   * Draws the finished world buffer to the screen through the shader.
   * `lights` are already in world-buffer pixel space.
   */
  present(world, sw, sh, lights, opts = {}) {
    if (!this.ok) return false;
    const gl = this.gl;
    try {
      if (this.canvas.width !== sw || this.canvas.height !== sh) {
        this.canvas.width = sw;
        this.canvas.height = sh;
      }
      gl.viewport(0, 0, sw, sh);
      gl.useProgram(this.prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, world);

      gl.uniform2f(this.u.texel, 1 / world.width, 1 / world.height);
      const n = Math.min(lights.length, 12);
      for (let i = 0; i < n; i++) {
        const L = lights[i];
        this._lightBuf[i * 3] = L.x / world.width;
        this._lightBuf[i * 3 + 1] = 1 - L.y / world.height; // gl is y-up
        this._lightBuf[i * 3 + 2] = L.r / world.width;
        this._colBuf[i * 3] = L.color[0] / 255;
        this._colBuf[i * 3 + 1] = L.color[1] / 255;
        this._colBuf[i * 3 + 2] = L.color[2] / 255;
      }
      gl.uniform3fv(this.u.lights, this._lightBuf);
      gl.uniform3fv(this.u.lightCol, this._colBuf);
      gl.uniform1i(this.u.lightCount, n);
      gl.uniform1f(this.u.relief, opts.relief ?? 2.2);
      gl.uniform1f(this.u.levels, opts.levels ?? 22);
      gl.uniform1f(this.u.time, opts.time ?? 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      // Self-check, once. This stage could not be verified visually where it
      // was written \u2014 a headless browser does not composite a WebGL canvas
      // into its screenshots, so the picture looked black while readPixels
      // showed a correct frame. Rather than trust that, the first frame is
      // read back on the real device: if the shader produced nothing while
      // the source clearly had content, the stage retires itself and the
      // Canvas2D path takes over. A wrong guess here costs a black screen,
      // and that is not a thing to leave to optimism.
      if (!this._checked) {
        this._checked = true;
        const px = new Uint8Array(4);
        let bright = 0;
        for (const [fx, fy] of [[0.5, 0.5], [0.3, 0.6], [0.7, 0.4]]) {
          gl.readPixels((sw * fx) | 0, (sh * fy) | 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
          bright = Math.max(bright, px[0] + px[1] + px[2]);
        }
        if (bright < 6) {
          this.ok = false;
          return false;
        }
      }
      return true;
    } catch (e) {
      this.ok = false;
      return false;
    }
  }
}

// ===== src/render/renderer.js ========================================
// The renderer. A 2.5D painter's-algorithm pipeline built on Canvas2D:
//
//   1. ground      chunked, composited from relief-lit tileable materials
//   2. decals      blood, scorch, footprints (multiply)
//   3. shadows     soft contact ellipses
//   4. sprites     y-sorted props, actors, loot, effects
//   5. lightmap    ambient + every torch/spell, multiplied over the scene,
//                  then re-added at low alpha for warm overbright
//   6. bloom       emissive-only buffer, blurred by successive downsampling
//   7. atmosphere  drifting fog sheets, weather, vignette, grade, grain
//
// Everything scales with `renderScale`, which drops automatically if the
// device can't hold the frame budget.







// A true 2:1 dimetric squash \u2014 one step down in y for every two across, the
// same projection Diablo II's tiles were built on. The old 0.62 was a
// compromise that read as "camera slightly tilted from overhead"; 0.5 is the
// angle the eye recognises as isometric.
const ISO_Y = 0.5;

// The world is drawn into a buffer about this wide and then blown up with
// nearest-neighbour sampling, so the picture lands on chunky, stable pixels
// instead of a smooth gradient soup. Diablo II ran at 640x480; this is the
// same idea sized for a widescreen phone.
// 720 was too coarse once the figures had armour worth looking at: a knight
// stood about forty-five pixels tall, which is fewer than the plates he is
// wearing. This keeps a visible pixel grid \u2014 the grid is the point \u2014 while
// giving a character enough pixels to be a body rather than a suggestion.
const WORLD_PIXEL_WIDTH = 1200;

const CHUNK = 384; // world units per terrain chunk
const CHUNK_CACHE = 28;

class Renderer {
  constructor(canvas) {
    // Two surfaces. `screen` is the real canvas at device resolution and is
    // where the HUD draws; `world` is the small buffer everything in the game
    // world is painted into, then upscaled onto the screen with smoothing off.
    this.canvas = canvas;
    this.screen = canvas;
    this.screenCtx = ctxOf(canvas, false);

    // The GPU finishing stage needs a surface of its own \u2014 a canvas can hold
    // a 2D context or a WebGL one, never both \u2014 so it gets a sibling behind
    // this one, and #game keeps the HUD and the input handling. If the stage
    // fails to start, nothing below ever asks for it again.
    // ?nogl on the URL forces the Canvas2D path, so the two can be compared
    // on a real device without a rebuild.
    const noGL = typeof window !== 'undefined' && /[?&]nogl\b/.test(window.location.search);
    // The GL surface is never added to the page. An earlier version put it
    // behind #game as a sibling and the world came out black on real
    // hardware even though the framebuffer read back correct \u2014 the browser
    // was not compositing the WebGL canvas into the page. Keeping it purely
    // in memory and blitting the result onto the same 2D canvas the HUD uses
    // sidesteps that entirely: nothing has to be composited but #game, and
    // drawing a WebGL canvas into a 2D context is well defined.
    this.glCanvas = noGL ? null : makeCanvas(1, 1);
    this.gl = this.glCanvas ? new GLStage(this.glCanvas) : null;
    if (this.gl && !this.gl.ok) this.glCanvas = null;
    this.world = makeCanvas(1, 1);
    this.ctx = ctxOf(this.world, false);
    this.sw = 1;
    this.sh = 1;

    this.cam = { x: 0, y: 0, zoom: 1, shakeX: 0, shakeY: 0 };
    this.shake = 0;
    this.shakeDecay = 6;

    this.renderScale = 1;
    this.targetScale = 1;
    this.quality = 2; // 0 lean, 1 normal, 2 everything
    this.w = 1;
    this.h = 1;
    this.cssW = 1;
    this.cssH = 1;
    this.dpr = 1;

    this.lightCanvas = makeCanvas(1, 1);
    this.lightCtx = ctxOf(this.lightCanvas, false);
    this.emisCanvas = makeCanvas(1, 1);
    this.emisCtx = ctxOf(this.emisCanvas);
    this.blurA = makeCanvas(1, 1);
    this.blurACtx = ctxOf(this.blurA);
    this.blurB = makeCanvas(1, 1);
    this.blurBCtx = ctxOf(this.blurB);

    this.lightSprite = bakeLightSprite(256, 1);
    this.lightSpriteHard = bakeLightSprite(256, 0.2);
    this.shadowSprite = bakeShadowSprite(128);
    this.grain = bakeGrain(128);
    this.caustics = bakeCaustics(256);
    this.fogSheets = [bakeFogSheet(256, 1), bakeFogSheet(256, 7)];
    this.tintCache = new Map();

    this.chunks = new Map();
    this.chunkOrder = [];
    this.scratch = makeCanvas(CHUNK, CHUNK);
    this.scratchCtx = ctxOf(this.scratch);

    this.lights = [];
    this.queue = [];
    this.decals = [];
    this.time = 0;
    this.ambience = AMBIENCE.forest;
    this.terrain = null;
    this.frameMs = 16;

    this.resize();
  }

  // -- setup ---------------------------------------------------------------

  setAmbience(name) {
    this.ambience = AMBIENCE[name] || AMBIENCE.forest;
  }

  /**
   * terrain = { base, layers: [{mat, scale, threshold, softness}], wet }
   * Chunks are rebuilt when this changes.
   */
  setTerrain(terrain) {
    this.terrain = terrain;
    this.chunks.clear();
    this.chunkOrder.length = 0;
  }

  resize() {
    const cssW = window.innerWidth;
    const cssH = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cssW = cssW;
    this.cssH = cssH;
    this.dpr = dpr;

    // The screen surface stays sharp \u2014 the HUD is drawn on it directly.
    const sw = Math.max(320, Math.round(cssW * dpr));
    const sh = Math.max(200, Math.round(cssH * dpr));
    if (sw !== this.sw || sh !== this.sh) {
      this.sw = sw;
      this.sh = sh;
      this.screen.width = sw;
      this.screen.height = sh;
      this.screen.style.width = cssW + 'px';
      this.screen.style.height = cssH + 'px';
      this.screenCtx.imageSmoothingEnabled = false;
    }

    // The world buffer is sized so one of its pixels is a whole number of
    // screen pixels wherever that is possible \u2014 a fractional ratio is what
    // makes upscaled pixel art shimmer as the camera moves.
    const want = WORLD_PIXEL_WIDTH * this.renderScale;
    const step = Math.max(1, Math.round(sw / want));
    this.worldPixel = step;
    const w = Math.max(320, Math.round(sw / step));
    const h = Math.max(200, Math.round(sh / step));
    if (w === this.w && h === this.h) return;
    this.w = w;
    this.h = h;
    this.world.width = w;
    this.world.height = h;
    this.ctx.imageSmoothingQuality = 'low';

    const lw = Math.max(2, Math.round(w * 0.5));
    const lh = Math.max(2, Math.round(h * 0.5));
    this.lightCanvas.width = lw;
    this.lightCanvas.height = lh;
    this.emisCanvas.width = lw;
    this.emisCanvas.height = lh;
    this.blurA.width = Math.max(2, Math.round(w * 0.16));
    this.blurA.height = Math.max(2, Math.round(h * 0.16));
    this.blurB.width = this.blurA.width;
    this.blurB.height = this.blurA.height;
  }

  /**
   * Keeps the frame budget by giving up, in order: the wide bloom halo, the
   * film grain, the second fog sheet, the wet sheen, and finally resolution.
   * A phone that can afford all of it gets all of it.
   */
  adaptQuality(dt) {
    const ms = dt * 1000;
    this.frameMs = lerp(this.frameMs, ms, 0.05);
    this.qualityTimer = (this.qualityTimer || 0) + dt;
    if (this.qualityTimer < 0.5) return;
    this.qualityTimer = 0;

    // Give up a little sharpness before giving up the atmosphere, then the
    // atmosphere before dropping to a genuinely low resolution.
    if (this.frameMs > 30) {
      if (this.targetScale > 0.8) this.targetScale = clamp(this.targetScale - 0.08, 0.8, 1);
      else if (this.quality > 0) this.quality--;
      else this.targetScale = clamp(this.targetScale - 0.08, 0.5, 1);
    } else if (this.frameMs < 15) {
      if (this.targetScale < 0.8) this.targetScale = clamp(this.targetScale + 0.05, 0.5, 1);
      else if (this.quality < 2) this.quality++;
      else this.targetScale = clamp(this.targetScale + 0.05, 0.5, 1);
    }
    if (Math.abs(this.targetScale - this.renderScale) > 0.04) {
      this.renderScale = this.targetScale;
      this.w = this.h = 0;
      this.resize();
    }
  }

  // -- camera --------------------------------------------------------------

  get viewW() {
    return this.w / (this.cam.zoom * this.pxScale);
  }
  get viewH() {
    return this.h / (this.cam.zoom * this.pxScale);
  }

  /** World \u2192 screen (in backing-store pixels). */
  sx(wx) {
    return (wx - this.cam.x + this.cam.shakeX) * this.cam.zoom * this.pxScale + this.w * 0.5;
  }
  sy(wy, z = 0) {
    return (
      (wy - this.cam.y + this.cam.shakeY) * ISO_Y * this.cam.zoom * this.pxScale -
      z * this.cam.zoom * this.pxScale +
      this.h * 0.5
    );
  }
  /** World units \u2192 world-buffer pixels. */
  get pxScale() {
    return this.dpr / (this.worldPixel || 1);
  }

  /** Screen (CSS px) \u2192 world. */
  toWorld(cssX, cssY) {
    const px = cssX * this.pxScale;
    const py = cssY * this.pxScale;
    return {
      x: (px - this.w * 0.5) / (this.cam.zoom * this.pxScale) + this.cam.x,
      y: (py - this.h * 0.5) / (ISO_Y * this.cam.zoom * this.pxScale) + this.cam.y,
    };
  }

  addShake(amount) {
    this.shake = Math.min(this.shake + amount, 34);
  }

  updateCamera(tx, ty, dt) {
    this.cam.x = damp(this.cam.x, tx, 7, dt);
    this.cam.y = damp(this.cam.y, ty, 7, dt);
    this.shake = Math.max(0, this.shake - this.shakeDecay * this.shake * dt - 2 * dt);
    const s = this.shake;
    if (s > 0.01) {
      this.cam.shakeX = (Math.random() - 0.5) * s;
      this.cam.shakeY = (Math.random() - 0.5) * s * 0.7;
    } else {
      this.cam.shakeX = this.cam.shakeY = 0;
    }
  }

  // -- terrain -------------------------------------------------------------

  chunkKey(cx, cy) {
    return cx + ',' + cy;
  }

  getChunk(cx, cy) {
    const key = this.chunkKey(cx, cy);
    let c = this.chunks.get(key);
    if (c) return c;
    c = this.buildChunk(cx, cy);
    this.chunks.set(key, c);
    this.chunkOrder.push(key);
    while (this.chunkOrder.length > CHUNK_CACHE) {
      const old = this.chunkOrder.shift();
      this.chunks.delete(old);
    }
    return c;
  }

  buildChunk(cx, cy) {
    const t = this.terrain;
    const canvas = makeCanvas(CHUNK, CHUNK);
    const ctx = ctxOf(canvas, false);
    const ox = cx * CHUNK;
    const oy = cy * CHUNK;
    const rng = new RNG(`chunk:${cx}:${cy}:${t ? t.base : 'x'}`);

    // Base coat \u2014 the pattern is offset so neighbouring chunks line up.
    const baseMat = getMaterial(t ? t.base : 'moss', 256);
    ctx.save();
    const p = ctx.createPattern(baseMat, 'repeat');
    ctx.fillStyle = p;
    ctx.translate(-(((ox % 256) + 256) % 256), -(((oy % 256) + 256) % 256));
    ctx.fillRect(0, 0, CHUNK + 256, CHUNK + 256);
    ctx.restore();

    // Splat layers.
    if (t && t.layers) {
      for (const layer of t.layers) {
        this.splatLayer(ctx, layer, ox, oy);
      }
    }

    // Large-scale value variation: soft dark pools and lit rises.
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const step = 48;
    for (let y = 0; y < CHUNK; y += step) {
      for (let x = 0; x < CHUNK; x += step) {
        const n = warpFbm((ox + x) * 0.0014, (oy + y) * 0.0014, 1.6, 4);
        const v = clamp01(0.5 + n * 0.9);
        const a = (1 - v) * 0.42;
        if (a < 0.02) continue;
        const g = ctx.createRadialGradient(x + step / 2, y + step / 2, 0, x + step / 2, y + step / 2, step * 1.4);
        g.addColorStop(0, `rgba(24,26,32,${a.toFixed(3)})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - step, y - step, step * 3, step * 3);
      }
    }
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let y = 0; y < CHUNK; y += step) {
      for (let x = 0; x < CHUNK; x += step) {
        const n = fbm((ox + x) * 0.0022 + 40, (oy + y) * 0.0022, 3);
        const a = clamp01(n) * 0.13;
        if (a < 0.02) continue;
        const g = ctx.createRadialGradient(x + step / 2, y + step / 2, 0, x + step / 2, y + step / 2, step * 1.3);
        g.addColorStop(0, `rgba(150,160,175,${a.toFixed(3)})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - step, y - step, step * 3, step * 3);
      }
    }
    ctx.restore();

    // Scattered ground litter baked straight in \u2014 cheap density, no draw cost.
    // Diablo II's floors were never smooth: every tile carried pebbles, grit
    // and hairline cracks, and that high-frequency mess is most of why the
    // ground read as ground rather than as a painted backdrop. Each stone is
    // drawn as a lit pair \u2014 a dark base with a paler cap offset towards the
    // key light \u2014 so even a three-pixel pebble has a top and a side.
    ctx.save();
    for (let i = 0; i < 420; i++) {
      const x = rng.float() * CHUNK;
      const y = rng.float() * CHUNK;
      const r = rng.range(0.8, 3.4);
      const rot = rng.float() * TAU;
      const squash = rng.range(0.45, 0.9);
      ctx.globalAlpha = rng.range(0.2, 0.55);
      ctx.fillStyle = 'rgba(16,14,12,1)';
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * squash, rot, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = rng.range(0.18, 0.5);
      ctx.fillStyle = 'rgba(178,172,156,1)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.3, y - r * 0.42, r * 0.66, r * squash * 0.6, rot, 0, TAU);
      ctx.fill();
    }

    // Hairline cracks and dead stalks.
    ctx.globalAlpha = 1;
    ctx.lineCap = 'round';
    for (let i = 0; i < 46; i++) {
      let x = rng.float() * CHUNK;
      let y = rng.float() * CHUNK;
      let a = rng.float() * TAU;
      ctx.strokeStyle = `rgba(14,12,11,${rng.range(0.18, 0.44).toFixed(3)})`;
      ctx.lineWidth = rng.range(0.6, 1.5);
      ctx.beginPath();
      ctx.moveTo(x, y);
      const segs = rng.int(2, 6);
      for (let k = 0; k < segs; k++) {
        a += rng.range(-0.7, 0.7);
        x += Math.cos(a) * rng.range(3, 11);
        y += Math.sin(a) * rng.range(3, 11) * 0.6;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();

    // A fixed grain baked into the chunk rather than laid over the screen.
    // Baking it means the speckle belongs to the ground and stays put as the
    // camera moves; a screen-space grain slides across the world and reads as
    // dirt on the lens instead of texture underfoot.
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.34;
    const gp = ctx.createPattern(this.grain, 'repeat');
    ctx.translate(-(((ox % 128) + 128) % 128), -(((oy % 128) + 128) % 128));
    ctx.fillStyle = gp;
    ctx.fillRect(0, 0, CHUNK + 128, CHUNK + 128);
    ctx.restore();

    return canvas;
  }

  splatLayer(ctx, layer, ox, oy) {
    const s = this.scratchCtx;
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.clearRect(0, 0, CHUNK, CHUNK);

    const step = 14;
    const scale = layer.scale || 0.0022;
    const thr = layer.threshold ?? 0.05;
    const soft = layer.softness ?? 0.35;
    let any = false;
    for (let y = -step; y < CHUNK + step; y += step) {
      for (let x = -step; x < CHUNK + step; x += step) {
        const n = warpFbm((ox + x) * scale + (layer.offset || 0), (oy + y) * scale, 1.5, 4);
        // A steep curve on the mask. Diablo II's terrain transitions were
        // tile edges, not airbrushed fades \u2014 where sand meets rock there is a
        // line. Squaring the coverage keeps a broad solid interior and pulls
        // the falloff into a narrow band at the rim.
        const cov = clamp01((n - thr) / soft);
        const a = cov * cov * (3 - 2 * cov);
        if (a <= 0.02) continue;
        any = true;
        const r = step * 1.7;
        const g = s.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(255,255,255,${(a * 0.98).toFixed(3)})`);
        g.addColorStop(0.55, `rgba(255,255,255,${(a * 0.8).toFixed(3)})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        s.fillStyle = g;
        s.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }
    if (!any) return;

    s.globalCompositeOperation = 'source-in';
    const mat = getMaterial(layer.mat, 256);
    s.save();
    s.fillStyle = s.createPattern(mat, 'repeat');
    s.translate(-(((ox % 256) + 256) % 256), -(((oy % 256) + 256) % 256));
    s.fillRect(0, 0, CHUNK + 256, CHUNK + 256);
    s.restore();
    s.globalCompositeOperation = 'source-over';

    ctx.drawImage(this.scratch, 0, 0);
  }

  drawGround() {
    const ctx = this.ctx;
    const zoom = this.cam.zoom * this.pxScale;
    const halfW = this.w * 0.5;
    const halfH = this.h * 0.5;
    const viewHalfW = halfW / zoom;
    const viewHalfH = halfH / (zoom * ISO_Y);
    const cx0 = Math.floor((this.cam.x - viewHalfW) / CHUNK);
    const cx1 = Math.floor((this.cam.x + viewHalfW) / CHUNK);
    const cy0 = Math.floor((this.cam.y - viewHalfH) / CHUNK);
    const cy1 = Math.floor((this.cam.y + viewHalfH) / CHUNK);

    ctx.save();
    // No resampling on the ground: a smoothed chunk turns the grit back into
    // the mud it was baked to replace.
    ctx.imageSmoothingEnabled = false;
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const c = this.getChunk(cx, cy);
        const x = this.sx(cx * CHUNK);
        const y = this.sy(cy * CHUNK);
        const w = CHUNK * zoom + 1;
        const h = CHUNK * ISO_Y * zoom + 1;
        ctx.drawImage(c, x, y, w, h);
      }
    }
    ctx.restore();
  }

  /** Slow-drifting caustic sheen \u2014 reads as damp, glistening ground. */
  drawWetSheen() {
    if (!this.terrain || !this.terrain.wet || this.quality < 2) return;
    const ctx = this.ctx;
    const zoom = this.cam.zoom * this.pxScale;
    if (!this._causticPattern) this._causticPattern = ctx.createPattern(this.caustics, 'repeat');
    const t = this.time;
    const sc = 1.6 * zoom;
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = this.terrain.wet;
    ctx.translate(this.sx(t * 7) % (256 * sc), this.sy(-t * 5) % (256 * sc));
    ctx.scale(sc, sc * ISO_Y);
    ctx.fillStyle = this._causticPattern;
    const ww = (this.w * 2) / sc;
    const hh = (this.h * 2) / (sc * ISO_Y);
    ctx.fillRect(-ww, -hh, ww * 2, hh * 2);
    ctx.restore();
  }

  // -- decals --------------------------------------------------------------

  addDecal(canvas, x, y, scale, alpha, rot = 0, life = Infinity) {
    this.decals.push({ canvas, x, y, scale, alpha, rot, life, age: 0 });
    if (this.decals.length > 220) this.decals.shift();
  }

  drawDecals(dt) {
    const ctx = this.ctx;
    const zoom = this.cam.zoom * this.pxScale;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    for (let i = this.decals.length - 1; i >= 0; i--) {
      const d = this.decals[i];
      d.age += dt;
      if (d.age > d.life) {
        this.decals.splice(i, 1);
        continue;
      }
      const fade = d.life === Infinity ? 1 : clamp01(1 - d.age / d.life);
      const sx = this.sx(d.x);
      const sy = this.sy(d.y);
      if (sx < -200 || sy < -200 || sx > this.w + 200 || sy > this.h + 200) continue;
      ctx.globalAlpha = d.alpha * fade;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(d.rot);
      ctx.scale(zoom * d.scale, zoom * d.scale * ISO_Y);
      ctx.drawImage(d.canvas, -d.canvas.width / 2, -d.canvas.height / 2);
      ctx.restore();
    }
    ctx.restore();
  }

  clearDecals() {
    this.decals.length = 0;
  }

  // -- lights --------------------------------------------------------------

  addLight(x, y, r, color, intensity = 1, hard = false) {
    this.lights.push({ x, y, r, color, i: intensity, hard });
  }

  tintedLight(color, hard) {
    const key = (hard ? 'h' : 's') + color[0] + ',' + color[1] + ',' + color[2];
    let c = this.tintCache.get(key);
    if (!c) {
      const src = hard ? this.lightSpriteHard : this.lightSprite;
      c = makeCanvas(src.width, src.height);
      const cc = ctxOf(c);
      cc.drawImage(src, 0, 0);
      cc.globalCompositeOperation = 'source-in';
      cc.fillStyle = css(color);
      cc.fillRect(0, 0, c.width, c.height);
      this.tintCache.set(key, c);
    }
    return c;
  }

  renderLightmap() {
    const lc = this.lightCtx;
    const lw = this.lightCanvas.width;
    const lh = this.lightCanvas.height;
    const amb = this.ambience;
    lc.setTransform(1, 0, 0, 1, 0, 0);
    lc.globalCompositeOperation = 'source-over';
    lc.globalAlpha = 1;

    // Ambient sky light, slightly graded top-to-bottom.
    const g = lc.createLinearGradient(0, 0, 0, lh);
    const a0 = amb.ambient.map((v) => v * amb.ambientStrength * 1.35);
    const a1 = amb.ambient.map((v) => v * amb.ambientStrength * 0.78);
    g.addColorStop(0, css(a0));
    g.addColorStop(1, css(a1));
    lc.fillStyle = g;
    lc.fillRect(0, 0, lw, lh);

    lc.globalCompositeOperation = 'lighter';
    const k = 0.5; // lightmap is half-resolution
    for (const L of this.lights) {
      const sx = this.sx(L.x) * k;
      const sy = this.sy(L.y) * k;
      const r = L.r * this.cam.zoom * this.pxScale * k;
      if (sx + r < 0 || sy + r < 0 || sx - r > lw || sy - r > lh) continue;
      lc.globalAlpha = clamp01(L.i);
      const spr = this.tintedLight(L.color, L.hard);
      lc.drawImage(spr, sx - r, sy - r * 0.86, r * 2, r * 1.72);
    }
    lc.globalAlpha = 1;
    lc.globalCompositeOperation = 'source-over';
  }

  compositeLight() {
    const ctx = this.ctx;
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(this.lightCanvas, 0, 0, this.w, this.h);
    if (this.quality >= 1) {
      // A little overbright so a torch feels hot rather than merely revealing.
      // Kept low: pushed further it blows the character out to a white blob,
      // and losing the armour's shading is a bad trade for a warmer glow.
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.07;
      ctx.drawImage(this.lightCanvas, 0, 0, this.w, this.h);
    }
    ctx.restore();
  }

  // -- bloom ---------------------------------------------------------------

  renderBloom() {
    const a = this.blurACtx;
    const b = this.blurBCtx;
    const aw = this.blurA.width;
    const ah = this.blurA.height;
    a.setTransform(1, 0, 0, 1, 0, 0);
    a.clearRect(0, 0, aw, ah);
    a.imageSmoothingEnabled = true;
    a.drawImage(this.emisCanvas, 0, 0, aw, ah);

    // Two ping-pong blur passes via slight offsets \u2014 cheap, and it looks like
    // a real lens glow rather than a box blur.
    for (let pass = 0; pass < 2; pass++) {
      b.setTransform(1, 0, 0, 1, 0, 0);
      b.clearRect(0, 0, aw, ah);
      b.globalAlpha = 0.25;
      const o = 1 + pass * 1.6;
      b.drawImage(this.blurA, -o, 0, aw, ah);
      b.drawImage(this.blurA, o, 0, aw, ah);
      b.drawImage(this.blurA, 0, -o, aw, ah);
      b.drawImage(this.blurA, 0, o, aw, ah);
      a.clearRect(0, 0, aw, ah);
      a.globalAlpha = 1;
      a.drawImage(this.blurB, 0, 0);
    }

    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.6;
    ctx.drawImage(this.emisCanvas, 0, 0, this.w, this.h);
    ctx.globalAlpha = 0.72;
    ctx.drawImage(this.blurA, 0, 0, this.w, this.h);
    if (this.quality >= 2) {
      // Wide halo \u2014 the expensive one, first to go when frames get tight.
      ctx.globalAlpha = 0.42;
      ctx.drawImage(this.blurA, -this.w * 0.03, -this.h * 0.03, this.w * 1.06, this.h * 1.06);
    }
    ctx.restore();
  }

  // -- atmosphere ----------------------------------------------------------

  /** Pre-tinted copy of a white sheet, cached per colour. */
  tintedSheet(sheet, color, key) {
    const k = key + ':' + color.join(',');
    let c = this.tintCache.get(k);
    if (!c) {
      c = makeCanvas(sheet.width, sheet.height);
      const cc = ctxOf(c);
      cc.drawImage(sheet, 0, 0);
      cc.globalCompositeOperation = 'source-in';
      cc.fillStyle = css(color);
      cc.fillRect(0, 0, c.width, c.height);
      this.tintCache.set(k, c);
    }
    return c;
  }

  /** Parallax sheets of ground haze. Sells depth more than anything else. */
  drawFog() {
    const amb = this.ambience;
    if (amb.fogAmount <= 0) return;
    const ctx = this.ctx;
    const zoom = this.cam.zoom * this.pxScale;
    const sheets = this.quality >= 2 ? 2 : 1;
    for (let i = 0; i < sheets; i++) {
      const sheet = this.tintedSheet(this.fogSheets[i], amb.fog, 'fog' + i);
      const par = i ? 0.5 : 0.3;
      const sc = (i ? 2.6 : 4.2) * zoom;
      const px = -this.cam.x * par * zoom + this.time * (i ? 13 : 7);
      const py = -this.cam.y * par * zoom * ISO_Y + this.time * (i ? 5 : 2.5);
      ctx.save();
      ctx.globalAlpha = amb.fogAmount * (i ? 0.42 : 0.6);
      ctx.translate(px % (sheet.width * sc), py % (sheet.height * sc * 0.7));
      ctx.scale(sc, sc * 0.7);
      ctx.fillStyle = ctx.createPattern(sheet, 'repeat');
      const ww = (this.w * 2) / sc;
      const hh = (this.h * 2) / (sc * 0.7);
      ctx.fillRect(-ww, -hh, ww * 2, hh * 2);
      ctx.restore();
    }
  }

  /**
   * One baked sheet carrying the vignette, the lifted-black film curve and the
   * zone's colour grade. Rebuilt only when the viewport or the act changes,
   * so the finishing pass costs a single blit instead of four.
   */
  buildGradeSheet() {
    const amb = this.ambience;
    const key = `${this.w}x${this.h}:${amb.grade.join(',')}:${amb.sky.join(',')}`;
    if (this._gradeKey === key) return;
    this._gradeKey = key;
    const c = makeCanvas(this.w, this.h);
    const g = ctxOf(c);
    // Grade + lifted black, painted as one translucent wash.
    const lg = g.createLinearGradient(0, 0, 0, this.h);
    lg.addColorStop(0, css(mixc(amb.grade, amb.sky, 0.45), amb.gradeAmount * 0.85));
    lg.addColorStop(1, css(mixc(amb.sky, amb.grade, 0.3), amb.gradeAmount * 0.55));
    g.fillStyle = lg;
    g.fillRect(0, 0, this.w, this.h);
    // Vignette
    const rg = g.createRadialGradient(
      this.w * 0.5,
      this.h * 0.46,
      Math.min(this.w, this.h) * 0.26,
      this.w * 0.5,
      this.h * 0.5,
      Math.max(this.w, this.h) * 0.76
    );
    rg.addColorStop(0, 'rgba(0,0,0,0)');
    rg.addColorStop(0.62, 'rgba(6,4,3,0.16)');
    rg.addColorStop(1, 'rgba(4,3,2,0.52)');
    g.fillStyle = rg;
    g.fillRect(0, 0, this.w, this.h);
    this.gradeSheet = c;
  }

  drawVignetteAndGrade() {
    const ctx = this.ctx;

    // Contrast, by compositing the frame over itself in overlay. Blending a
    // picture with itself this way pushes everything below mid-grey darker
    // and everything above it lighter \u2014 an S-curve for the cost of one blit.
    //
    // This is what the picture was missing against Diablo II. Every value in
    // the frame sat in the middle: no true black in the corners away from the
    // light, no hot highlight on the metal near it. D2's frames used the
    // whole range, and the range is what makes a torch feel like the only
    // thing holding the dark off.
    if (this.quality >= 1) {
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.42;
      ctx.drawImage(this.world, 0, 0);
      ctx.restore();
    }

    this.buildGradeSheet();
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(this.gradeSheet, 0, 0);
    ctx.restore();

    if (this.quality >= 2) {
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.05;
      if (!this._grainPattern) this._grainPattern = ctx.createPattern(this.grain, 'repeat');
      ctx.translate((Math.random() * 128) | 0, (Math.random() * 128) | 0);
      ctx.fillStyle = this._grainPattern;
      ctx.fillRect(-128, -128, this.w + 256, this.h + 256);
      ctx.restore();
    }
  }

  // -- sprite queue --------------------------------------------------------

  /** Adds a draw callback sorted by world Y (painter's algorithm). */
  push(y, fn, bias = 0) {
    this.queue.push({ y: y + bias, fn });
  }

  flushQueue() {
    this.queue.sort((a, b) => a.y - b.y);
    for (const item of this.queue) item.fn(this.ctx, this);
    this.queue.length = 0;
  }

  drawShadow(x, y, rx, alpha = 1) {
    const ctx = this.ctx;
    const zoom = this.cam.zoom * this.pxScale;
    const sx = this.sx(x);
    const sy = this.sy(y);
    const w = rx * 2 * zoom;
    const h = rx * 2 * zoom * 0.44;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(this.shadowSprite, sx - w / 2, sy - h / 2, w, h);
    ctx.restore();
  }

  /**
   * Blits a prop already scaled to the current zoom, 1:1, no resampling.
   * `swayPx` is an integer horizontal nudge \u2014 enough to read as wind without
   * forcing a filtered transform.
   */
  drawScaled(spr, x, y, swayPx = 0, alpha = 1) {
    const ctx = this.ctx;
    const dx = Math.round(this.sx(x) - spr.ox + swayPx);
    const dy = Math.round(this.sy(y) - spr.oy);
    if (dx > this.w || dy > this.h || dx + spr.w < 0 || dy + spr.h < 0) return false;
    if (alpha >= 0.999) {
      ctx.drawImage(spr.canvas, dx, dy);
    } else {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.drawImage(spr.canvas, dx, dy);
      ctx.restore();
    }
    return true;
  }

  /**
   * The black silhouette of a sprite, baked once and kept.
   *
   * Every prop in the world was standing on nothing: a pine, a boulder and a
   * slab of ice all met the ground with no shadow at all, which is what made
   * them read as stickers on the mud rather than objects resting in it. The
   * figures got their shadows last pass; this is the same idea for everything
   * that does not move, and because props never change it is one bake per
   * sprite for the whole session.
   */
  shadowOf(spr) {
    if (spr.__shadow !== undefined) return spr.__shadow;
    const src = spr.canvas;
    if (!src || !src.width || !src.height) {
      spr.__shadow = null;
      return null;
    }
    const c = makeCanvas(src.width, src.height);
    const cc = ctxOf(c);
    cc.drawImage(src, 0, 0);
    // Keep the alpha, throw away the colour.
    cc.globalCompositeOperation = 'source-in';
    cc.fillStyle = '#000';
    cc.fillRect(0, 0, c.width, c.height);
    spr.__shadow = c;
    return c;
  }

  /**
   * Lays a prop's silhouette on the ground, sheared away from the key light
   * and squashed onto the floor plane \u2014 the same transform the actors use, so
   * a tree and a knight agree about where the sun is.
   */
  drawSpriteShadow(spr, x, y, alpha = 0.34) {
    const sh = this.shadowOf(spr);
    if (!sh) return;
    const sun = this.ambience.sunDir || [-0.5, -0.75];
    const len = Math.hypot(sun[0], sun[1]) || 1;
    const shear = (-sun[0] / len) * 0.8;
    const ctx = this.ctx;
    const bx = this.sx(x);
    const by = this.sy(y);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(bx, by);
    // Shear turns height into ground distance; the squash flattens it.
    ctx.transform(1, 0, shear, 0.42, 0, 0);
    ctx.drawImage(sh, -spr.ox, -spr.oy);
    ctx.restore();
  }

  /**
   * Screen-space direction from a world point towards the brightest light
   * near it, blended with the zone's own sun so a figure standing in the
   * open is still lit from somewhere. This is what a per-actor highlight
   * follows.
   */
  keyLightDir(wx, wy) {
    const sun = this.ambience.sunDir || [-0.5, -0.75];
    let bx = sun[0] * 0.55;
    let by = sun[1] * 0.55;
    const ox = this.sx(wx);
    const oy = this.sy(wy);
    for (const L of this.lights) {
      const dx = this.sx(L.x) - ox;
      const dy = this.sy(L.y) - oy;
      const d = Math.hypot(dx, dy);
      if (d < 1) continue;
      const r = L.r * this.cam.zoom * this.pxScale;
      if (d > r) continue;
      // Nearer and stronger lights win, and the falloff matches the lightmap.
      const w = L.i * (1 - d / r) * (1 - d / r);
      bx += (dx / d) * w;
      by += (dy / d) * w;
    }
    return [bx, by];
  }

  /** Screen-space bounds of a pre-scaled sprite placed at a world point. */
  spriteBounds(spr, x, y) {
    const dx = this.sx(x) - spr.ox;
    const dy = this.sy(y) - spr.oy;
    return { x: dx, y: dy, w: spr.w, h: spr.h };
  }

  drawScaledEmissive(spr, x, y, swayPx = 0) {
    if (!spr.emissive) return;
    const ctx = this.emisCtx;
    const k = 0.5;
    ctx.drawImage(
      spr.emissive,
      (this.sx(x) - spr.ox + swayPx) * k,
      (this.sy(y) - spr.oy) * k,
      spr.w * k,
      spr.h * k
    );
  }

  /** Draws a baked prop sprite anchored at its base. */
  drawSprite(spr, x, y, opts = {}) {
    const ctx = opts.ctx || this.ctx;
    const zoom = this.cam.zoom * this.pxScale * (opts.scale || 1);
    const sx = this.sx(x);
    const sy = this.sy(y, opts.z || 0);
    const w = spr.w * zoom;
    const h = spr.h * zoom;
    const dx = sx - spr.ox * zoom;
    const dy = sy - spr.oy * zoom;
    if (dx > this.w + 80 || dy > this.h + 80 || dx + w < -80 || dy + h < -80) return false;
    ctx.save();
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
    if (opts.sway) {
      ctx.translate(sx, sy);
      ctx.transform(1, 0, opts.sway, 1, 0, 0);
      ctx.translate(-sx, -sy);
    }
    ctx.drawImage(spr.canvas, dx, dy, w, h);
    ctx.restore();
    return true;
  }

  drawSpriteEmissive(spr, x, y, opts = {}) {
    if (!spr.emissive) return;
    const ctx = this.emisCtx;
    const k = 0.5;
    const zoom = this.cam.zoom * this.pxScale * (opts.scale || 1);
    const sx = this.sx(x) * k;
    const sy = this.sy(y, opts.z || 0) * k;
    const w = spr.w * zoom * k;
    const h = spr.h * zoom * k;
    ctx.save();
    ctx.globalAlpha = opts.alpha ?? 1;
    ctx.drawImage(spr.emissive, sx - spr.ox * zoom * k, sy - spr.oy * zoom * k, w, h);
    ctx.restore();
  }

  /**
   * A soft radial dot, baked once per colour. Building a gradient per particle
   * per frame was, measurably, one of the most expensive things in the engine.
   */
  softDot(color) {
    const key = 'dot' + color[0] + ',' + color[1] + ',' + color[2];
    let c = this.tintCache.get(key);
    if (!c) {
      c = makeCanvas(64, 64);
      const cc = ctxOf(c);
      const g = cc.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, css(color, 1));
      g.addColorStop(0.45, css(color, 0.55));
      g.addColorStop(1, css(color, 0));
      cc.fillStyle = g;
      cc.fillRect(0, 0, 64, 64);
      this.tintCache.set(key, c);
    }
    return c;
  }

  /** Emissive-buffer helpers used by spell FX. */
  emisCircle(x, y, r, color, alpha, z = 0) {
    if (alpha <= 0.01) return;
    const ctx = this.emisCtx;
    const k = 0.5;
    const sx = this.sx(x) * k;
    const sy = this.sy(y, z) * k;
    const rr = r * this.cam.zoom * this.pxScale * k;
    if (rr < 0.6) return;
    if (sx + rr < 0 || sy + rr < 0 || sx - rr > this.emisCanvas.width || sy - rr > this.emisCanvas.height) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.drawImage(this.softDot(color), sx - rr, sy - rr, rr * 2, rr * 2);
    ctx.restore();
  }

  // -- frame ---------------------------------------------------------------

  /**
   * Blows the world buffer up onto the screen with sampling switched off, so
   * every world pixel lands as a hard little square. Called once the world is
   * finished and before the HUD, which draws straight onto the screen.
   */
  presentWorld() {
    const ctx = this.screenCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    if (this.gl && this.gl.ok) {
      // Hand the frame to the GPU, and leave this surface clear so the HUD
      // draws over it. The light list is converted to world-buffer pixels
      // here because that is the space the shader samples in.
      const ls = [];
      for (const L of this.lights) {
        const r = L.r * this.cam.zoom * this.pxScale;
        const x = this.sx(L.x);
        const y = this.sy(L.y);
        if (x + r < 0 || y + r < 0 || x - r > this.w || y - r > this.h) continue;
        ls.push({ x, y, r, color: L.color, i: L.i });
      }
      // Brightest first, since the shader only takes a dozen.
      ls.sort((a, b) => b.i - a.i);
      const done = this.gl.present(this.world, this.sw, this.sh, ls, {
        relief: 1.8,
        levels: 26,
        time: this.time,
      });
      if (done) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(this.glCanvas, 0, 0, this.sw, this.sh);
        return;
      }
      // The stage gave up mid-frame; fall through to the Canvas2D path so
      // the picture never disappears.
    }

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.world, 0, 0, this.w, this.h, 0, 0, this.sw, this.sh);
  }

  beginFrame(dt) {
    this.time += dt;
    this.lights.length = 0;
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = css(this.ambience.sky);
    ctx.fillRect(0, 0, this.w, this.h);
    this.emisCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.emisCtx.globalCompositeOperation = 'source-over';
    this.emisCtx.globalAlpha = 1;
    this.emisCtx.clearRect(0, 0, this.emisCanvas.width, this.emisCanvas.height);
  }
}

// ===== src/render/fx.js ==============================================
// Particles, floating numbers and one-shot visual flourishes.
// Everything lives in world space and is drawn through the renderer's
// transform, so sparks land on the ground where they should.





const MAX_PARTICLES = 900;

class FX {
  constructor(renderer) {
    this.r = renderer;
    this.parts = [];
    this.texts = [];
    this.rings = [];
    this.slashes = [];
    this.beams = [];
    this.weather = [];
    this.weatherKind = null;
    this.weatherAmount = 0;
  }

  clear() {
    this.parts.length = 0;
    this.texts.length = 0;
    this.rings.length = 0;
    this.slashes.length = 0;
    this.beams.length = 0;
  }

  spawn(p) {
    if (this.parts.length >= MAX_PARTICLES) this.parts.shift();
    this.parts.push(p);
  }

  // -- emitters -------------------------------------------------------------

  blood(x, y, z, dirX, dirY, amount = 12, color = PAL.blood) {
    for (let i = 0; i < amount; i++) {
      const a = Math.atan2(dirY, dirX) + rnd(-0.9, 0.9);
      const sp = rnd(60, 320);
      this.spawn({
        kind: 'blood',
        x,
        y,
        z: z + rnd(-6, 10),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.6,
        vz: rnd(40, 210),
        life: rnd(0.4, 0.95),
        maxLife: 1,
        size: rnd(1.6, 4.4),
        color,
        grav: 620,
        drag: 1.6,
      });
    }
  }

  sparks(x, y, z, dirX, dirY, amount = 10, color = PAL.torchCore, speed = 300) {
    for (let i = 0; i < amount; i++) {
      const a = Math.atan2(dirY, dirX) + rnd(-1.1, 1.1);
      const sp = rnd(speed * 0.3, speed);
      this.spawn({
        kind: 'spark',
        x,
        y,
        z,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.6,
        vz: rnd(30, 190),
        life: rnd(0.18, 0.5),
        maxLife: 0.5,
        size: rnd(1.2, 2.8),
        color,
        grav: 420,
        drag: 2.4,
        glow: true,
      });
    }
  }

  embers(x, y, z, amount, color = PAL.torch, spread = 20) {
    for (let i = 0; i < amount; i++) {
      this.spawn({
        kind: 'ember',
        x: x + rnd(-spread, spread),
        y: y + rnd(-spread * 0.5, spread * 0.5),
        z: z + rnd(0, 10),
        vx: rnd(-14, 14),
        vy: rnd(-8, 8),
        vz: rnd(28, 74),
        life: rnd(0.7, 1.9),
        maxLife: 1.9,
        size: rnd(1.1, 2.6),
        color,
        grav: -12,
        drag: 0.7,
        glow: true,
        flick: true,
      });
    }
  }

  smoke(x, y, z, amount = 6, color = [70, 70, 78], spread = 12) {
    for (let i = 0; i < amount; i++) {
      this.spawn({
        kind: 'smoke',
        x: x + rnd(-spread, spread),
        y: y + rnd(-spread * 0.6, spread * 0.6),
        z: z + rnd(0, 8),
        vx: rnd(-16, 16),
        vy: rnd(-10, 10),
        vz: rnd(18, 46),
        life: rnd(0.8, 1.8),
        maxLife: 1.8,
        size: rnd(9, 22),
        grow: rnd(14, 32),
        color,
        grav: -6,
        drag: 1.1,
        alpha: 0.4,
      });
    }
