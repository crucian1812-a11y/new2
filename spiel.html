// Trees
// ---------------------------------------------------------------------------

function drawPine(rng, opts = {}) {
  const H = opts.h ?? rng.range(178, 244);
  const W = H * 0.62;
  const w = Math.ceil(W);
  const h = Math.ceil(H + 16);
  const dead = opts.dead ?? false;
  const snowy = opts.snowy ?? false;

  return sprite(w, h, w / 2, h - 8, (ctx, _e, lights) => {
    const cx = w / 2;
    const baseY = h - 10;
    baseAO(ctx, cx, baseY, W * 0.4);

    // Trunk
    const trunkTop = baseY - H * 0.94;
    ctx.save();
    limbPath(ctx, cx + rng.range(-3, 3), baseY + 4, cx + rng.range(-7, 7), trunkTop, H * 0.05, H * 0.013, rng.range(-7, 7));
    ctx.fillStyle = vgrad(ctx, trunkTop, baseY, [
      [0, hex('#4a3a2c')],
      [0.5, hex('#33281e')],
      [1, hex('#1d1712')],
    ]);
    ctx.fill();
    ctx.restore();

    // Bark striations
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 34; i++) {
      const t = rng.float();
      const y = lerp(baseY, trunkTop, t);
      const halfW = lerp(H * 0.05, H * 0.014, t);
      const x = cx + rng.range(-halfW, halfW) * 0.85;
      ctx.strokeStyle = rng.bool() ? 'rgba(20,15,11,0.7)' : 'rgba(120,96,70,0.28)';
      ctx.lineWidth = rng.range(0.7, 2.1);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + rng.range(-2, 2), y - rng.range(8, 26));
      ctx.stroke();
    }
    ctx.restore();

    if (dead) {
      // Bare branches only.
      for (let i = 0; i < 10; i++) {
        const t = rng.range(0.25, 0.95);
        const y = lerp(baseY, trunkTop, t);
        const dir = rng.sign();
        const len = lerp(W * 0.42, W * 0.14, t) * rng.range(0.6, 1.2);
        ctx.strokeStyle = 'rgba(40,32,25,0.95)';
        ctx.lineWidth = lerp(5, 1.6, t);
        ctx.beginPath();
        ctx.moveTo(cx, y);
        ctx.quadraticCurveTo(cx + dir * len * 0.6, y - len * 0.2, cx + dir * len, y - len * rng.range(0.3, 0.7));
        ctx.stroke();
      }
      return;
    }

    // Canopy. Real drooping branches rather than stacked cones: a back layer
    // in near-black, then a front layer that catches the key light.
    const tiers = Math.round(rng.range(10, 13));
    const deepC = hex('#0b120e');
    const darkC = hex('#17251a');
    const midC = hex('#2b4526');
    const litC = hex('#526f33');
    const tipC = hex('#84994a');

    const canopyBase = baseY - H * 0.13;
    const canopyTop = trunkTop + H * 0.04;

    const frondCol = (tier, t, side, back) => {
      let c = mixc(deepC, darkC, clamp01(t * 1.6));
      c = mixc(c, midC, clamp01(t * 1.15) * (0.45 + tier * 0.55));
      if (back) return css(mixc(c, deepC, 0.62));
      c = mixc(c, litC, clamp01(t - 0.22) * (side < 0 ? 1.0 : 0.34) * (0.35 + tier * 0.75));
      if (side < 0) c = mixc(c, tipC, clamp01(t - 0.6) * 1.25 * tier);
      return css(c);
    };

    for (let pass = 0; pass < 2; pass++) {
      const back = pass === 0;
      for (let i = 0; i < tiers; i++) {
        const tt = i / (tiers - 1);
        const y = lerp(canopyBase, canopyTop, tt) + (back ? -H * 0.015 : 0);
        const spread = lerp(W * 0.54, W * 0.07, Math.pow(tt, 0.78));
        const count = Math.max(2, Math.round(lerp(back ? 4 : 6, 2, tt)));
        for (let k = 0; k < count; k++) {
          const side = k % 2 === 0 ? -1 : 1;
          const spin = (k / count) * 0.5 + rng.float() * 0.2;
          const len = spread * rng.range(back ? 0.6 : 0.84, back ? 0.86 : 1.14);
          ctx.save();
          if (side < 0) {
            ctx.translate(cx, 0);
            ctx.scale(-1, 1);
            ctx.translate(-cx, 0);
          }
          drawFrond(
            ctx,
            cx + rng.range(-3, 3),
            y + rng.range(-H * 0.014, H * 0.014),
            -0.42 + spin * 0.5,
            len,
            rng,
            (t) => frondCol(tt, t, side, back),
            {
              baseR: len * (0.2 - tt * 0.045),
              tipR: len * 0.028,
              droop: rng.range(0.62, 1.05),
              steps: 11,
            }
          );
          ctx.restore();
        }
      }
    }

    // Leader spike
    ctx.save();
    limbPath(ctx, cx, canopyTop + H * 0.04, cx + rng.range(-4, 4), trunkTop - H * 0.05, H * 0.02, 1.2, rng.range(-3, 3));
    ctx.fillStyle = css(mixc(darkC, midC, 0.6));
    ctx.fill();
    ctx.restore();

    if (snowy) {
      // Snow settles on the upper face of each tier, never underneath.
      ctx.save();
      for (let i = 0; i < tiers; i++) {
        const tt = i / (tiers - 1);
        const y = lerp(canopyBase, canopyTop, tt);
        const spread = lerp(W * 0.5, W * 0.07, Math.pow(tt, 0.78));
        for (let k = 0; k < 4; k++) {
          const x = cx + rng.range(-spread, spread) * 0.85;
          organicPath(ctx, x, y - H * 0.008, rng.range(6, 20), rng.range(2.5, 6), rng, 9, 0.45);
          ctx.fillStyle = `rgba(214,229,244,${rng.range(0.35, 0.8).toFixed(2)})`;
          ctx.fill();
        }
      }
      ctx.restore();
    }

    applyRim(ctx, w, h, snowy ? PAL.frost : PAL.moon, snowy ? 0.4 : 0.3, 2.5, 3.5);
  }, { radius: 16, solid: true, sway: 0.5 });
}

function drawBirch(rng) {
  const H = rng.range(168, 226);
  const W = H * 0.8;
  const w = Math.ceil(W * 1.35);
  const h = Math.ceil(H * 1.12);
  return sprite(w, h, w / 2, h - 10, (ctx) => {
    const cx = w / 2;
    const baseY = h - 10;
    baseAO(ctx, cx, baseY, W * 0.3);

    const trunkTop = baseY - H * 0.72;
    const lean = rng.range(-14, 14);
    ctx.save();
    limbPath(ctx, cx, baseY + 3, cx + lean, trunkTop, H * 0.026, H * 0.012, rng.range(-8, 8));
    ctx.fillStyle = vgrad(ctx, trunkTop, baseY, [
      [0, hex('#d9d6cb')],
      [0.35, hex('#c3c0b4')],
      [0.8, hex('#8f8c80')],
      [1, hex('#57544b')],
    ]);
    ctx.fill();
    // Dark birch scars
    ctx.clip();
    for (let i = 0; i < 26; i++) {
      const t = rng.float();
      const y = lerp(baseY, trunkTop, t);
      const x = lerp(cx, cx + lean, t) + rng.range(-12, 12);
      ctx.fillStyle = `rgba(26,24,22,${rng.range(0.4, 0.9).toFixed(2)})`;
      ctx.beginPath();
      ctx.ellipse(x, y, rng.range(2, 9), rng.range(1, 2.6), rng.range(-0.2, 0.2), 0, TAU);
      ctx.fill();
    }
    // Shaded right edge
    const sg = ctx.createLinearGradient(cx - W * 0.05, 0, cx + W * 0.05, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0.12)');
    sg.addColorStop(0.55, 'rgba(0,0,0,0)');
    sg.addColorStop(1, 'rgba(20,18,16,0.5)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    // Branches + thin autumn canopy
    const canopyY = trunkTop - H * 0.02;
    for (let i = 0; i < 7; i++) {
      const dir = rng.sign();
      const y = trunkTop + rng.range(0, H * 0.16);
      ctx.strokeStyle = 'rgba(90,86,76,0.85)';
      ctx.lineWidth = rng.range(1.2, 2.6);
      ctx.beginPath();
      ctx.moveTo(cx + lean, y);
      ctx.quadraticCurveTo(cx + lean + dir * W * 0.2, y - H * 0.05, cx + lean + dir * W * 0.36, y - H * 0.14);
      ctx.stroke();
    }
    // Thin autumn canopy: hundreds of small leaves rather than a few blobs,
    // so the birch keeps its airy, see-through quality.
    const leafDark = hex('#3f4020');
    const leafMid = hex('#7d7331');
    const leafLit = hex('#c4ac48');
    const centres = [];
    for (let i = 0; i < 14; i++) {
      const a = rng.float() * TAU;
      const rr = Math.sqrt(rng.float());
      centres.push([
        cx + lean + Math.cos(a) * W * 0.4 * rr,
        canopyY - H * 0.07 + Math.sin(a) * H * 0.13 * rr,
        rng.range(14, 30),
      ]);
    }
    for (const [x, y, r] of centres) {
      ctx.save();
      organicPath(ctx, x, y + r * 0.2, r, r * 0.7, rng, 11, 0.36);
      ctx.fillStyle = css(leafDark, 0.5);
      ctx.fill();
      ctx.restore();
    }
    for (let i = 0; i < 460; i++) {
      const c = centres[(rng.float() * centres.length) | 0];
      const a = rng.float() * TAU;
      const rr = rng.float() * 1.15;
      const x = c[0] + Math.cos(a) * c[2] * rr;
      const y = c[1] + Math.sin(a) * c[2] * 0.72 * rr;
      const up = clamp01(1 - (y - (canopyY - H * 0.2)) / (H * 0.3));
      ctx.fillStyle = css(mixc(leafDark, mixc(leafMid, leafLit, up), rng.float()), rng.range(0.35, 0.95));
      ctx.beginPath();
      ctx.ellipse(x, y, rng.range(2, 5), rng.range(1.4, 3), rng.float() * TAU, 0, TAU);
      ctx.fill();
    }
    applyRim(ctx, w, h, PAL.moon, 0.24, 2, 3);
  }, { radius: 12, solid: true, sway: 0.9 });
}

function drawOak(rng, opts = {}) {
  const H = opts.h ?? rng.range(186, 236);
  const W = H * 0.82;
  const w = Math.ceil(W * 1.5);
  const h = Math.ceil(H * 1.32);
  const sacred = opts.sacred ?? false;
  return sprite(w, h, w / 2, h - 14, (ctx, ectx, lights) => {
    const cx = w / 2;
    const baseY = h - 14;
    baseAO(ctx, cx, baseY, W * 0.34);

    // Root flare
    ctx.save();
    ctx.fillStyle = css(hex('#241c14'));
    for (let i = 0; i < 7; i++) {
      const a = lerp(-0.4, Math.PI + 0.4, i / 6) + rng.range(-0.2, 0.2);
      const len = W * rng.range(0.1, 0.2);
      limbPath(ctx, cx, baseY - H * 0.06, cx + Math.cos(a) * len * 1.4, baseY + Math.abs(Math.sin(a)) * 6, H * 0.03, H * 0.012, 4);
      ctx.fill();
    }
    ctx.restore();

    // Trunk
    const forkY = baseY - H * 0.44;
    ctx.save();
    limbPath(ctx, cx, baseY, cx + rng.range(-10, 10), forkY, H * 0.075, H * 0.05, rng.range(-8, 8));
    ctx.fillStyle = vgrad(ctx, forkY, baseY, [
      [0, hex('#584634')],
      [0.45, hex('#3b2f22')],
      [1, hex('#1f1913')],
    ]);
    ctx.fill();
    ctx.clip();
    for (let i = 0; i < 60; i++) {
      const y = rng.range(forkY, baseY);
      const x = cx + rng.range(-H * 0.08, H * 0.08);
      ctx.strokeStyle = rng.bool() ? 'rgba(18,14,10,0.8)' : 'rgba(140,112,80,0.22)';
      ctx.lineWidth = rng.range(0.8, 2.6);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + rng.range(-4, 4), y - 14, x + rng.range(-6, 6), y - rng.range(20, 60));
      ctx.stroke();
    }
    ctx.restore();

    // Boughs, remembered so leaf mass can hang off them.
    const cy = forkY - H * 0.2;
    const boughs = 6;
    const tips = [];
    for (let i = 0; i < boughs; i++) {
      const a = lerp(-2.6, -0.55, i / (boughs - 1)) + rng.range(-0.16, 0.16);
      const len = H * rng.range(0.26, 0.42);
      const tx = cx + Math.cos(a) * len;
      const ty = forkY + Math.sin(a) * len * 0.9;
      ctx.save();
      limbPath(ctx, cx, forkY, tx, ty, H * 0.035, H * 0.012, rng.range(-12, 12));
      ctx.fillStyle = css(hex('#33291d'));
      ctx.fill();
      ctx.restore();
      tips.push([tx, ty]);
      // Secondary twigs reaching into the crown.
      for (let k = 0; k < 3; k++) {
        const a2 = a + rng.range(-0.7, 0.7);
        const l2 = len * rng.range(0.3, 0.55);
        const x2 = tx + Math.cos(a2) * l2;
        const y2 = ty + Math.sin(a2) * l2 * 0.9;
        ctx.save();
        limbPath(ctx, tx, ty, x2, y2, H * 0.014, H * 0.005, rng.range(-8, 8));
        ctx.fillStyle = css(hex('#2b2318'));
        ctx.fill();
        ctx.restore();
        tips.push([x2, y2]);
      }
    }

    // Canopy: leaf masses clustered around the twig tips, dark underside up
    // to a lit crest, so the crown has a top and a bottom.
    const dark = sacred ? hex('#141026') : hex('#101709');
    const mid = sacred ? hex('#2e2750') : hex('#22331a');
    const lit = sacred ? hex('#5f5296') : hex('#3f5525');
    const hot = sacred ? hex('#8e7bd0') : hex('#65763a');

    const clusters = [];
    for (const [tx, ty] of tips) {
      const n = rng.int(2, 4);
      for (let i = 0; i < n; i++) {
        clusters.push([
          tx + rng.range(-W * 0.1, W * 0.1),
          ty + rng.range(-H * 0.1, H * 0.06),
          rng.range(W * 0.085, W * 0.17),
        ]);
      }
    }
    // Painter order: lowest (furthest under) first.
    clusters.sort((a, b) => b[1] - a[1]);

    for (const [x, y, r] of clusters) {
      const up = clamp01(1 - (y - (cy - H * 0.26)) / (H * 0.46));
      const left = clamp01(0.5 - (x - cx) / (W * 0.9));
      ctx.save();
      organicPath(ctx, x, y + r * 0.24, r * 1.02, r * 0.78, rng, 13, 0.32);
      ctx.fillStyle = css(dark, 0.95);
      ctx.fill();
      ctx.restore();
      ctx.save();
      organicPath(ctx, x - r * 0.09, y - r * 0.06, r * 0.86, r * 0.62, rng, 13, 0.34);
      ctx.fillStyle = css(mixc(mid, lit, up * 0.75 + left * 0.3), 0.92);
      ctx.fill();
      ctx.restore();
      if (up > 0.5) {
        ctx.save();
        organicPath(ctx, x - r * 0.2, y - r * 0.26, r * 0.5, r * 0.32, rng, 11, 0.38);
        ctx.fillStyle = css(mixc(lit, hot, (up - 0.5) * 1.6 * (0.4 + left)), 0.7);
        ctx.fill();
        ctx.restore();
      }
    }

    // Individual leaves biting into the silhouette.
    ctx.save();
    for (let i = 0; i < 620; i++) {
      const c = clusters[(rng.float() * clusters.length) | 0];
      const a = rng.float() * TAU;
      const rr = 0.82 + rng.float() * 0.4;
      const x = c[0] + Math.cos(a) * c[2] * rr;
      const y = c[1] + Math.sin(a) * c[2] * 0.78 * rr;
      const up = clamp01(1 - (y - (cy - H * 0.26)) / (H * 0.46));
      ctx.fillStyle = css(mixc(dark, mixc(lit, hot, up * 0.6), rng.float() * (0.35 + up * 0.75)), rng.range(0.45, 1));
      ctx.beginPath();
      ctx.ellipse(x, y, rng.range(2, 5.5), rng.range(1.3, 3.2), rng.float() * TAU, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // A couple of gaps where the sky shows through the crown.
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 5; i++) {
      const x = cx + rng.range(-W * 0.32, W * 0.32);
      const y = cy + rng.range(-H * 0.14, H * 0.14);
      organicPath(ctx, x, y, rng.range(8, 22), rng.range(6, 16), rng, 9, 0.4);
      ctx.fill();
    }
    ctx.restore();

    applyRim(ctx, w, h, sacred ? hex('#d8b6ff') : PAL.moon, 0.3, 2.5, 3.5);

    if (sacred && ectx) {
      // Votive lights hung in the branches of the holy oak.
      for (let i = 0; i < 6; i++) {
        const x = cx + rng.range(-W * 0.35, W * 0.35);
        const y = cy + rng.range(-H * 0.1, H * 0.22);
        ectx.fillStyle = 'rgba(255,190,110,0.95)';
        ectx.beginPath();
        ectx.arc(x, y, 3.2, 0, TAU);
        ectx.fill();
        ctx.fillStyle = 'rgba(255,206,140,0.9)';
        ctx.beginPath();
        ctx.arc(x, y, 2.4, 0, TAU);
        ctx.fill();
        lights.push({ x, y, r: 90, color: PAL.torch, i: 0.55, flicker: 0.35 });
      }
    }
  }, { radius: 26, solid: true, sway: 0.35, emissive: opts.sacred });
}

function drawDeadTree(rng) {
  const H = rng.range(150, 214);
  const W = H * 0.8;
  const w = Math.ceil(W);
  const h = Math.ceil(H + 14);
  return sprite(w, h, w / 2, h - 8, (ctx) => {
    const cx = w / 2;
    const baseY = h - 10;
    baseAO(ctx, cx, baseY, W * 0.26);
    const col = hex('#2a241d');
    const lit = hex('#6b6152');

    const branch = (x, y, a, len, wdt, depth) => {
      const x2 = x + Math.cos(a) * len;
      const y2 = y + Math.sin(a) * len;
      ctx.save();
      limbPath(ctx, x, y, x2, y2, wdt, wdt * 0.55, rng.range(-len * 0.12, len * 0.12));
      ctx.fillStyle = css(col);
      ctx.fill();
      ctx.strokeStyle = css(lit, 0.28);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      if (depth <= 0 || len < 12) return;
      const n = rng.int(2, 3);
      for (let i = 0; i < n; i++) {
        branch(x2, y2, a + rng.range(-0.75, 0.75), len * rng.range(0.55, 0.76), wdt * 0.58, depth - 1);
      }
    };
    branch(cx, baseY, -Math.PI / 2 + rng.range(-0.15, 0.15), H * 0.36, H * 0.035, 4);
  }, { radius: 10, solid: true, sway: 0.6 });
}

// ---------------------------------------------------------------------------
// Rocks, ruins, structures
// ---------------------------------------------------------------------------

function drawRock(rng, opts = {}) {
  const S = opts.s ?? rng.range(52, 112);
  const w = Math.ceil(S * 1.5);
  const h = Math.ceil(S * 1.25);
  const mossy = opts.mossy ?? false;
  const amber = opts.amber ?? false;
  return sprite(w, h, w / 2, h - S * 0.12, (ctx, ectx, lights) => {
    const cx = w / 2;
    const baseY = h - S * 0.14;
    baseAO(ctx, cx, baseY, S * 0.65);

    const base = amber ? hex('#5a4630') : hex('#3e4045');
    const light = amber ? hex('#a9834a') : hex('#767a82');
    const dark = amber ? hex('#1e1710') : hex('#191b1f');

    // Silhouette
    ctx.save();
    organicPath(ctx, cx, baseY - S * 0.36, S * 0.62, S * 0.42, rng, 10, 0.26);
    ctx.fillStyle = css(dark);
    ctx.fill();
    ctx.clip();

    // Facets \u2014 flat-ish planes catching the key light differently
    const facets = rng.int(5, 8);
    for (let i = 0; i < facets; i++) {
      const a0 = (i / facets) * TAU + rng.range(-0.2, 0.2);
      const a1 = a0 + TAU / facets + rng.range(0, 0.3);
      const fx = cx + Math.cos((a0 + a1) / 2) * S * 0.16;
      const fy = baseY - S * 0.36 + Math.sin((a0 + a1) / 2) * S * 0.13;
      ctx.beginPath();
      ctx.moveTo(cx + rng.range(-8, 8), baseY - S * 0.36 + rng.range(-8, 8));
      ctx.lineTo(fx + Math.cos(a0) * S * 0.7, fy + Math.sin(a0) * S * 0.5);
      ctx.lineTo(fx + Math.cos(a1) * S * 0.7, fy + Math.sin(a1) * S * 0.5);
      ctx.closePath();
      // Light contribution from the upper-left key.
      const nrm = Math.cos((a0 + a1) / 2 - (-2.2));
      const t = clamp01(0.5 + nrm * 0.5);
      ctx.fillStyle = css(mixc(dark, light, t * t * 0.95), 0.95);
      ctx.fill();
    }

    // Chipped sub-facets break up the big planes.
    for (let i = 0; i < 14; i++) {
      const a = rng.float() * TAU;
      const rr = rng.float();
      const x = cx + Math.cos(a) * S * 0.5 * rr;
      const y = baseY - S * 0.36 + Math.sin(a) * S * 0.34 * rr;
      const r = rng.range(S * 0.05, S * 0.16);
      organicPath(ctx, x, y, r, r * rng.range(0.5, 0.9), rng, 6, 0.3);
      const nrm = Math.cos(a - -2.2);
      ctx.fillStyle = css(mixc(dark, light, clamp01(0.5 + nrm * 0.5) * 0.85), rng.range(0.2, 0.5));
      ctx.fill();
    }

    // Cracks
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = css(dark);
    for (let i = 0; i < 6; i++) {
      ctx.lineWidth = rng.range(0.7, 1.8);
      ctx.beginPath();
      let x = cx + rng.range(-S * 0.5, S * 0.5);
      let y = baseY - S * 0.36 + rng.range(-S * 0.3, S * 0.3);
      ctx.moveTo(x, y);
      for (let k = 0; k < 4; k++) {
        x += rng.range(-S * 0.16, S * 0.16);
        y += rng.range(-S * 0.12, S * 0.12);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Lichen \u2014 pale crusty blotches, the thing that makes stone look old.
    for (let i = 0; i < 22; i++) {
      const a = rng.float() * TAU;
      const rr = Math.sqrt(rng.float());
      const x = cx + Math.cos(a) * S * 0.55 * rr;
      const y = baseY - S * 0.4 + Math.sin(a) * S * 0.36 * rr;
      const r = rng.range(S * 0.02, S * 0.09);
      organicPath(ctx, x, y, r, r * 0.75, rng, 9, 0.42);
      const pale = rng.bool(0.6) ? hex('#7d8a72') : hex('#9a9276');
      ctx.fillStyle = css(pale, rng.range(0.1, 0.34));
      ctx.fill();
    }

    // Underside shadow so it doesn't read as a floating pebble.
    const ug = ctx.createLinearGradient(0, baseY - S * 0.5, 0, baseY);
    ug.addColorStop(0, 'rgba(0,0,0,0)');
    ug.addColorStop(1, 'rgba(6,7,9,0.6)');
    ctx.fillStyle = ug;
    ctx.fillRect(0, 0, w, h);

    grainPass(ctx, rng, 0.3, 900, { x: 0, y: 0, w, h });
    ctx.restore();

    applyRim(ctx, w, h, PAL.moon, 0.26, 2.5, 3);

    if (mossy) {
      // Moss creeps over the upper face in patches, not as one flat decal.
      ctx.save();
      for (let i = 0; i < 26; i++) {
        const x = cx + rng.range(-S * 0.5, S * 0.42);
        const y = baseY - S * 0.62 + rng.range(-S * 0.12, S * 0.22);
        const r = rng.range(S * 0.04, S * 0.15);
        organicPath(ctx, x, y, r, r * rng.range(0.35, 0.6), rng, 10, 0.45);
        ctx.fillStyle = css(mixc(hex('#26361c'), hex('#5c7434'), rng.float()), rng.range(0.25, 0.7));
        ctx.fill();
      }
      ctx.restore();
    }
    if (amber && ectx) {
      // Amber veins glowing in the boulder.
      for (let i = 0; i < 5; i++) {
        const x = cx + rng.range(-S * 0.4, S * 0.4);
        const y = baseY - S * 0.36 + rng.range(-S * 0.25, S * 0.25);
        const r = rng.range(3, 8);
        ctx.fillStyle = css(PAL.amber, 0.85);
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.7, rng.float() * TAU, 0, TAU);
        ctx.fill();
        ectx.fillStyle = css(PAL.amber, 0.9);
        ectx.beginPath();
        ectx.ellipse(x, y, r * 1.2, r * 0.9, 0, 0, TAU);
        ectx.fill();
      }
      lights.push({ x: cx, y: baseY - S * 0.36, r: S * 2.2, color: PAL.amber, i: 0.5, flicker: 0.12 });
    }
  }, { radius: S * 0.42, solid: true, emissive: opts.amber });
}

function drawRuinWall(rng, opts = {}) {
  const W = opts.w ?? rng.range(150, 250);
  const H = opts.h ?? rng.range(100, 180);
  const w = Math.ceil(W);
  const h = Math.ceil(H + 30);
  return sprite(w, h, w / 2, h - 12, (ctx) => {
    const baseY = h - 14;
    baseAO(ctx, w / 2, baseY, W * 0.55);

    const brickH = 22;
    const rows = Math.floor(H / brickH);
    // Broken top profile
    const topAt = (x) => {
      const t = x / W;
      return baseY - H * (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 7 + rng.seed % 7)) * (0.6 + 0.4 * Math.sin(t * 3.1)));
    };

    for (let r = 0; r < rows; r++) {
      const y = baseY - r * brickH;
      const off = (r % 2) * 24;
      for (let x = -24 + off; x < W; x += 48) {
        const bw = 46 + rng.range(-3, 3);
        const bh = brickH - 2;
        const topY = topAt(x + bw / 2);
        if (y - bh < topY) continue;
        const tone = rng.range(0.25, 0.85);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x + rng.range(0, 2), y);
        ctx.lineTo(x + bw + rng.range(-2, 1), y - rng.range(0, 1.5));
        ctx.lineTo(x + bw + rng.range(-2, 1), y - bh);
        ctx.lineTo(x + rng.range(0, 2), y - bh + rng.range(-1, 1));
        ctx.closePath();
        const g = ctx.createLinearGradient(x, y - bh, x + bw, y);
        g.addColorStop(0, css(mixc(hex('#6b6459'), hex('#8b8478'), tone)));
        g.addColorStop(1, css(mixc(hex('#33302b'), hex('#5a544b'), tone)));
        ctx.fillStyle = g;
        ctx.fill();
        // Top bevel highlight
        ctx.strokeStyle = 'rgba(200,205,215,0.16)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x + 1, y - bh + 1);
        ctx.lineTo(x + bw - 1, y - bh + 1);
        ctx.stroke();
        ctx.restore();
      }
    }

    // Mortar grime and moss wash. `source-atop` keeps it inside the masonry \u2014
    // `multiply` would paint clouds over the empty sky above the broken top.
    ctx.save();
    ctx.globalCompositeOperation = 'source-atop';
    for (let i = 0; i < 40; i++) {
      const x = rng.range(0, W);
      const y = rng.range(baseY - H, baseY);
      const r = rng.range(14, 46);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${rng.bool() ? '60,70,45' : '40,38,34'},0.4)`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.restore();

    // Rubble at the foot
    for (let i = 0; i < 14; i++) {
      const x = rng.range(-6, W + 6);
      const y = baseY + rng.range(-4, 8);
      ctx.save();
      organicPath(ctx, x, y, rng.range(5, 16), rng.range(3, 8), rng, 8, 0.3);
      ctx.fillStyle = css(mixc(hex('#302d29'), hex('#7a746a'), rng.float()), 0.95);
      ctx.fill();
      ctx.restore();
    }
  }, { radius: W * 0.28, solid: true });
}

function drawBrazier(rng) {
  const w = 150;
  const h = 250;
  return sprite(w, h, w / 2, h - 10, (ctx, ectx, lights) => {
    const cx = w / 2;
    const baseY = h - 12;
    baseAO(ctx, cx, baseY, 54);

    // Wrought-iron tripod with a cross-brace
    const legTop = baseY - 118;
    ctx.lineCap = 'round';
    for (const dx of [-1, 0.15, 1]) {
      ctx.strokeStyle = css(hex('#191b1f'));
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(cx + dx * 34, baseY);
      ctx.quadraticCurveTo(cx + dx * 20, baseY - 62, cx + dx * 26, legTop);
      ctx.stroke();
      ctx.strokeStyle = css(hex('#4a4e57'), 0.55);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx + dx * 34 - 2, baseY);
      ctx.quadraticCurveTo(cx + dx * 20 - 2, baseY - 62, cx + dx * 26 - 2, legTop);
      ctx.stroke();
    }
    ctx.strokeStyle = css(hex('#20232a'));
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 52, 30, 9, 0, 0, TAU);
    ctx.stroke();

    // Bowl
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - 50, baseY - 124);
    ctx.quadraticCurveTo(cx, baseY - 80, cx + 50, baseY - 124);
    ctx.lineTo(cx + 56, baseY - 140);
    ctx.quadraticCurveTo(cx, baseY - 122, cx - 56, baseY - 140);
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - 56, 0, cx + 56, 0);
    g.addColorStop(0, css(hex('#5f636d')));
    g.addColorStop(0.35, css(hex('#33363d')));
    g.addColorStop(0.75, css(hex('#212429')));
    g.addColorStop(1, css(hex('#14161a')));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
    // Rivets along the rim
    for (let i = 0; i < 9; i++) {
      const t = i / 8;
      const x = lerp(cx - 52, cx + 52, t);
      const y = baseY - 136 + Math.sin(t * Math.PI) * 5;
      ctx.fillStyle = 'rgba(126,132,142,0.5)';
      ctx.beginPath();
      ctx.arc(x, y, 2.4, 0, TAU);
      ctx.fill();
    }

    // Coal bed
    for (let i = 0; i < 30; i++) {
      const x = cx + rng.range(-46, 46);
      const y = baseY - 134 + rng.range(-5, 6);
      const t = rng.float();
      ctx.fillStyle = css(mixc(hex('#2d1409'), PAL.torchCore, t * t * t), 0.96);
      ctx.beginPath();
      ctx.ellipse(x, y, rng.range(3, 8), rng.range(2, 5), 0, 0, TAU);
      ctx.fill();
    }
    // Flame tongues
    for (let i = 0; i < 7; i++) {
      const x = cx + rng.range(-32, 32);
      const hgt = rng.range(26, 74);
      const y0 = baseY - 138;
      ctx.beginPath();
      ctx.moveTo(x - rng.range(6, 13), y0);
      ctx.quadraticCurveTo(x + rng.range(-9, 9), y0 - hgt * 0.55, x + rng.range(-5, 5), y0 - hgt);
      ctx.quadraticCurveTo(x + rng.range(-6, 12), y0 - hgt * 0.5, x + rng.range(6, 13), y0);
      ctx.closePath();
      const fg = ctx.createLinearGradient(0, y0, 0, y0 - hgt);
      fg.addColorStop(0, css(PAL.torchCore, 0.85));
      fg.addColorStop(0.45, css(PAL.torch, 0.6));
      fg.addColorStop(1, css(hex('#8d3a12'), 0));
      ctx.fillStyle = fg;
      ctx.fill();
      if (ectx) {
        ectx.fillStyle = fg;
        ectx.fill();
      }
    }
    if (ectx) {
      const eg = ectx.createRadialGradient(cx, baseY - 150, 0, cx, baseY - 150, 42);
      eg.addColorStop(0, css(PAL.torchCore, 0.55));
      eg.addColorStop(0.4, css(PAL.torch, 0.3));
      eg.addColorStop(1, css(PAL.torch, 0));
      ectx.fillStyle = eg;
      ectx.fillRect(cx - 46, baseY - 196, 92, 92);
    }
    lights.push({ x: cx, y: baseY - 150, r: 360, color: PAL.torch, i: 1.05, flicker: 1 });
  }, { radius: 30, solid: true, emissive: true });
}

/** Cross patt\u00e9e \u2014 the Order's mark, arms flaring outward from the centre. */
function crossPattee(ctx, cx, cy, arm, thin, thick) {
  ctx.beginPath();
  for (let q = 0; q < 4; q++) {
    const a = (q * Math.PI) / 2;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    // Local arm: from (thin/2 at centre) flaring to (thick/2 at the tip).
    const pts = [
      [thin * 0.5, -thin * 0.5],
      [arm, -thick * 0.5],
      [arm, thick * 0.5],
      [thin * 0.5, thin * 0.5],
    ];
    let first = true;
    for (const [px, py] of pts) {
      const x = cx + px * ca - py * sa;
      const y = cy + px * sa + py * ca;
      if (first) {
        ctx.moveTo(x, y);
        first = false;
      } else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  ctx.fill('nonzero');
}

function drawBanner(rng, opts = {}) {
  const w = 96;
  const h = 236;
  const white = opts.white ?? true;
  return sprite(w, h, w * 0.32, h - 8, (ctx) => {
    const px = w * 0.32;
    const baseY = h - 10;
    baseAO(ctx, px, baseY, 30);
    // Pole
    const pg = ctx.createLinearGradient(px - 5, 0, px + 5, 0);
    pg.addColorStop(0, css(hex('#6a5136')));
    pg.addColorStop(0.5, css(hex('#3a2c1e')));
    pg.addColorStop(1, css(hex('#1d160f')));
    ctx.fillStyle = pg;
    ctx.fillRect(px - 5, baseY - 306, 10, 306);
    // Finial
    ctx.fillStyle = css(PAL.gold, 0.85);
    ctx.beginPath();
    ctx.moveTo(px, baseY - 326);
    ctx.lineTo(px + 7, baseY - 308);
    ctx.lineTo(px, baseY - 300);
    ctx.lineTo(px - 7, baseY - 308);
    ctx.closePath();
    ctx.fill();
    // Crossbar the cloth hangs from
    ctx.fillStyle = css(hex('#2f2418'));
    ctx.fillRect(px - 4, baseY - 300, 78, 7);

    // Cloth
    const top = baseY - 294;
    const bot = baseY - 96;
    const right = px + 74;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(px - 2, top);
    ctx.lineTo(right, top + 5);
    ctx.quadraticCurveTo(right - 9, (top + bot) / 2, right + 3, bot - 8);
    ctx.quadraticCurveTo(px + 32, bot + 14, px - 2, bot);
    ctx.closePath();
    const g = ctx.createLinearGradient(px, 0, right, 0);
    if (white) {
      g.addColorStop(0, css(hex('#7d7a70')));
      g.addColorStop(0.35, css(PAL.orderWhite));
      g.addColorStop(0.75, css(hex('#b3afa2')));
      g.addColorStop(1, css(hex('#6e6c64')));
    } else {
      g.addColorStop(0, css(hex('#2c0e10')));
      g.addColorStop(0.4, css(hex('#7a262a')));
      g.addColorStop(1, css(hex('#280c0e')));
    }
    ctx.fillStyle = g;
    ctx.fill();
    ctx.clip();

    const bx = px + 36;
    const by = (top + bot) / 2;
    if (white) {
      ctx.fillStyle = css(PAL.orderBlack, 0.92);
      crossPattee(ctx, bx, by, 46, 13, 34);
    } else {
      ctx.fillStyle = css(hex('#d8cfa8'), 0.85);
      crossPattee(ctx, bx, by, 42, 12, 30);
    }

    // Folds: vertical shadow bands with a soft edge.
    for (let i = 0; i < 7; i++) {
      const x = px + rng.range(2, 70);
      const fw = rng.range(5, 16);
      const fg = ctx.createLinearGradient(x, 0, x + fw, 0);
      fg.addColorStop(0, 'rgba(255,255,255,0.06)');
      fg.addColorStop(0.5, `rgba(18,16,14,${rng.range(0.1, 0.28).toFixed(2)})`);
      fg.addColorStop(1, 'rgba(255,255,255,0.05)');
      ctx.fillStyle = fg;
      ctx.fillRect(x, top - 4, fw, bot - top + 24);
    }
    // Weathering
    for (let i = 0; i < 14; i++) {
      const x = px + rng.range(0, 74);
      const y = rng.range(top, bot);
      const r = rng.range(8, 26);
      const sg = ctx.createRadialGradient(x, y, 0, x, y, r);
      sg.addColorStop(0, `rgba(64,54,38,${rng.range(0.08, 0.24).toFixed(2)})`);
      sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.restore();

    // Tattered lower edge
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 9; i++) {
      const y = lerp(bot - 34, bot + 12, rng.float());
      ctx.beginPath();
      ctx.moveTo(right + 8, y);
      ctx.lineTo(px + rng.range(20, 56), y + rng.range(4, 18));
      ctx.lineTo(right + 8, y + rng.range(10, 26));
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    applyRim(ctx, w, h, PAL.moon, 0.2, 2, 2.5);
  }, { radius: 8, solid: false, sway: 1.4 });
}

function drawWreck(rng) {
  const w = 420;
  const h = 260;
  return sprite(w, h, w / 2, h - 20, (ctx) => {
    const baseY = h - 26;
    baseAO(ctx, w / 2, baseY, 170);
    // Hull, canted over
    ctx.save();
    ctx.translate(w / 2, baseY);
    ctx.rotate(-0.16);
    ctx.beginPath();
    ctx.moveTo(-170, 0);
    ctx.quadraticCurveTo(-150, -70, -60, -86);
    ctx.lineTo(110, -78);
    ctx.quadraticCurveTo(170, -66, 158, 4);
    ctx.quadraticCurveTo(20, 34, -170, 0);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -90, 0, 20);
    g.addColorStop(0, css(hex('#4c3a26')));
    g.addColorStop(0.6, css(hex('#2e2317')));
    g.addColorStop(1, css(hex('#171109')));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.clip();
    // Planking
    for (let y = -84; y < 20; y += 11) {
      ctx.strokeStyle = `rgba(18,13,8,0.6)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-180, y);
      ctx.quadraticCurveTo(0, y + 8, 180, y);
      ctx.stroke();
      ctx.strokeStyle = `rgba(150,124,88,0.13)`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-180, y + 2);
      ctx.quadraticCurveTo(0, y + 10, 180, y + 2);
      ctx.stroke();
    }
    // Hole in the hull
    ctx.globalCompositeOperation = 'destination-out';
    organicPath(ctx, 30, -30, 42, 30, rng, 10, 0.35);
    ctx.fill();
    ctx.restore();

    // Broken mast
    ctx.save();
    ctx.translate(w / 2 - 30, baseY - 70);
    ctx.rotate(-0.5);
    ctx.fillStyle = css(hex('#3b2c1c'));
    ctx.fillRect(-7, -150, 14, 150);
    ctx.beginPath();
    ctx.moveTo(-7, -150);
    ctx.lineTo(0, -172);
    ctx.lineTo(7, -150);
    ctx.closePath();
    ctx.fill();
    // Shred of sail
    ctx.fillStyle = 'rgba(190,184,168,0.35)';
    ctx.beginPath();
    ctx.moveTo(7, -140);
    ctx.quadraticCurveTo(60, -120, 44, -60);
    ctx.quadraticCurveTo(30, -84, 7, -76);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Ribs poking out
    for (let i = 0; i < 6; i++) {
      const x = w / 2 + lerp(-140, 120, i / 5) + rng.range(-10, 10);
      ctx.strokeStyle = css(hex('#2a2015'));
      ctx.lineWidth = rng.range(5, 9);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, baseY - 10);
      ctx.quadraticCurveTo(x + rng.range(-14, 14), baseY - 60, x + rng.range(-24, 24), baseY - rng.range(80, 130));
      ctx.stroke();
    }
    // Ice piled against the windward side.
    for (let i = 0; i < 10; i++) {
      const x = w / 2 + rng.range(-190, -60);
      const y = baseY + rng.range(-14, 10);
      organicPath(ctx, x, y, rng.range(10, 30), rng.range(4, 12), rng, 8, 0.3);
      ctx.fillStyle = css(mixc(hex('#6d8598'), hex('#cfe0ee'), rng.float()), rng.range(0.4, 0.85));
      ctx.fill();
    }
    applyRim(ctx, w, h, PAL.moon, 0.34, 3, 3.5);
  }, { radius: 92, solid: true });
}

function drawIdol(rng, opts = {}) {
  const w = 110;
  const h = 250;
  const lit = opts.lit ?? false;
  return sprite(w, h, w / 2, h - 8, (ctx, ectx, lights) => {
    const cx = w / 2;
    const baseY = h - 10;
    baseAO(ctx, cx, baseY, 34);
    // Carved log
    ctx.save();
    limbPath(ctx, cx, baseY, cx + rng.range(-6, 6), baseY - 210, 22, 18, rng.range(-6, 6));
    const g = ctx.createLinearGradient(cx - 24, 0, cx + 24, 0);
    g.addColorStop(0, css(hex('#5d4830')));
    g.addColorStop(0.4, css(hex('#3a2c1c')));
    g.addColorStop(1, css(hex('#1d160e')));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.clip();
    for (let i = 0; i < 30; i++) {
      const y = baseY - rng.range(0, 210);
      ctx.strokeStyle = 'rgba(16,12,8,0.6)';
      ctx.lineWidth = rng.range(0.7, 2);
      ctx.beginPath();
      ctx.moveTo(cx - 24, y);
      ctx.lineTo(cx + 24, y + rng.range(-3, 3));
      ctx.stroke();
    }
    ctx.restore();
    // Face: carved brow, hollow eyes, slit mouth
    const fy = baseY - 172;
    ctx.fillStyle = 'rgba(12,9,6,0.9)';
    ctx.beginPath();
    ctx.ellipse(cx - 8, fy, 5.5, 4, 0, 0, TAU);
    ctx.ellipse(cx + 8, fy, 5.5, 4, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(90,72,50,0.55)';
    ctx.fillRect(cx - 18, fy - 12, 36, 5);
    ctx.fillStyle = 'rgba(12,9,6,0.85)';
    ctx.fillRect(cx - 11, fy + 18, 22, 4);
    // Antler crown
    ctx.strokeStyle = css(PAL.bone, 0.8);
    ctx.lineWidth = 3;
    for (const dir of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + dir * 8, baseY - 206);
      ctx.quadraticCurveTo(cx + dir * 34, baseY - 226, cx + dir * 26, baseY - 250);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + dir * 22, baseY - 224);
      ctx.lineTo(cx + dir * 40, baseY - 234);
      ctx.stroke();
    }
    if (lit && ectx) {
      ectx.fillStyle = css(PAL.bogfire, 0.9);
      ectx.beginPath();
      ectx.ellipse(cx - 8, fy, 8, 6, 0, 0, TAU);
      ectx.ellipse(cx + 8, fy, 8, 6, 0, 0, TAU);
      ectx.fill();
      ctx.fillStyle = css(PAL.bogfire, 0.9);
      ctx.beginPath();
      ctx.ellipse(cx - 8, fy, 4, 3, 0, 0, TAU);
      ctx.ellipse(cx + 8, fy, 4, 3, 0, 0, TAU);
      ctx.fill();
      lights.push({ x: cx, y: fy, r: 200, color: PAL.bogfire, i: 0.7, flicker: 0.5 });
    }
  }, { radius: 14, solid: true, emissive: opts.lit });
}

/**
 * One blade of vegetation: a tapered leaf, not a line.
 *
 * Drawn as a closed shape that is wide at the root and comes to a point,
 * with a dark edge down its shaded side and a bright spine down its lit one.
 * A constant-width stroke has no silhouette and no direction, which is why a
 * field of them turned into a brown smear \u2014 with two hundred of them on
 * screen the only thing that separates one blade from the next is that each
 * has its own light and dark side.
 */
function blade(ctx, x, baseY, len, bend, width, dark, light, alpha) {
  const tipX = x + bend;
  const tipY = baseY - len;
  const midX = x + bend * 0.4;
  const midY = baseY - len * 0.6;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(x - width, baseY);
  ctx.quadraticCurveTo(midX - width * 0.5, midY, tipX, tipY);
  ctx.quadraticCurveTo(midX + width * 0.5, midY, x + width, baseY);
  ctx.closePath();
  ctx.fillStyle = css(dark);
  ctx.fill();
  // The lit half, inset towards the light.
  ctx.beginPath();
  ctx.moveTo(x - width * 0.15, baseY);
  ctx.quadraticCurveTo(midX - width * 0.45, midY, tipX, tipY);
  ctx.quadraticCurveTo(midX - width * 0.05, midY, x + width * 0.45, baseY);
  ctx.closePath();
  ctx.fillStyle = css(light);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawReeds(rng) {
  const w = 130;
  const h = 150;
  return sprite(w, h, w / 2, h - 6, (ctx) => {
    const cx = w / 2;
    const baseY = h - 8;

    // Root mass: a dark wedge the stalks rise out of, so the clump is planted
    // in the mud instead of standing on it.
    ctx.fillStyle = 'rgba(18,16,11,0.65)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY, 46, 9, 0, 0, TAU);
    ctx.fill();

    // Back rank first, in shadow; front rank after, catching the light. Two
    // ranks is what gives a clump depth at this size.
    for (let rank = 0; rank < 2; rank++) {
      const back = rank === 0;
      const n = back ? 16 : 14;
      for (let i = 0; i < n; i++) {
        const x = cx + rng.range(-52, 52) * (back ? 1 : 0.82);
        const len = rng.range(50, 132) * (back ? 0.94 : 1);
        const bend = rng.range(-24, 24);
        const t = rng.float();
        const dark = back ? hex('#22261a') : hex('#33371f');
        const light = back
          ? mixc(hex('#3b4026'), hex('#6b6a42'), t)
          : mixc(hex('#5c5a36'), hex('#a89f66'), t);
        blade(ctx, x, baseY - (back ? 2 : 0), len, bend, rng.range(1.4, 3), dark, light, back ? 0.85 : 1);

        // Cattail heads: a velvety brown club with a lit edge and a whisker.
        if (!back && rng.bool(0.34)) {
          const hx = x + bend;
          const hy = baseY - len - 4;
          ctx.fillStyle = css(hex('#2a1f12'));
          ctx.beginPath();
          ctx.ellipse(hx, hy, 3.4, 9.5, bend * 0.01, 0, TAU);
          ctx.fill();
          ctx.fillStyle = css(hex('#6b4f2c'));
          ctx.beginPath();
          ctx.ellipse(hx - 1, hy - 1, 2.1, 7.6, bend * 0.01, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = 'rgba(150,132,92,0.5)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(hx, hy - 9);
          ctx.lineTo(hx + bend * 0.06, hy - 16);
          ctx.stroke();
        }
      }
    }
  }, { radius: 0, solid: false, sway: 2.2 });
}

function drawGrassTuft(rng) {
  const w = 60;
  const h = 46;
  return sprite(w, h, w / 2, h - 3, (ctx) => {
    const cx = w / 2;
    const baseY = h - 4;
    ctx.fillStyle = 'rgba(16,18,10,0.5)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY, 19, 4.5, 0, 0, TAU);
    ctx.fill();
    for (let rank = 0; rank < 2; rank++) {
      const back = rank === 0;
      for (let i = 0; i < (back ? 9 : 8); i++) {
        const x = cx + rng.range(-20, 20) * (back ? 1 : 0.8);
        const len = rng.range(10, 34) * (back ? 0.9 : 1);
        const bend = rng.range(-12, 12);
        const t = rng.float();
        const dark = back ? hex('#1b2413') : hex('#26311a');
        const light = back
          ? mixc(hex('#2c3a1e'), hex('#4c5828'), t)
          : mixc(hex('#43521f'), hex('#8a9445'), t);
        blade(ctx, x, baseY - (back ? 1 : 0), len, bend, rng.range(0.9, 1.9), dark, light, back ? 0.85 : 1);
      }
    }
  }, { radius: 0, solid: false, sway: 2.6 });
}

function drawBones(rng) {
  const w = 110;
  const h = 70;
  return sprite(w, h, w / 2, h - 8, (ctx) => {
    baseAO(ctx, w / 2, h - 10, 34);
    for (let i = 0; i < 7; i++) {
      const x = rng.range(18, w - 18);
      const y = rng.range(h - 34, h - 8);
      const a = rng.float() * Math.PI;
      const len = rng.range(14, 34);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a);
      ctx.fillStyle = css(mixc(PAL.boneDark, PAL.bone, rng.float()), 0.95);
      ctx.beginPath();
      ctx.roundRect(-len / 2, -2.6, len, 5.2, 3);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-len / 2, 0, 4, 0, TAU);
      ctx.arc(len / 2, 0, 4, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    // A skull
    const sx = w / 2 + rng.range(-16, 16);
    const sy = h - 22;
    ctx.fillStyle = css(PAL.bone, 0.96);
    ctx.beginPath();
    ctx.ellipse(sx, sy, 13, 11, rng.range(-0.3, 0.3), 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(20,16,12,0.85)';
    ctx.beginPath();
    ctx.ellipse(sx - 5, sy - 1, 3.4, 3.8, 0, 0, TAU);
    ctx.ellipse(sx + 5, sy - 1, 3.4, 3.8, 0, 0, TAU);
    ctx.fill();
    ctx.fillRect(sx - 2, sy + 5, 4, 4);
  }, { radius: 0, solid: false });
}

/** A hanse trade crate, seen slightly from above. Smashable for loot. */
function drawCrate(rng) {
  const w = 130;
  const h = 120;
  return sprite(w, h, w / 2, h - 8, (ctx) => {
    const cx = w / 2;
    const baseY = h - 10;
    baseAO(ctx, cx, baseY, 46);
    const bw = 84;
    const bh = 66;
    const lidD = 15; // apparent depth of the top face
    const top = baseY - bh;

    // Front face
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx - bw / 2, top, bw, bh);
    const g = ctx.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0);
    g.addColorStop(0, css(hex('#6b5033')));
    g.addColorStop(0.4, css(hex('#4a3722')));
    g.addColorStop(1, css(hex('#241b11')));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.clip();
    // Vertical planks with gaps
    for (let i = 1; i < 5; i++) {
      const x = cx - bw / 2 + (i * bw) / 5;
      ctx.strokeStyle = 'rgba(14,10,6,0.65)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x + rng.range(-1.5, 1.5), baseY);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(150,120,84,0.14)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x + 2, top);
      ctx.lineTo(x + 2, baseY);
      ctx.stroke();
    }
    // Grain
    for (let i = 0; i < 40; i++) {
      const y = rng.range(top, baseY);
      ctx.strokeStyle = `rgba(20,14,9,${rng.range(0.06, 0.2).toFixed(2)})`;
      ctx.lineWidth = rng.range(0.6, 1.6);
      ctx.beginPath();
      ctx.moveTo(cx - bw / 2, y);
      ctx.lineTo(cx + bw / 2, y + rng.range(-2, 2));
      ctx.stroke();
    }
    ctx.restore();

    // Top face
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2, top);
    ctx.lineTo(cx - bw / 2 + 9, top - lidD);
    ctx.lineTo(cx + bw / 2 + 9, top - lidD);
    ctx.lineTo(cx + bw / 2, top);
    ctx.closePath();
    const tg = ctx.createLinearGradient(0, top - lidD, 0, top);
    tg.addColorStop(0, css(hex('#8a6941')));
    tg.addColorStop(1, css(hex('#5b442a')));
    ctx.fillStyle = tg;
    ctx.fill();
    ctx.clip();
    for (let i = 1; i < 5; i++) {
      const x = cx - bw / 2 + (i * bw) / 5;
      ctx.strokeStyle = 'rgba(16,11,7,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x + 9, top - lidD);
      ctx.stroke();
    }
    ctx.restore();

    // Iron bands and corner brackets
    ctx.fillStyle = css(hex('#2c2f35'));
    ctx.fillRect(cx - bw / 2 - 2, top + bh * 0.22, bw + 4, 7);
    ctx.fillRect(cx - bw / 2 - 2, top + bh * 0.72, bw + 4, 7);
    ctx.fillStyle = 'rgba(140,148,160,0.25)';
    ctx.fillRect(cx - bw / 2 - 2, top + bh * 0.22, bw + 4, 2);
    ctx.fillRect(cx - bw / 2 - 2, top + bh * 0.72, bw + 4, 2);
    for (const sx of [cx - bw / 2 - 2, cx + bw / 2 - 5]) {
      ctx.fillStyle = css(hex('#24272c'));
      ctx.fillRect(sx, top, 7, bh);
    }
    // Rivets
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = 'rgba(160,166,176,0.35)';
      ctx.beginPath();
      ctx.arc(cx - bw / 2 + 2 + (i * bw) / 7, top + bh * 0.22 + 3.5, 1.8, 0, TAU);
      ctx.fill();
    }
    applyRim(ctx, w, h, PAL.moon, 0.22, 2, 2.5);
  }, { radius: 34, solid: true });
}

function drawStandingStone(rng) {
  const H = rng.range(116, 164);
  const w = Math.ceil(H * 0.58);
  const h = Math.ceil(H + 20);
  return sprite(w, h, w / 2, h - 10, (ctx, ectx, lights) => {
    const cx = w / 2;
    const baseY = h - 12;
    baseAO(ctx, cx, baseY, w * 0.42);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.26, baseY);
    ctx.lineTo(cx - w * 0.2 + rng.range(-6, 6), baseY - H * 0.86);
    ctx.lineTo(cx + rng.range(-8, 8), baseY - H);
    ctx.lineTo(cx + w * 0.22 + rng.range(-6, 6), baseY - H * 0.8);
    ctx.lineTo(cx + w * 0.27, baseY);
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - w * 0.3, 0, cx + w * 0.3, 0);
    g.addColorStop(0, css(hex('#4e5359')));
    g.addColorStop(0.42, css(hex('#2f3338')));
    g.addColorStop(1, css(hex('#15181b')));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.clip();
    for (let i = 0; i < 26; i++) {
      ctx.strokeStyle = `rgba(20,22,26,${rng.range(0.15, 0.5).toFixed(2)})`;
      ctx.lineWidth = rng.range(0.8, 2.4);
      const y = baseY - rng.range(0, H);
      ctx.beginPath();
      ctx.moveTo(cx - w, y);
      ctx.lineTo(cx + w, y + rng.range(-14, 14));
      ctx.stroke();
    }
    ctx.restore();
    // Carved runes: vertical staves with angular branches. Geometry is built
    // once, then stroked three times \u2014 groove, glow, and bloom.
    const strokes = [];
    const runes = rng.int(4, 6);
    for (let i = 0; i < runes; i++) {
      const y = baseY - H * (0.26 + 0.52 * (i / runes));
      const x = cx + rng.range(-8, 8);
      strokes.push([x, y - 11, x, y + 11]);
      const arms = rng.int(2, 3);
      for (let k = 0; k < arms; k++) {
        const ay = y - 9 + ((k + 0.5) * 20) / arms + rng.range(-2, 2);
        const dir = rng.sign();
        strokes.push([x, ay, x + dir * rng.range(7, 12), ay + rng.range(-8, 8)]);
      }
    }
    const traceRunes = (c2, style, lw) => {
      c2.strokeStyle = style;
      c2.lineWidth = lw;
      c2.lineCap = 'round';
      c2.beginPath();
      for (const [x0, y0, x1, y1] of strokes) {
        c2.moveTo(x0, y0);
        c2.lineTo(x1, y1);
      }
      c2.stroke();
    };
    traceRunes(ctx, 'rgba(9,11,15,0.9)', 5);
    traceRunes(ctx, css(PAL.thunder, 0.34), 1.8);
    if (ectx) traceRunes(ectx, css(PAL.thunder, 0.4), 2.6);
    lights.push({ x: cx, y: baseY - H * 0.5, r: 150, color: PAL.thunder, i: 0.22, flicker: 0.25 });
  }, { radius: w * 0.26, solid: true, emissive: true });
}

/**
 * A slab of shore ice. Built as a faceted plate with real thickness rather
 * than a soft blob: an isometric camera can see the side of anything lying on
 * the ground, and the dark band of that side wall is what tells you the ice
 * is an object sitting on the mud instead of a pale stain in it. Straight
 * edges and a hard contour do the rest \u2014 ice fractures, it does not melt into
 * its surroundings.
 */
function drawIceFloe(rng) {
  const S = rng.range(80, 150);
  const w = Math.ceil(S * 1.6);
  const h = Math.ceil(S * 0.9);
  const thick = S * 0.1;
  return sprite(w, h, w / 2, h - 10, (ctx) => {
    const cx = w / 2;
    const cy = h - S * 0.34;

    // Angular outline \u2014 a handful of straight facets, not a smooth curve.
    const n = rng.int(7, 10);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rng.range(-0.16, 0.16);
      const rr = 1 - rng.range(0, 0.3);
      pts.push([cx + Math.cos(a) * S * 0.7 * rr, cy + Math.sin(a) * S * 0.3 * rr]);
    }
    const plate = (dy) => {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1] + dy);
      for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1] + dy);
      ctx.closePath();
    };

    // Side wall first, so the top plate sits on top of it.
    plate(thick);
    ctx.fillStyle = css(hex('#2f4152'));
    ctx.fill();

    plate(0);
    ctx.fillStyle = css(hex('#0a0d11'), 0.9);
    ctx.lineJoin = 'miter';
    ctx.lineWidth = 2;
    ctx.stroke();
    const g = ctx.createLinearGradient(cx - S * 0.5, cy - S * 0.3, cx + S * 0.4, cy + S * 0.3);
    g.addColorStop(0, css(hex('#c7d4dc')));
    g.addColorStop(0.5, css(hex('#8fa3b0')));
    g.addColorStop(1, css(hex('#5b6f7e')));
    ctx.fillStyle = g;
    ctx.fill();

    // Fractures, each a dark split with a lit lip along its upper side.
    ctx.save();
    plate(0);
    ctx.clip();
    for (let i = 0; i < 7; i++) {
      let x = cx + rng.range(-S * 0.6, S * 0.6);
      let y = cy + rng.range(-S * 0.26, S * 0.26);
      const path = [[x, y]];
      for (let k = 0; k < 3; k++) {
        x += rng.range(-S * 0.22, S * 0.22);
        y += rng.range(-S * 0.1, S * 0.1);
        path.push([x, y]);
      }
      const stroke = (off, style, lw) => {
        ctx.strokeStyle = style;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(path[0][0], path[0][1] + off);
        for (let k = 1; k < path.length; k++) ctx.lineTo(path[k][0], path[k][1] + off);
        ctx.stroke();
      };
      stroke(0, 'rgba(24,36,46,0.62)', rng.range(1, 2.2));
      stroke(-1.4, 'rgba(214,230,240,0.4)', 1);
    }
    ctx.restore();
    applyRim(ctx, w, h, PAL.frost, 0.45, 2, 2.5);
  }, { radius: S * 0.4, solid: false });
}

function drawStump(rng) {
  const w = 100;
  const h = 80;
  return sprite(w, h, w / 2, h - 8, (ctx) => {
    const cx = w / 2;
    const baseY = h - 10;
    baseAO(ctx, cx, baseY, 36);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - 30, baseY);
    ctx.lineTo(cx - 26, baseY - 40);
    ctx.lineTo(cx + 26, baseY - 42);
    ctx.lineTo(cx + 30, baseY);
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - 30, 0, cx + 30, 0);
    g.addColorStop(0, css(hex('#4a3826')));
    g.addColorStop(0.5, css(hex('#2f2417')));
    g.addColorStop(1, css(hex('#191309')));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
    // Cut face with rings
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 41, 28, 10, 0, 0, TAU);
    ctx.fillStyle = css(hex('#8a6a44'));
    ctx.fill();
    ctx.clip();
    for (let r = 26; r > 1; r -= 3.4) {
      ctx.strokeStyle = `rgba(60,42,24,${(0.2 + Math.random() * 0.3).toFixed(2)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(cx + rng.range(-1, 1), baseY - 41, r, r * 0.36, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
    // Moss skirt
    ctx.fillStyle = 'rgba(52,72,36,0.55)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 4, 34, 9, 0, 0, TAU);
    ctx.fill();
  }, { radius: 24, solid: true });
}

// ---------------------------------------------------------------------------
// Registry
// ---------------------------------------------------------------------------

const PROP_DEFS = {
  pine: (rng) => drawPine(rng, {}),
  pineSnowy: (rng) => drawPine(rng, { snowy: true }),
  pineDead: (rng) => drawPine(rng, { dead: true }),
  birch: (rng) => drawBirch(rng),
  oak: (rng) => drawOak(rng, {}),
  oakSacred: (rng) => drawOak(rng, { sacred: true, h: 300 }),
  deadTree: (rng) => drawDeadTree(rng),
  rock: (rng) => drawRock(rng, {}),
  rockMossy: (rng) => drawRock(rng, { mossy: true }),
  rockAmber: (rng) => drawRock(rng, { amber: true }),
  ruinWall: (rng) => drawRuinWall(rng, {}),
  ruinWallTall: (rng) => drawRuinWall(rng, { w: 200, h: 240 }),
  brazier: (rng) => drawBrazier(rng),
  banner: (rng) => drawBanner(rng, { white: true }),
  bannerRed: (rng) => drawBanner(rng, { white: false }),
  wreck: (rng) => drawWreck(rng),
  idol: (rng) => drawIdol(rng, {}),
  idolLit: (rng) => drawIdol(rng, { lit: true }),
  reeds: (rng) => drawReeds(rng),
  grass: (rng) => drawGrassTuft(rng),
  bones: (rng) => drawBones(rng),
  crate: (rng) => drawCrate(rng),
  standingStone: (rng) => drawStandingStone(rng),
  iceFloe: (rng) => drawIceFloe(rng),
  stump: (rng) => drawStump(rng),
};

const VARIANTS = 6;
const propCache = new Map();

function getProp(name, variant = 0) {
  const key = name + ':' + (variant % VARIANTS);
  let s = propCache.get(key);
  if (!s) {
    const def = PROP_DEFS[name];
    if (!def) throw new Error('Unknown prop ' + name);
    s = def(new RNG(name + '#' + (variant % VARIANTS)));
    propCache.set(key, s);
  }
  return s;
}

/** Pre-bakes a list of props so nothing hitches mid-fight. */
function warmProps(names) {
  for (const n of names) for (let v = 0; v < VARIANTS; v++) getProp(n, v);
}

const PROP_VARIANTS = VARIANTS;

// ---------------------------------------------------------------------------
// Zoom-resolved copies
// ---------------------------------------------------------------------------
//
// Props never change size during play, so resampling them every frame is pure
// waste. We keep one copy per variant already scaled to the current zoom and
// blit it 1:1 \u2014 which in software rasterisation is several times cheaper than
// a filtered scale, and free on a GPU.

const scaledCache = new Map();
let scaledZoom = -1;

function getScaledProp(name, variant, zoom, flip = 0) {
  if (Math.abs(zoom - scaledZoom) > 0.015) {
    scaledCache.clear();
    scaledZoom = zoom;
  }
  const key = name + ':' + (variant % VARIANTS) + ':' + flip;
  let s = scaledCache.get(key);
  if (s) return s;
  const src = getProp(name, variant);
  const w = Math.max(1, Math.round(src.w * zoom));
  const h = Math.max(1, Math.round(src.h * zoom));
  const blit = (source) => {
    const c = makeCanvas(w, h);
    const cc = ctxOf(c);
    cc.imageSmoothingQuality = 'high';
    if (flip) {
      cc.translate(w, 0);
      cc.scale(-1, 1);
    }
    cc.drawImage(source, 0, 0, w, h);
    return c;
  };
  s = {
    canvas: blit(src.canvas),
    emissive: src.emissive ? blit(src.emissive) : null,
    ox: flip ? w - src.ox * zoom : src.ox * zoom,
    oy: src.oy * zoom,
    w,
    h,
    lights: src.lights,
    radius: src.radius,
    solid: src.solid,
    sway: src.sway,
  };
  scaledCache.set(key, s);
  return s;
}

function clearScaledProps() {
  scaledCache.clear();
  scaledZoom = -1;
}

// ===== src/core/input.js =============================================
// Touch-first input. A floating stick on the left half of the screen, round
// buttons on the right that the HUD registers each frame, and a full keyboard
// and mouse fallback so the game is playable on a desktop too.

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.buttons = new Map(); // id -> {x, y, r} in CSS pixels
    this.down = new Set();
    this.justDown = new Set();
    this.justUp = new Set();
    this.pointers = new Map(); // pointerId -> {role, buttonId, x, y}
    this.stick = { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0, mag: 0 };
    this.move = { x: 0, y: 0, mag: 0 };
    this.tap = null; // {x, y} in CSS pixels, consumed by the game
    this.pointerCss = { x: 0, y: 0 };
    this.keys = new Set();
    this.enabled = true;
    this.stickRadius = 62;
    this.leftZone = 0.5;

    const opts = { passive: false };
    canvas.addEventListener('pointerdown', (e) => this.onDown(e), opts);
    canvas.addEventListener('pointermove', (e) => this.onMove(e), opts);
    canvas.addEventListener('pointerup', (e) => this.onUp(e), opts);
    canvas.addEventListener('pointercancel', (e) => this.onUp(e), opts);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', (e) => this.onKey(e, true));
    window.addEventListener('keyup', (e) => this.onKey(e, false));
    window.addEventListener('blur', () => {
      this.keys.clear();
      this.down.clear();
      this.pointers.clear();
      this.stick.active = false;
    });
  }

  setButtons(list) {
    this.buttons.clear();
    for (const b of list) this.buttons.set(b.id, b);
  }

  hitButton(x, y) {
    let best = null;
    let bestD = Infinity;
    for (const [id, b] of this.buttons) {
      if (b.disabled) continue;
      if (b.box) {
        // Rectangular controls test their real bounds; a bounding circle would
        // swallow taps meant for the button next to them.
        const p = 4;
        if (x < b.box.x - p || x > b.box.x + b.box.w + p) continue;
        if (y < b.box.y - p || y > b.box.y + b.box.h + p) continue;
        const d = Math.hypot(x - b.x, y - b.y);
        if (d < bestD) {
          bestD = d;
          best = id;
        }
        continue;
      }
      const d = Math.hypot(x - b.x, y - b.y);
      const r = b.r * (b.pad || 1.18);
      if (d < r && d < bestD) {
        bestD = d;
        best = id;
      }
    }
    return best;
  }

  press(id) {
    if (!this.down.has(id)) this.justDown.add(id);
    this.down.add(id);
  }

  release(id) {
    if (this.down.has(id)) this.justUp.add(id);
    this.down.delete(id);
  }

  onDown(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.canvas.setPointerCapture?.(e.pointerId);
    const x = e.clientX;
    const y = e.clientY;
    this.pointerCss.x = x;
    this.pointerCss.y = y;
    const hit = this.hitButton(x, y);
    if (hit) {
      this.pointers.set(e.pointerId, { role: 'button', buttonId: hit, x, y });
      this.press(hit);
      return;
    }
    if (x < window.innerWidth * this.leftZone && !this.stick.active) {
      this.stick.active = true;
      this.stick.id = e.pointerId;
      this.stick.ox = x;
      this.stick.oy = y;
      this.stick.x = 0;
      this.stick.y = 0;
      this.stick.mag = 0;
      this.pointers.set(e.pointerId, { role: 'stick', x, y });
      return;
    }
    this.pointers.set(e.pointerId, { role: 'tap', x, y, t: performance.now() });
    this.tap = { x, y };
    this.press('worldTap');
  }

  onMove(e) {
    if (!this.enabled) return;
    const p = this.pointers.get(e.pointerId);
    this.pointerCss.x = e.clientX;
    this.pointerCss.y = e.clientY;
    if (!p) return;
    e.preventDefault();
    p.x = e.clientX;
    p.y = e.clientY;
    if (p.role === 'stick') {
      let dx = e.clientX - this.stick.ox;
      let dy = e.clientY - this.stick.oy;
      const d = Math.hypot(dx, dy);
      const R = this.stickRadius;
      if (d > R) {
        // Drag the origin along so the stick never feels stuck at the edge.
        this.stick.ox += (dx / d) * (d - R);
        this.stick.oy += (dy / d) * (d - R);
        dx = (dx / d) * R;
        dy = (dy / d) * R;
      }
      this.stick.x = dx / R;
      this.stick.y = dy / R;
      this.stick.mag = Math.min(1, d / R);
    } else if (p.role === 'tap') {
      this.tap = { x: e.clientX, y: e.clientY };
    }
  }

  onUp(e) {
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    if (p.role === 'button') this.release(p.buttonId);
    if (p.role === 'stick') {
      this.stick.active = false;
      this.stick.x = this.stick.y = this.stick.mag = 0;
    }
    if (p.role === 'tap') this.release('worldTap');
    this.pointers.delete(e.pointerId);
  }

  onKey(e, isDown) {
    const k = e.key.toLowerCase();
    if (isDown) this.keys.add(k);
    else this.keys.delete(k);
    const map = {
      '1': 'skill1',
      '2': 'skill2',
      '3': 'skill3',
      '4': 'skill4',
      q: 'potion',
      ' ': 'dash',
      e: 'interact',
      i: 'inventory',
      c: 'character',
      escape: 'menu',
    };
    const act = map[k];
    if (act) {
      if (isDown) this.press(act);
      else this.release(act);
      e.preventDefault();
    }
    if (k === 'f' || k === 'j') {
      if (isDown) this.press('attack');
      else this.release('attack');
    }
  }

  /** Called once per frame, after the game has read the state. */
  update() {
    // Keyboard movement folds into the same vector as the stick.
    let kx = 0;
    let ky = 0;
    if (this.keys.has('a') || this.keys.has('arrowleft')) kx -= 1;
    if (this.keys.has('d') || this.keys.has('arrowright')) kx += 1;
    if (this.keys.has('w') || this.keys.has('arrowup')) ky -= 1;
    if (this.keys.has('s') || this.keys.has('arrowdown')) ky += 1;
    if (kx || ky) {
      const l = Math.hypot(kx, ky);
      this.move.x = kx / l;
      this.move.y = ky / l;
      this.move.mag = 1;
    } else if (this.stick.active && this.stick.mag > 0.08) {
      const l = Math.hypot(this.stick.x, this.stick.y) || 1;
      this.move.x = this.stick.x / l;
      this.move.y = this.stick.y / l;
      this.move.mag = this.stick.mag;
    } else {
      this.move.x = this.move.y = this.move.mag = 0;
    }
  }

  endFrame() {
    this.justDown.clear();
    this.justUp.clear();
    this.tap = null;
  }

  isDown(id) {
    return this.down.has(id);
  }
  wasPressed(id) {
    return this.justDown.has(id);
  }
  wasReleased(id) {
    return this.justUp.has(id);
  }
}

// ===== src/core/audio.js =============================================
// All sound is synthesised in the browser \u2014 no audio files anywhere.
// Impacts are filtered noise bursts, spells are swept oscillators, and the
// score is a slow drone in D minor with a war drum that only wakes up when
// something is trying to kill you.

const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);

class Audio {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.muted = false;
    this.masterVol = 0.8;
    this.musicVol = 0.34;
    this.sfxVol = 0.75;
    this.tension = 0;
    this._noise = null;
    this._lastPlay = new Map();
  }

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;

    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.masterVol;

    this.comp = ctx.createDynamicsCompressor();
    this.comp.threshold.value = -14;
    this.comp.knee.value = 24;
    this.comp.ratio.value = 8;
    this.comp.attack.value = 0.004;
    this.comp.release.value = 0.22;

    this.sfxBus = ctx.createGain();
    this.sfxBus.gain.value = this.sfxVol;
    this.musicBus = ctx.createGain();
    this.musicBus.gain.value = 0;

    // A short plate-ish reverb baked from noise; gives the caves and forests
    // a bit of space without shipping an impulse response.
    this.verb = ctx.createConvolver();
    this.verb.buffer = this.makeImpulse(2.4, 3.2);
    this.verbGain = ctx.createGain();
    this.verbGain.gain.value = 0.3;

    this.sfxBus.connect(this.comp);
    this.sfxBus.connect(this.verbGain);
    this.verbGain.connect(this.verb);
    this.verb.connect(this.comp);
    this.musicBus.connect(this.comp);
    this.comp.connect(this.master);
    this.master.connect(ctx.destination);

    this._noise = this.makeNoise(2);
    this.ready = true;
    this.startMusic();
  }

  makeImpulse(dur, decay) {
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  makeNoise(seconds) {
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : this.masterVol;
  }

  now() {
    return this.ctx ? this.ctx.currentTime : 0;
  }

  /** Rate-limits a sound so twenty simultaneous hits don't clip. */
  throttle(key, ms) {
    const t = performance.now();
    const last = this._lastPlay.get(key) || 0;
    if (t - last < ms) return false;
    this._lastPlay.set(key, t);
    return true;
  }

  noiseSource(playbackRate = 1) {
    const s = this.ctx.createBufferSource();
    s.buffer = this._noise;
    s.loop = true;
    s.playbackRate.value = playbackRate;
    return s;
  }

  /** Core helper: noise through a band-pass with an envelope. */
  noiseHit(opts) {
    if (!this.ready) return;
    const { freq = 800, q = 1.2, dur = 0.14, gain = 0.5, type = 'bandpass', sweep = 0, delay = 0 } = opts;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + delay;
    const src = this.noiseSource(opts.rate || 1);
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.Q.value = q;
    f.frequency.setValueAtTime(freq, t0);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f);
    f.connect(g);
    g.connect(this.sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  }

  tone(opts) {
    if (!this.ready) return;
    const {
      freq = 440,
      to = null,
      dur = 0.2,
      gain = 0.3,
      type = 'sine',
      delay = 0,
      detune = 0,
      attack = 0.005,
    } = opts;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
    o.detune.value = detune;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(this.sfxBus);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }

  // -- the sound set --------------------------------------------------------

  play(name, opts = {}) {
    if (!this.ready) return;
    const v = opts.vol ?? 1;
    switch (name) {
      case 'swing':
        if (!this.throttle('swing', 60)) return;
        this.noiseHit({ freq: 2600, q: 0.8, dur: 0.17, gain: 0.14 * v, sweep: 0.22 });
        break;
      case 'hitFlesh':
        if (!this.throttle('hitFlesh', 40)) return;
        this.noiseHit({ freq: 320, q: 1.1, dur: 0.13, gain: 0.4 * v, sweep: 0.4 });
        this.tone({ freq: 90, to: 46, dur: 0.11, gain: 0.22 * v, type: 'triangle' });
        break;
      case 'hitArmor':
        if (!this.throttle('hitArmor', 40)) return;
        this.noiseHit({ freq: 3400, q: 2.4, dur: 0.19, gain: 0.24 * v, sweep: 0.3 });
        this.tone({ freq: 1200, to: 420, dur: 0.13, gain: 0.14 * v, type: 'square' });
        break;
      case 'hitBone':
        this.noiseHit({ freq: 1500, q: 3, dur: 0.11, gain: 0.3 * v, sweep: 0.25 });
        break;
      case 'crit':
        this.noiseHit({ freq: 900, q: 0.8, dur: 0.26, gain: 0.5 * v, sweep: 0.18 });
        this.tone({ freq: 160, to: 55, dur: 0.24, gain: 0.3 * v, type: 'sawtooth' });
        break;
      case 'hurt':
        this.tone({ freq: 220, to: 110, dur: 0.28, gain: 0.26 * v, type: 'sawtooth' });
        this.noiseHit({ freq: 500, q: 0.7, dur: 0.2, gain: 0.22 * v, sweep: 0.4 });
        break;
      case 'death':
        this.tone({ freq: 180, to: 42, dur: 0.7, gain: 0.3 * v, type: 'sawtooth' });
        this.noiseHit({ freq: 700, q: 0.6, dur: 0.6, gain: 0.24 * v, sweep: 0.15 });
        break;
      case 'monsterDie':
        if (!this.throttle('monsterDie', 50)) return;
        this.tone({ freq: 260 + Math.random() * 90, to: 60, dur: 0.42, gain: 0.2 * v, type: 'sawtooth' });
        this.noiseHit({ freq: 420, q: 0.8, dur: 0.35, gain: 0.2 * v, sweep: 0.25 });
        break;
      case 'growl':
        if (!this.throttle('growl', 400)) return;
        this.tone({ freq: 78, to: 52, dur: 0.6, gain: 0.2 * v, type: 'sawtooth' });
        this.noiseHit({ freq: 200, q: 1.6, dur: 0.55, gain: 0.14 * v, sweep: 0.7 });
        break;
      case 'fire':
        this.noiseHit({ freq: 900, q: 0.5, dur: 0.5, gain: 0.3 * v, sweep: 0.2 });
        this.tone({ freq: 320, to: 90, dur: 0.4, gain: 0.16 * v, type: 'sawtooth' });
        break;
      case 'frost':
        this.noiseHit({ freq: 5200, q: 4, dur: 0.4, gain: 0.2 * v, sweep: 0.35 });
        this.tone({ freq: 1400, to: 620, dur: 0.35, gain: 0.12 * v, type: 'triangle' });
        break;
      case 'thunder':
        this.noiseHit({ freq: 2400, q: 0.6, dur: 0.1, gain: 0.5 * v, sweep: 0.1 });
        this.tone({ freq: 70, to: 30, dur: 0.8, gain: 0.34 * v, type: 'sawtooth', delay: 0.02 });
        this.noiseHit({ freq: 400, q: 0.4, dur: 0.9, gain: 0.24 * v, sweep: 0.3, delay: 0.03 });
        break;
      case 'holy':
        for (let i = 0; i < 3; i++) {
          this.tone({ freq: NOTE(74 + i * 5), dur: 0.9, gain: 0.1 * v, type: 'sine', delay: i * 0.04, attack: 0.08 });
        }
        break;
      case 'cast':
        this.tone({ freq: 300, to: 900, dur: 0.25, gain: 0.16 * v, type: 'triangle' });
        break;
      case 'dash':
        this.noiseHit({ freq: 1800, q: 0.6, dur: 0.24, gain: 0.2 * v, sweep: 0.2 });
        break;
      case 'potion':
        this.tone({ freq: 500, to: 1300, dur: 0.3, gain: 0.2 * v, type: 'sine' });
        this.noiseHit({ freq: 2600, q: 3, dur: 0.2, gain: 0.1 * v, sweep: 1.6 });
        break;
      case 'coin':
        if (!this.throttle('coin', 45)) return;
        this.tone({ freq: 1900 + Math.random() * 500, to: 2700, dur: 0.1, gain: 0.1 * v, type: 'square' });
        break;
      case 'loot':
        this.tone({ freq: NOTE(76), dur: 0.28, gain: 0.14 * v, type: 'sine' });
        this.tone({ freq: NOTE(83), dur: 0.36, gain: 0.11 * v, type: 'sine', delay: 0.07 });
        break;
      case 'legendary':
        for (let i = 0; i < 4; i++) {
          this.tone({ freq: NOTE(69 + i * 4), dur: 1.2, gain: 0.13 * v, type: 'triangle', delay: i * 0.09, attack: 0.02 });
        }
        this.noiseHit({ freq: 6000, q: 2, dur: 1.1, gain: 0.09 * v, sweep: 0.2 });
        break;
      case 'levelUp':
        for (let i = 0; i < 5; i++) {
          this.tone({ freq: NOTE(62 + i * 4), dur: 0.7, gain: 0.14 * v, type: 'triangle', delay: i * 0.075 });
        }
        break;
      case 'ui':
        this.tone({ freq: 620, to: 760, dur: 0.06, gain: 0.1 * v, type: 'square' });
        break;
      case 'uiBig':
        this.tone({ freq: 180, to: 300, dur: 0.24, gain: 0.16 * v, type: 'triangle' });
        break;
      case 'portal':
        this.tone({ freq: 120, to: 900, dur: 1.4, gain: 0.16 * v, type: 'sine', attack: 0.3 });
        this.noiseHit({ freq: 700, q: 1.2, dur: 1.4, gain: 0.14 * v, sweep: 3 });
        break;
      case 'bossRoar':
        this.tone({ freq: 62, to: 34, dur: 1.6, gain: 0.4 * v, type: 'sawtooth' });
        this.tone({ freq: 94, to: 52, dur: 1.5, gain: 0.24 * v, type: 'square', delay: 0.05 });
        this.noiseHit({ freq: 300, q: 0.8, dur: 1.7, gain: 0.26 * v, sweep: 0.4 });
        break;
      case 'chest':
        this.noiseHit({ freq: 1400, q: 1.4, dur: 0.3, gain: 0.24 * v, sweep: 0.3 });
        this.tone({ freq: 260, to: 520, dur: 0.4, gain: 0.14 * v, type: 'triangle' });
        break;
      case 'shatter':
        this.noiseHit({ freq: 4200, q: 1.8, dur: 0.4, gain: 0.28 * v, sweep: 0.25 });
        break;
      case 'step':
        if (!this.throttle('step', 130)) return;
        this.noiseHit({ freq: 260 + Math.random() * 160, q: 1.4, dur: 0.09, gain: 0.06 * v, sweep: 0.5 });
        break;
    }
  }

  // -- music ----------------------------------------------------------------

  startMusic() {
    const ctx = this.ctx;
    if (!ctx || this.musicStarted) return;
    this.musicStarted = true;

    // Two detuned saw drones an octave apart, gently filtered \u2014 the bed.
    this.droneGain = ctx.createGain();
    this.droneGain.gain.value = 0.5;
    this.droneFilter = ctx.createBiquadFilter();
    this.droneFilter.type = 'lowpass';
    this.droneFilter.frequency.value = 420;
    this.droneFilter.Q.value = 1.1;
    this.droneGain.connect(this.droneFilter);
    this.droneFilter.connect(this.musicBus);

    this.droneOsc = [];
    const root = NOTE(38); // D2
    for (const [mult, det, g] of [
      [1, -7, 0.3],
      [1, 6, 0.28],
      [2, 3, 0.16],
      [3, -4, 0.08],
    ]) {
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = root * mult;
      o.detune.value = det;
      const og = ctx.createGain();
      og.gain.value = g;
      o.connect(og);
      og.connect(this.droneGain);
      o.start();
      this.droneOsc.push({ o, og, mult });
    }

    // Wind: filtered noise with a slowly wandering cutoff.
    const wind = this.noiseSource(0.35);
    const wf = ctx.createBiquadFilter();
    wf.type = 'bandpass';
    wf.frequency.value = 500;
    wf.Q.value = 0.7;
    this.windGain = ctx.createGain();
    this.windGain.gain.value = 0.1;
    wind.connect(wf);
    wf.connect(this.windGain);
    this.windGain.connect(this.musicBus);
    wind.start();
    this.windFilter = wf;

    // A choir-ish pad that fades in during boss fights.
    this.padGain = ctx.createGain();
    this.padGain.gain.value = 0;
    this.padGain.connect(this.musicBus);
    for (const n of [50, 53, 57, 62]) {
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = NOTE(n);
      o.detune.value = (Math.random() - 0.5) * 14;
      const g = ctx.createGain();
      g.gain.value = 0.08;
      o.connect(g);
      g.connect(this.padGain);
      o.start();
    }

    this.musicBus.gain.setTargetAtTime(this.musicVol, ctx.currentTime, 2.5);
    this.nextBeat = ctx.currentTime + 1;
    this.beat = 0;
  }

  /** Drives the drum and the harmonic drift. Call every frame. */
  update(dt, tension) {
    if (!this.ready) return;
    const ctx = this.ctx;
    this.tension += (tension - this.tension) * Math.min(1, dt * 1.5);
    const T = this.tension;

    if (this.droneFilter) {
      this.droneFilter.frequency.setTargetAtTime(360 + T * 900, ctx.currentTime, 0.4);
    }
    if (this.windFilter) {
      this.windFilter.frequency.setTargetAtTime(
        420 + Math.sin(ctx.currentTime * 0.13) * 260,
        ctx.currentTime,
        1.2
      );
    }
    if (this.padGain) {
      this.padGain.gain.setTargetAtTime(T > 0.75 ? 0.5 : 0, ctx.currentTime, 1.5);
    }

    // War drum, faster and louder the deeper the trouble.
    const bpm = 52 + T * 34;
    const interval = 60 / bpm;
    while (ctx.currentTime > this.nextBeat) {
      this.nextBeat += interval;
      this.beat++;
      if (T < 0.12 && this.beat % 4 !== 0) continue;
      const strong = this.beat % 4 === 0;
      const g = (strong ? 0.3 : 0.13) * (0.35 + T);
      this.tone({
        freq: strong ? 68 : 54,
        to: strong ? 34 : 30,
        dur: strong ? 0.36 : 0.2,
        gain: g * 0.55,
        type: 'sine',
      });
      this.noiseHit({ freq: 180, q: 1.1, dur: 0.16, gain: g * 0.28, sweep: 0.4 });
    }
  }

  /** Shifts the drone to a new root for a new act. */
  setKey(semitone) {
    if (!this.droneOsc) return;
    const root = NOTE(semitone);
    for (const d of this.droneOsc) {
      d.o.frequency.setTargetAtTime(root * d.mult, this.ctx.currentTime, 1.5);
    }
  }
}

const SUFFIX_PLACES = [
  'vom Haff', 'aus Romuva', 'von Marienwerder', 'aus dem Moor', 'der Rominte',
  'von der Nehrung', 'aus K\u00f6nigsberg', 'der Eiche', 'des Ordens', 'der Heide',
];

// ---------------------------------------------------------------------------
// Progression
// ---------------------------------------------------------------------------

const MAX_LEVEL = 40;

function xpForLevel(level) {
  // Tuned so a straight run through the five acts lands around level 30, and
  // the Eternal Hunt carries the last stretch to 40.
  return Math.round(46 * Math.pow(level, 1.55) + 30 * level);
}

function monsterLevelFor(actIndex, progress) {
  const act = ACTS[actIndex];
  const [a, b] = act.levelRange;
  return Math.round(a + (b - a) * progress);
}

// ===== src/game/worldgen.js ==========================================
// Zone generation. Each act is a bounded region with a wandering road, a
// handful of clearings, camps of monsters, a shrine or two, and a boss arena
// at the far end. Everything derives from the act seed so a run is repeatable.





/** Clear space guaranteed between solid props \u2014 a little wider than the player. */
const PASSAGE = 62;

class Zone {
  constructor(act, actIndex, seed) {
    this.act = act;
    this.actIndex = actIndex;
    this.seed = seed;
    this.rng = new RNG(seed);
    this.size = act.size;
    this.half = act.size / 2;
    this.props = [];
    this.spawnPoints = [];
    this.camps = [];
    this.shrines = [];
    this.chests = [];
    this.lights = [];
    this.start = { x: 0, y: 0 };
    this.bossArena = { x: 0, y: 0, r: 460 };
    this.portal = null;
    this.generate();
  }

  inBounds(x, y) {
    return Math.abs(x) < this.half - 60 && Math.abs(y) < this.half - 60;
  }

  /** Distance from the walkable road network \u2014 used to keep paths clear. */
  roadDist(x, y) {
    let best = Infinity;
    for (let i = 1; i < this.road.length; i++) {
      const a = this.road[i - 1];
      const b = this.road[i];
      const abx = b.x - a.x;
      const aby = b.y - a.y;
      const l2 = abx * abx + aby * aby || 1;
      const t = clamp01(((x - a.x) * abx + (y - a.y) * aby) / l2);
      const d = Math.hypot(x - (a.x + abx * t), y - (a.y + aby * t));
      if (d < best) best = d;
    }
    return best;
  }

  generate() {
    const rng = this.rng;
    const S = this.size;
    const H = this.half;

    // --- the road: a wandering spine from the south edge to the boss ------
    this.start = { x: rng.range(-H * 0.3, H * 0.3), y: H - 320 };
    const end = { x: rng.range(-H * 0.35, H * 0.35), y: -H + 420 };
    this.bossArena = { x: end.x, y: end.y, r: 430 };

    const road = [{ ...this.start }];
    const steps = 9;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const wob = Math.sin(t * 5.3 + rng.float() * 3) * H * 0.36 * (1 - Math.abs(t - 0.5));
      road.push({
        x: lerp(this.start.x, end.x, t) + wob + rng.range(-90, 90),
        y: lerp(this.start.y, end.y, t) + rng.range(-70, 70),
      });
    }
    road[road.length - 1] = { ...end };
    this.road = road;

    // --- scatter props ----------------------------------------------------
    const props = this.act.props;
    const totalW = props.reduce((a, p) => a + p.w, 0);
    // Density is driven by a big noise field so the zone has thickets and
    // open ground instead of an even sprinkle.
    // Density is deliberately sparse: a wall of trees both hides the fight and
    // eats the frame budget in overdraw.
    const target = Math.round((S * S) / 12000);
    let attempts = 0;
    const placed = [];
    while (placed.length < target && attempts < target * 8) {
      attempts++;
      const x = rng.range(-H + 40, H - 40);
      const y = rng.range(-H + 40, H - 40);
      const density = clamp01(warpFbm(x * 0.0011, y * 0.0011, 1.7, 4) * 0.9 + 0.5);
      if (rng.float() > Math.pow(density, 3.2) * 1.9) continue;

      const rd = this.roadDist(x, y);
      if (rd < 105) continue;
