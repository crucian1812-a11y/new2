# Publishes the game to GitHub Pages. The site needs no build — index.html
# loads plain ES modules — so this only assembles the files the browser
# actually asks for, plus the single-file bundle as a downloadable copy.
#
# Pages serves this repo from the `gh-pages` branch, so the job pushes the
# assembled site there rather than using the deploy-pages action, which only
# works when Pages is configured with GitHub Actions as its source.
name: Pages

on:
  push:
    branches: [claude/hero-journey-game-p69u3c]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r src _site/
          node tools/bundle.mjs _site/spiel.html
          touch _site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
