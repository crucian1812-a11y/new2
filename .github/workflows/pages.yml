# Publishes the game to GitHub Pages. The site needs no build — index.html
# loads plain ES modules — so this only assembles the files the browser
# actually asks for, plus the single-file bundle as a downloadable copy.
name: Pages

on:
  push:
    branches: [claude/hero-journey-game-p69u3c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r src _site/
          node tools/bundle.mjs _site/spiel.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
